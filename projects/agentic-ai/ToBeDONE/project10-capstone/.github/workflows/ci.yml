name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:          # the deploy workflow reuses this one

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests (fake model, no API key needed)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t agent-platform:ci .
      - name: The container starts and answers
        run: |
          docker run -d --name app -p 8000:8000 \
            -e API_KEYS_JSON='{"ci-customer-key-0000000000":{"id":"c1","role":"customer","account_id":"A-1001"}}' \
            agent-platform:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break || sleep 1; done
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/chat -H 'Content-Type: application/json' -d '{"message":"hi"}')" = "401"
      - name: Container logs
        if: always()
        run: docker logs app

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
