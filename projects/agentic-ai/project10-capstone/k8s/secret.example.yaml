# EXAMPLE ONLY. Do not commit real values. Create the secret from the command line, or better, sync it
# from AWS Secrets Manager with the External Secrets Operator or the Secrets Store CSI driver:
#
#   kubectl create secret generic agent-platform-secrets \
#     --from-literal=ANTHROPIC_API_KEY='your_anthropic_key' \
#     --from-file=API_KEYS_JSON=./api_keys.json
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: replace-me
  API_KEYS_JSON: '{"replace-with-a-long-random-key":{"id":"cust-1","role":"customer","account_id":"A-1001"}}'
