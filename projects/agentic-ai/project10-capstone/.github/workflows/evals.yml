name: Agent evals (real model)

# These call the real model and cost a few cents, so they run by hand or once a night,
# not on every commit. Add the secret ANTHROPIC_API_KEY under Settings -> Secrets.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"      # 03:00 India time

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python evals/run_evals.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
