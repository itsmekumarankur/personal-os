<script>
const md = "# Load Balancer — 26-Point Revision Notes (Enhanced)\n\nBelow are **26 compact revision points** designed to preserve the key judgment calls without turning this into a huge set of notes.\n\n---\n\n## Load Balancer — 26-Point Revision Notes\n\n---\n\n### 1. L4 vs L7 — decide the layer first\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                        L4 vs L7                               │\n├───────────────────────────────┬─────────────────────────────────┤\n│         L4 (TCP/UDP)          │          L7 (HTTP/gRPC)        │\n├───────────────────────────────┼─────────────────────────────────┤\n│ • Sees IP, port, connections  │ • Sees host, path, headers     │\n│ • Forwards packets/connections│   cookies, method              │\n│ • Blind to request content    │ • Can make per-request decisions│\n│ • Fast, cheap, simple         │ • Rich, content-aware, heavier │\n│ • Balances CONNECTIONS        │ • Can balance REQUESTS         │\n└───────────────────────────────┴─────────────────────────────────┘\n\n        Client ──TCP conn──► LB ──TCP conn──► Backend\n        Client ──HTTP req──► LB (reads path/headers) ──► Backend\n```\n\n**Key insight:** Choosing the algorithm before choosing the layer is the wrong starting point.\n\n---\n\n### 2. Why L4 can be unfair\n\n```\n        1 TCP Connection\n        ┌─────────────────────────────────────────────┐\n        │  Request 1 ──► Server A                     │\n        │  Request 2 ──► Server A                     │\n        │  Request 3 ──► Server A                     │\n        │     ...                                     │\n        │  Request 10,000 ──► Server A               │\n        └─────────────────────────────────────────────┘\n\n        Server A: ████████████████████████████████████  (overloaded)\n        Server B: ████                                 (idle)\n        Server C: ████                                 (idle)\n```\n\nThis isn't an LB bug; it's a consequence of balancing at connection level.\n\n- L4 is still valuable because it is **fast, cheap, protocol-agnostic, and simple**\n- It works well when request volumes are similar across connections\n\n---\n\n### 3. L4 + L7 can coexist (layered design)\n\n```\n                    ┌─────────────────┐\n                    │    Client       │\n                    └────────┬────────┘\n                             │\n                             ▼\n                    ┌─────────────────┐\n                    │   L4 LB         │  ← Fast edge, connection-level\n                    │   (VIP/Anycast) │     Absorbs DDoS, connection flood\n                    └────────┬────────┘\n                             │\n                             ▼\n                    ┌─────────────────┐\n                    │   L7 LB         │  ← Smart HTTP routing\n                    │   (HAProxy/NGINX)│     Reads host/path/headers\n                    └────────┬────────┘\n                             │\n              ┌──────────────┼──────────────┐\n              ▼              ▼              ▼\n        ┌─────────┐   ┌─────────┐   ┌─────────┐\n        │ Service │   │ Service │   │ Service │\n        │   A     │   │   B     │   │   C     │\n        └─────────┘   └─────────┘   └─────────┘\n```\n\n**Question:** Don't ask \"L4 or L7 for everything?\"  \n**Ask:** \"Which layer should own which responsibility?\"\n\n---\n\n### 4. Traffic entry is a separate availability problem\n\n```\n        ┌──────────────────────────────────────────────────────────────┐\n        │              TRAFFIC ENTRY MODELS                          │\n        ├──────────────────────────────────────────────────────────────┤\n        │ 1. DNS-based:      client ──DNS lookup──► LB IP           │\n        │    (coarse, TTL-limited failover)                         │\n        │                                                           │\n        │ 2. Anycast:        same IP announced from many locations  │\n        │    (network routes to nearest healthy)                    │\n        │                                                           │\n        │ 3. Virtual IP (VIP): floating IP moves to healthy LB node │\n        │    (fast failover, transparent to clients)                │\n        │                                                           │\n        │ 4. ECMP + multiple LB nodes: router spreads flows         │\n        │    (active-active, scale-out)                             │\n        └──────────────────────────────────────────────────────────────┘\n\n        Client ──► DNS/Anycast/VIP/ECMP ──► LB ──► Backend Pool\n```\n\n- Backend balancing assumes the LB is already reachable\n- If the LB itself dies, backend-selection logic is irrelevant\n\n---\n\n### 5. DNS vs VIP/Anycast — failover behavior\n\n```\n        DNS Failover:\n        ┌─────────┐      ┌─────────┐\n        │ Client  │──────►│ DNS     │  \"LB IP = 10.0.0.1\"\n        └─────────┘      └─────────┘\n                              │\n                              ▼ TTL = 300s\n        ┌─────────┐      ┌─────────┐\n        │ Client  │──────►│ LB      │  10.0.0.1 dies\n        └─────────┘      └─────────┘   Client keeps trying dead IP\n                              │        until cache expires!\n                              ▼\n        Death + 300s = failover\n\n        VIP Failover:\n        ┌─────────┐      ┌─────────┐\n        │ Client  │──────►│ LB1     │  10.0.0.1 (VIP) dies\n        └─────────┘      └─────────┘\n                              │\n                              ▼ (seconds, not minutes)\n        ┌─────────┐      ┌─────────┐\n        │ Client  │──────►│ LB2     │  VIP moves to LB2\n        └─────────┘      └─────────┘  Client IP never changes\n```\n\n**Why VIP/Anycast wins:** Network-level failover is more transparent/faster than DNS failover.\n\n---\n\n### 6. Backend discovery = source of truth\n\n```\n        STATIC CONFIG                    DYNAMIC DISCOVERY\n        ┌─────────────────┐             ┌─────────────────┐\n        │ Load Balancer   │             │ Load Balancer   │\n        │                 │             │                 │\n        │ S1, S2, S3      │             │ ──► Registry   │\n        │ (hardcoded)     │             │ ──► Control    │\n        └─────────────────┘             │    Plane       │\n              │                         └─────────────────┘\n              ▼                              │\n        Simple but stale             Complex but reflects reality\n        Human edits                    Autoscaling, rolling deploys\n        Can't keep up                 Self-registration possible\n```\n\n**Discovery answers:** \"Does this backend exist?\"  \n**It does NOT automatically answer:** \"Can it serve traffic now?\"\n\n---\n\n### 7. Discovery and health are different\n\n```\n        ┌─────────────────────────────────────────────────────────────┐\n        │         Discovery vs Health — Different Questions         │\n        ├─────────────────────────────────────────────────────────────┤\n        │                                                           │\n        │   Registry says:    \"S1 exists\"                           │\n        │                          │                                │\n        │                          ▼                                │\n        │   Health Check says: \"S1 is ready\"                        │\n        │                          │                                │\n        │                          ▼                                │\n        │   LB Pool says:     \"S1 is eligible for traffic\"         │\n        │                                                           │\n        └─────────────────────────────────────────────────────────────┘\n\n        BEFORE TRAFFIC:     Registered ──► Warming Up ──► Ready\n                              (exists)       (not ready)   (eligible)\n```\n\n**Key point:** A warming-up server shouldn't receive traffic just because it registered.  \nStale registry can be tolerated with eventual consistency, but may delay discovering/removing capacity.\n\n---\n\n### 8. Backend selection — balance the right resource\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                    SELECTION ALGORITHMS                           │\n        ├─────────────────────┬───────────────────────────────────────────────┤\n        │ ROUND ROBIN        │ R1→S1, R2→S2, R3→S3, R4→S1, R5→S2...        │\n        │                    │ Simple, assumes similar request cost          │\n        ├─────────────────────┼───────────────────────────────────────────────┤\n        │ LEAST CONNECTIONS  │ S1=200, S2=50, S3=120 → new req → S2         │\n        │                    │ Useful when connections ≈ work                │\n        ├─────────────────────┼───────────────────────────────────────────────┤\n        │ WEIGHTED           │ S1:5, S2:2, S3:1                             │\n        │                    │ S1 S1 S1 S1 S1 S2 S2 S3                       │\n        │                    │ Useful for heterogeneous capacity             │\n        ├─────────────────────┼───────────────────────────────────────────────┤\n        │ HASH-BASED         │ hash(client_id) → backend                     │\n        │                    │ A→S2, B→S1, C→S2 (stable mapping)             │\n        ├─────────────────────┼───────────────────────────────────────────────┤\n        │ LATENCY-AWARE      │ Routes to fastest responding backend          │\n        │                    │ Needs damping to avoid oscillation            │\n        └─────────────────────┴───────────────────────────────────────────────┘\n```\n\n**Senior question:** \"What resource is actually scarce on my backends?\"\n\n---\n\n### 9. Round robin isn't automatically fair\n\n```\n        ┌─────────────────────────────────────────────────────────────────┐\n        │          Round Robin assumes every request is equal            │\n        ├─────────────────────────────────────────────────────────────────┤\n        │                                                                 │\n        │   Request 1: GET /health (1ms)    ──► Server A                 │\n        │   Request 2: GET /health (1ms)    ──► Server B                 │\n        │   Request 3: POST /report (30s)   ──► Server C  ◄── overloaded!│\n        │   Request 4: GET /health (1ms)    ──► Server A                 │\n        │   Request 5: GET /health (1ms)    ──► Server B                 │\n        │   Request 6: POST /report (30s)   ──► Server A  ◄── overloaded!│\n        │                                                                 │\n        │   \"Fair\" request count ≠ Fair work distribution                │\n        └─────────────────────────────────────────────────────────────────┘\n```\n\n**The trap:** 1 lightweight GET ≠ 1 heavy report-generation POST.  \nThe server can receive its \"fair\" number of requests while receiving an unfair amount of actual work.\n\n---\n\n### 10. Least-connections can also mislead\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │         Least-connections ≠ Least-load                            │\n        ├─────────────────────────────────────────────────────────────────────┤\n        │                                                                   │\n        │   Server A:  1,000 idle WebSocket connections                     │\n        │              CPU: 5%    Memory: 20%    (plenty of headroom)       │\n        │                                                                   │\n        │   Server B:  50 active HTTP connections                           │\n        │              CPU: 85%   Memory: 90%    (near overload)            │\n        │                                                                   │\n        │   LB sees:   A has 1,000 connections, B has 50                    │\n        │   LB sends:  New request to B (least connections) ◄── wrong!      │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Lesson:** Connection count is useful only if it correlates with real load (CPU, memory, active work).\n\n---\n\n### 11. Latency-aware routing needs damping\n\n```\n        ┌─────────────────────────────────────────────────────────────────┐\n        │               OSCILLATION LOOP                                 │\n        ├─────────────────────────────────────────────────────────────────┤\n        │                                                                 │\n        │   1. A is fast ──► LB sends traffic to A                       │\n        │                     │                                          │\n        │                     ▼                                          │\n        │   2. A receives more load ──► A slows down                    │\n        │                     │                                          │\n        │                     ▼                                          │\n        │   3. B now looks faster ──► LB swings traffic to B            │\n        │                     │                                          │\n        │                     ▼                                          │\n        │   4. B receives more load ──► B slows down                    │\n        │                     │                                          │\n        │                     ▼                                          │\n        │   5. Back to Step 1 ──► Continuous oscillation!               │\n        │                                                                 │\n        └─────────────────────────────────────────────────────────────────┘\n```\n\n**Solutions:** Smoothing, randomness, thresholds, damping factors.  \nAggressive reaction can create herd behavior that destabilizes the system.\n\n---\n\n### 12. Health checks are necessary but can lie\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                  HEALTH CHECK TYPES                               │\n        ├─────────────────────┬───────────────────────────────────────────────┤\n        │ TCP Check           │ Can a TCP connection open?                   │\n        │                     │ Proves: port is listening                    │\n        │                     │ Does NOT prove: app can serve requests       │\n        ├─────────────────────┼───────────────────────────────────────────────┤\n        │ HTTP Check          │ Does GET /health return 200?                │\n        │                     │ Proves: HTTP handler responds                │\n        │                     │ Does NOT prove: dependencies work            │\n        ├─────────────────────┼───────────────────────────────────────────────┤\n        │ Deep Check          │ Does app + DB + dependencies work?          │\n        │                     │ Proves: the whole request path               │\n        │                     │ Risk: can overload dependencies              │\n        └─────────────────────┴───────────────────────────────────────────────┘\n\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  HEALTH CHECK LIES:                                                │\n        │  /health returns 200 OK  ──► LB thinks: \"healthy\"                 │\n        │  But real request fails ──► auth down / DB timeout / cache miss   │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Key point:** `200 OK` may only mean **process alive**, not **real user request succeeds**.\n\n---\n\n### 13. Health-check depth should match risk\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │         HEALTH DEPTH vs COST OF BEING WRONG                       │\n        ├─────────────────────────────────────────────────────────────────────┤\n        │                                                                   │\n        │   Low Risk (static content, read-only APIs)                       │\n        │   ───────────────────────────────────                              │\n        │   Shallow HTTP check ✓    (fast, cheap, sufficient)               │\n        │                                                                   │\n        │   Medium Risk (user profiles, product catalog)                    │\n        │   ───────────────────────────────────────                          │\n        │   Check cache + DB read ✓   (moderate depth)                      │\n        │                                                                   │\n        │   High Risk (payments, orders, settlements)                       │\n        │   ──────────────────────────────────────────                       │\n        │   Deep dependency check ✓   (expensive, but cost of failure       │\n        │    with rate-limiting/caching)                                    │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Senior judgment:** Define explicitly what \"healthy\" means for each service.  \nDon't make every health probe expensive; rate-limit and cache deep checks.\n\n---\n\n### 14. Health thresholds prevent flapping\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                  HEALTH STATE MACHINE                             │\n        ├─────────────────────────────────────────────────────────────────────┤\n        │                                                                   │\n        │   ┌─────────┐      failures >= 3    ┌────────────┐               │\n        │   │ HEALTHY │ ────────────────────► │ UNHEALTHY  │               │\n        │   └─────────┘                        └────────────┘               │\n        │        ▲                                   │                      │\n        │        │                                   │                      │\n        │        │     successes >= 2                │                      │\n        │        └───────────────────────────────────┘                      │\n        │                                                                   │\n        │   Failure threshold = 3   (remove after 3 consecutive failures)   │\n        │   Success threshold = 2   (re-add after 2 consecutive successes)  │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n\n        Too sensitive:\n        ┌─┐ ┌─┐ ┌─┐ ┌─┐ ┌─┐ ┌─┐  ──► Constant flapping\n        │H│ │U│ │H│ │U│ │H│ │U│      Routing instability\n\n        Too lax:\n        H H H H H H H H H U U U U  ──► Broken server keeps receiving traffic\n```\n\n**Tune based on:** Cost of false removal vs cost of missed detection.\n\n---\n\n### 15. Connection handling is architectural\n\n```\n        PROXY MODEL (Terminating):\n        ┌────────┐    conn1     ┌────────┐    conn2     ┌────────┐\n        │ Client │──────────────►│   LB   │──────────────►│Backend │\n        └────────┘              └────────┘              └────────┘\n           │                        │                        │\n           │◄─── TLS ──────────────►│◄─── New TLS/Plain ───►│\n           │                        │                        │\n           │    LB terminates client TLS, creates new        │\n           │    connection to backend                        │\n\n        PASS-THROUGH:\n        ┌────────┐              ┌────────┐              ┌────────┐\n        │ Client │──────────────►│   LB   │──────────────►│Backend │\n        └────────┘              └────────┘              └────────┘\n           │                        │                        │\n           │◄───────────── TLS passthrough ─────────────────►│\n           │                        │                        │\n           │    LB forwards at lower layer,                  │\n           │    no application awareness                     │\n```\n\n**Trade-off:** Termination gives visibility, TLS offload, header manipulation, L7 routing.  \nPass-through preserves end-to-end encryption but sacrifices content-based routing.\n\n---\n\n### 16. TLS termination changes the trust boundary\n\n```\n        BEFORE TLS TERMINATION:\n        ┌────────┐      TLS      ┌────────┐\n        │ Client │───────────────►│Backend │\n        └────────┘               └────────┘\n           │                        │\n           └─────── Trust ──────────┘\n\n        AFTER TLS TERMINATION:\n        ┌────────┐   TLS   ┌────────┐   plain/  ┌────────┐\n        │ Client │────────►│   LB   │──────────►│Backend │\n        └────────┘         └────────┘   new TLS └────────┘\n           │                   │                    │\n           │◄── Trust ────────►│◄── Trust ─────────►│\n           │                   │                    │\n           │   Two separately-trusted hops           │\n```\n\n**Consequences:**\n- Backend must trust the LB for forwarded identity/IP/headers\n- The LB becomes part of the security and failure path\n- Anything the backend believes about the client is only as trustworthy as the LB's own security\n\n---\n\n### 17. HTTP/2/gRPC changes the balancing problem\n\n```\n        HTTP/1.1:  1 connection = 1 request at a time\n        ┌──────────────────────────────────────────────┐\n        │  Client ──► 1 connection ──► 1 request      │\n        └──────────────────────────────────────────────┘\n\n        HTTP/2:    1 connection = MANY concurrent streams\n        ┌──────────────────────────────────────────────────────────┐\n        │                  1 Connection                          │\n        │  ┌────────────────────────────────────────────────┐     │\n        │  │  Stream 1  │  Stream 2  │  Stream 3  │  ...   │     │\n        │  └────────────────────────────────────────────────┘     │\n        └──────────────────────────────────────────────────────────┘\n\n        ┌──────────────────────────────────────────────────────────┐\n        │  TRAP: Balancing per HTTP/2 connection                 │\n        │                                                         │\n        │  1 connection = 100 concurrent streams                  │\n        │  LB sends all 100 streams to Server A                  │\n        │                                                         │\n        │  Recreates the exact L4 connection-fairness problem    │\n        │  Just one abstraction layer higher!                    │\n        └──────────────────────────────────────────────────────────┘\n```\n\n**Modern design question:** \"Balance per connection or per stream/request?\"\n\n---\n\n### 18. L7 routing is powerful — and dangerous\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                     L7 ROUTING RULES                              │\n        ├─────────────────────────────────────────────────────────────────────┤\n        │                                                                   │\n        │   IF host = api.shop.com AND path = /checkout                     │\n        │       ──► Checkout service pool                                   │\n        │                                                                   │\n        │   IF host = api.shop.com AND path starts /users                   │\n        │       ──► User service pool                                       │\n        │                                                                   │\n        │   IF host = api.shop.com AND path starts /orders                  │\n        │       ──► Order service pool                                      │\n        │                                                                   │\n        │   IF host = static.shop.com                                       │\n        │       ──► Static content service pool                             │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  DANGER: Bad routing rule                                         │\n        │  IF host = api.shop.com AND path starts /orders                   │\n        │       ──► User service pool  ◄── WRONG!                         │\n        │                                                                   │\n        │  Result: All /orders traffic gets 404 or errors                   │\n        │  Blast radius: Entire order flow is blackholed                   │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Key point:** Routing config deserves code-like review/change control.\n\n---\n\n### 19. Don't accidentally turn LB into an API gateway\n\n```\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                  LB vs API Gateway                                │\n        ├─────────────────────────────────────────────────────────────────────┤\n        │                                                                   │\n        │   Load Balancer:                                                  │\n        │   ───────────────                                                │\n        │   • Route by host/path                                            │\n        │   • Distribute traffic                                            │\n        │   • Health checks                                                 │\n        │   • TLS termination                                               │\n        │                                                                   │\n        │   API Gateway (additional responsibilities):                     │\n        │   ───────────────────────────────                                 │\n        │   • Authentication/Authorization                                 │\n        │   • Request/response transformation                              │\n        │   • Rate limiting per tenant                                     │\n        │   • Payload validation                                            │\n        │   • Business policy enforcement                                  │\n        │   • URL rewriting                                                 │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Why keep the LB \"dumb\"?**  \nConcentrating more logic at the LB = more logic every request depends on = larger blast radius.\n\n---\n\n### 20. Stickiness = deliberate fairness trade-off\n\n```\n        WITH STICKINESS:\n        ┌────────┐         ┌────────┐\n        │ User A │────────►│ Server │\n        └────────┘         │   S2   │\n              │            └────────┘\n              │                 ▲\n              ▼                 │\n        ┌────────┐         ┌────────┐\n        │ User A │────────►│ Server │\n        └────────┘         │   S2   │\n              │            └────────┘\n              │                 ▲\n              ▼                 │\n        ┌────────┐         ┌────────┐\n        │ User A │────────►│ Server │  (always the same backend)\n        └────────┘         │   S2   │\n                           └────────┘\n\n        METHODS:\n        ┌─────────────────┬─────────────────────────────────────────┐\n        │ Cookie-based    │ session123 → S2                        │\n        │ Client-IP hash  │ hash(IP) → S3                          │\n        │ Session-ID hash │ hash(session_id) → S1                  │\n        │ Custom key      │ hash(user_id) → S2                     │\n        └─────────────────┴─────────────────────────────────────────┘\n```\n\n**Useful when:** Local cache, in-memory session, warm context.  \n**Bad as a global default because:** It creates hotspots.  \n**Prefer:** Route-specific stickiness (only where needed).\n\n---\n\n### 21. Sticky backend failure must be recoverable\n\n```\n        SCENARIO: User A is stuck to S2\n        ┌────────┐         ┌────────┐\n        │ User A │────────►│ Server │\n        └────────┘         │   S2   │\n                           └────────┘\n                               │\n                               ▼\n                             S2 dies!\n                               │\n                               ▼\n        ┌────────┐         ┌────────┐\n        │ User A │────────►│ Server │  ← Remapped to healthy backend\n        └────────┘         │   S3   │\n                           └────────┘\n        BUT:\n        ┌──────────────────────────────────────────────────────────────┐\n        │ • Sticky state (session, cache) is lost                     │\n        │ • Application must rebuild/recover local state              │\n        │ • Cache warm-up, session reload, reconnect logic            │\n        └──────────────────────────────────────────────────────────────┘\n```\n\n**Key principle:** Health always overrides stickiness.  \nIf stickiness is required for correctness, failure becomes much harder.\n\n---\n\n### 22. Retry is a semantic decision\n\n```\n        RETRY RISK MATRIX:\n        ┌──────────────────────┬─────────────────────────────────────────────┐\n        │ REQUEST TYPE        │ RETRY SAFE?                                 │\n        ├──────────────────────┼─────────────────────────────────────────────┤\n        │ GET (read)          │ ✓ Yes — idempotent by design                │\n        │ HEAD (read)         │ ✓ Yes — no state change                     │\n        │ POST (write)        │ ✗ DANGER — duplicate if partially executed │\n        │ PUT (idempotent)    │ ✓ Yes — if designed as idempotent           │\n        │ DELETE (idempotent) │ ✓ Yes — if designed as idempotent           │\n        │ PATCH (partial)     │ ✗ DANGER — can cause inconsistent state     │\n        └──────────────────────┴─────────────────────────────────────────────┘\n\n        RETRY SCENARIO:\n        ┌────────────┐\n        │ POST /order│ ────► Backend times out ────► Might have succeeded\n        └────────────┘\n              │\n              ▼\n        ┌────────────┐\n        │ RETRY      │ ────► Backend processes again ────► DUPLICATE ORDER!\n        └────────────┘\n```\n\n**Golden rule:** **Idempotency key before retry** on important write paths.  \nNever make retry a blind universal LB feature.\n\n---\n\n### 23. Slow ≠ unhealthy\n\n```\n        HEALTH CHECK SAYS:\n        ┌─────────────┐\n        │ /health     │ ──► 200 OK ──► Healthy!  ──► Keep sending traffic\n        └─────────────┘\n\n        BUT REAL PERFORMANCE:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  Response time:  15 seconds  ◄── Users are experiencing           │\n        │  Error rate:     12%          timeout failures                    │\n        │  Queue depth:    Growing                                         │\n        └─────────────────────────────────────────────────────────────────────┘\n\n        SOLUTION: Watch performance signals alongside binary health\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                                                                   │\n        │  Signal               │ What to check                             │\n        │  ──────────────────── │ ───────────────────────────────────────── │\n        │  p95/p99 latency      │ Has it tripled?                          │\n        │  Error rate           │ Is it rising?                            │\n        │  Queue depth          │ Is it growing?                           │\n        │  Active streams       │ Is it saturated?                         │\n        │  Retry counts         │ Is the LB compensating for slowness?     │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Prefer:** Reducing traffic to a **degraded** backend rather than waiting for total failure.\n\n---\n\n### 24. Drain before removal + scale LB independently\n\n```\n        DRAIN LIFE CYCLE:\n        ┌────────────┐     ┌────────────┐     ┌────────────┐\n        │  ACTIVE    │────►│ DRAINING   │────►│  REMOVED   │\n        └────────────┘     └────────────┘     └────────────┘\n              │                   │                   │\n              ▼                   ▼                   ▼\n        Receives         No new traffic,    Completely\n        traffic          existing work      removed\n                         finishes\n\n        SCALING LB NODES:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                                                                   │\n        │   Clients ──► [ LB1 ][ LB2 ][ LB3 ][ LB4 ] ──► Backend Pool     │\n        │                     │       │       │       │                      │\n        │                     ▼       ▼       ▼       ▼                      │\n        │               Each LB node operates independently                  │\n        │               • Shared config from control plane                  │\n        │               • Tolerate small eventual inconsistency              │\n        │               • Avoid synchronizing every request                 │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Why no tight coordination:** Adds latency, creates single point of contention.\n\n---\n\n### 25. Overload protection beats perfect balancing\n\n```\n        SCENARIO:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  Incoming traffic = 100,000 RPS                                  │\n        │  Safe capacity    =  60,000 RPS                                  │\n        │                                                                   │\n        │  Problem: 40,000 RPS more than backends can handle               │\n        └─────────────────────────────────────────────────────────────────────┘\n\n        WHAT \"FAIR\" DISTRIBUTION DOES:\n        ┌────────────┐  ┌────────────┐  ┌────────────┐\n        │  Server A  │  │  Server B  │  │  Server C  │\n        │  33,333    │  │  33,333    │  │  33,334    │\n        └────────────┘  └────────────┘  └────────────┘\n              │               │               │\n              ▼               ▼               ▼\n        All overloaded ──► All fail together!\n\n        WHAT OVERLOAD PROTECTION DOES:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  Incoming 100k RPS                                                │\n        │       │                                                            │\n        │       ▼                                                            │\n        │  LB detects saturation (queue depth, latency, CPU)                │\n        │       │                                                            │\n        │       ├──► Queue briefly (buffer)                                 │\n        │       ├──► Rate limit (allow only safe capacity)                  │\n        │       ├──► Shed load (return 503 to slow clients)                 │\n        │       └──► Add capacity (scale out)                              │\n        │                                                                   │\n        │  Result: 60k RPS processed safely, remaining 40k shed/queued      │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n**Fair distribution cannot create capacity.** Protection preserves the system.\n\n---\n\n### 26. Leadership + production mindset\n\n```\n        HEALTH STATE MACHINE:\n        ┌────────────┐    ┌────────────┐    ┌────────────┐\n        │  HEALTHY   │───►│ DEGRADED   │───►│ UNHEALTHY  │\n        └────────────┘    └────────────┘    └────────────┘\n              │                 │                  │\n              │                 │                  │\n              ▼                 ▼                  ▼\n        ┌────────────┐    ┌────────────┐    ┌────────────┐\n        │ DRAINING   │───►│  REMOVED   │    │            │\n        └────────────┘    └────────────┘    └────────────┘\n\n        OUR PLATFORM IN NUMBERS:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │                                                                   │\n        │  • L4 + L7 layered                                                │\n        │  • 80+ microservices                                              │\n        │  • Mixed health depth (shallow + deep)                           │\n        │  • Selective stickiness (route-specific)                         │\n        │  • TLS at edge boundary                                          │\n        │  • Rate-limit + 503 overload posture                             │\n        │                                                                   │\n        └─────────────────────────────────────────────────────────────────────┘\n\n        DOMAIN-SPECIFIC RISKS:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  MF redemption    → Retry risk       → Idempotency key            │\n        │  IPO allotment    → Burst traffic    → Queue/overload protection  │\n        │  NSDL demat       → Slow-but-alive   → Latency + deep checks      │\n        │  Insurance        → Trust boundary   → Header verification/WAF    │\n        │  LAMF             → Session pinning  → Scoped stickiness          │\n        └─────────────────────────────────────────────────────────────────────┘\n\n        LEADERSHIP QUESTION:\n        Not just \"How do we fix this incident?\"\n        But:\n        ┌─────────────────────────────────────────────────────────────────────┐\n        │  • Why does this configuration exist?                             │\n        │  • Who owns the decision?                                         │\n        │  • Does the original justification still exist?                   │\n        │  • What's the governance gap that let this happen?                │\n        │  • What's the business/compliance exposure?                       │\n        └─────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## One-line mental model\n\n```\nLAYER\n  ↓\nTRAFFIC ENTRY\n  ↓\nDISCOVERY\n  ↓\nHEALTH\n  ↓\nSELECTION\n  ↓\nCONNECTION / TLS\n  ↓\nL7 ROUTING / STICKINESS\n  ↓\nFAILURE + RETRY\n  ↓\nDRAIN / SCALE / OVERLOAD\n  ↓\nOBSERVE STATES\n  ↓\nSECURITY BOUNDARY\n  ↓\nPRODUCTION + LEADERSHIP JUDGMENT\n```\n\n---\n\n## Core Interview Principle\n\n> **Don't start with \"Which LB algorithm?\"**\n>\n> Start with:\n> 1. **What exactly are we balancing?** (connections? requests? streams?)\n> 2. **What can fail?** (LB node? backend? network? dependency?)\n> 3. **What signal tells us it's failing?** (health? latency? error rate?)\n> 4. **What is the cost of being wrong?** (duplicate order? dropped request? customer impact?)\n\n---\n\n## Quick Reference: The 26 Points in One View\n\n| # | Topic | Key Takeaway |\n|---|-------|--------------|\n| 1 | L4 vs L7 | Decide the layer before the algorithm |\n| 2 | L4 unfairness | Balances connections, not requests |\n| 3 | L4 + L7 coexist | Each layer owns different responsibilities |\n| 4 | Traffic entry | Separate availability problem from backend balancing |\n| 5 | DNS vs VIP | Network failover > DNS failover |\n| 6 | Backend discovery | Exists ≠ ready for traffic |\n| 7 | Discovery + health | Two different questions, combine both |\n| 8 | Selection algorithms | Balance the resource that's actually scarce |\n| 9 | Round robin | Counts requests, not";

function inline(s){
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s = s.replace(/_([^_]+)_/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function render(src){
  const lines = src.replace(/\\r/g,'').split('\\n');
  let out='', i=0, inList=false, listType='';
  function closeList(){ if(inList){out += '</'+listType+'>';inList=false;listType='';} }
  while(i<lines.length){
    let line=lines[i];
    if(/^```/.test(line)){
      closeList(); let lang=line.slice(3).trim(), buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; out += '<pre><code>'+inline(buf.join('\\n'))+'</code></pre>'; continue;
    }
    if(/^---+$/.test(line.trim())){closeList();out+='<hr>';i++;continue;}
    let m=line.match(/^(#{1,6})\\s+(.*)$/);
    if(m){closeList();let n=m[1].length;out+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';i++;continue;}
    if(/^>\\s?/.test(line)){closeList();let buf=[];while(i<lines.length&&/^>\\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\\s?/,'') );i++;}out+='<blockquote>'+buf.map(inline).join('<br>')+'</blockquote>';continue;}
    if(/^\\|/.test(line) && i+1<lines.length && /^\\|?\\s*:?-+:?\\s*(\\||$)/.test(lines[i+1])){
      closeList(); let rows=[]; rows.push(line); i+=2;
      while(i<lines.length && /^\\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.trim().replace(/^\\||\\|$/g,'').split('|').map(x=>x.trim());
      const head=cells(rows[0]); out+='<table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>';
      rows.slice(1).forEach(r=>{out+='<tr>'+cells(r).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>';});
      out+='</tbody></table>'; continue;
    }
    m=line.match(/^([-*+])\\s+(.*)$/);
    if(m){ if(!inList||listType!=='ul'){closeList();out+='<ul>';inList=true;listType='ul';}out+='<li>'+inline(m[2])+'</li>';i++;continue;}
    m=line.match(/^\\d+\\.\\s+(.*)$/);
    if(m){ if(!inList||listType!=='ol'){closeList();out+='<ol>';inList=true;listType='ol';}out+='<li>'+inline(m[1])+'</li>';i++;continue;}
    if(!line.trim()){closeList();i++;continue;}
    closeList(); let buf=[line];i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,6})\\s+/.test(lines[i]) && !/^```/.test(lines[i]) && !/^>/.test(lines[i]) && !/^[-*+]\\s+/.test(lines[i]) && !/^\\d+\\.\\s+/.test(lines[i]) && !/^\\|/.test(lines[i]) && !/^---+$/.test(lines[i])){buf.push(lines[i]);i++;}
    out+='<p>'+buf.map(inline).join('<br>')+'</p>';
  }
  closeList(); return out;
}
document.getElementById('content').innerHTML=render(md);
