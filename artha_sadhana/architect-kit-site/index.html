<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architect Kit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 3rem;
    }

    .cards {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      display: block;
      width: 220px;
      padding: 2rem 1.5rem;
      border: 1px solid #222;
      border-radius: 12px;
      background: #111;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: #444;
      background: #161616;
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Architect Kit</h1>
    <p class="subtitle">Pick a site to continue</p>
    <div class="cards">
      <a class="card" href="ai-site/index.html">
        <div class="card-icon">🤖</div>
        <div class="card-title">AI Site</div>
        <div class="card-desc">AI courses, agents, LLM engineering, and more</div>
      </a>
      <a class="card" href="architects-site/index.html">
        <div class="card-icon">🏗️</div>
        <div class="card-title">Architects Site</div>
        <div class="card-desc">System design, distributed systems, and architecture</div>
      </a>
      <a class="card" href="https://www.youtube.com/@CorporateChaii/playlists" target="_blank" rel="noopener">
        <div class="card-icon">▶️</div>
        <div class="card-title">CorporateChaii</div>
        <div class="card-desc">YouTube playlists — finance, career, and corporate insights</div>
      </a>
    </div>
  </div>
</body>
</html>
