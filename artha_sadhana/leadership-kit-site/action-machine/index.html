<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Machine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>⚡ Action Machine</h1>
  <div class="stats" id="dayStats">0 tasks • 0 min planned</div>
</div>

<div class="container">
  <div class="panel left-panel">
    <h2><i class="fas fa-list"></i> Your Tasks</h2>
    <div class="add-task-form">
      <input type="text" id="taskInput" placeholder="Add a task..." onkeypress="if(event.key==='Enter')addTask()">
      <button onclick="addTask()">+ Add</button>
    </div>
    <div id="taskList"></div>
  </div>

  <div class="panel right-panel">
    <h2><i class="fas fa-fire" style="color:#ff6b6b;"></i> Active Blocks</h2>
    <div class="tasks-grid" id="tasksGrid"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
