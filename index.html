<style>
  :root{
    --void:#050308;
    --deep:#0c0816;
    --ember:#c9622b;
    --gold:#e8a94c;
    --spark:#f4e4c8;
    --eye:#ff5a36;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:radial-gradient(ellipse at 50% 40%, var(--deep) 0%, var(--void) 70%);
    overflow:hidden;
    font-family:'Georgia', 'Times New Roman', serif;
  }
  canvas{display:block;position:fixed;inset:0;}
  .veil{
    position:fixed;inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index:2;
  }
  .caption{
    position:fixed;
    bottom:6%;
    left:0;right:0;
    text-align:center;
    z-index:3;
    pointer-events:none;
    color:var(--spark);
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:13px;
    opacity:0;
    transition:opacity 2.2s ease;
    text-shadow:0 0 18px rgba(232,169,76,0.5);
  }
  .caption .dev{
    display:block;
    font-family:'Noto Sans Devanagari','Nirmala UI',serif;
    font-size:22px;
    letter-spacing:0.08em;
    margin-bottom:8px;
    text-transform:none;
    color:var(--gold);
  }
  .caption.show{opacity:1;}
  .mark{
    position:fixed;
    top:86px;
    left:0;right:0;
    text-align:center;
    z-index:3;
    pointer-events:none;
    color:rgba(244,228,200,0.35);
    font-size:11px;
    letter-spacing:0.5em;
    text-transform:uppercase;
  }

  /* ---- Diya navigation row ---- */
  .diya-row{
    position:fixed;
    top:16px;
    left:0;right:0;
    z-index:6;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:clamp(8px, 2.2vw, 26px);
    padding:0 12px;
    pointer-events:none;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .diya-row::-webkit-scrollbar{ display:none; }
  .diya{
    pointer-events:auto;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    width:clamp(72px, 10vw, 96px);
    text-decoration:none;
    cursor:pointer;
    background:none;
    border:none;
    transition:transform 0.3s ease;
  }
  .diya:hover, .diya:focus-visible{
    transform:translateY(-3px) scale(1.08);
  }
  .diya .flame{
    width:9px;
    height:15px;
    margin-bottom:-3px;
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 50% 32%, #fff6dc 0%, #ffd066 38%, #ff8c3f 72%, rgba(255,110,40,0) 100%);
    box-shadow:
      0 0 8px 2px rgba(255,180,90,0.85),
      0 0 22px 8px rgba(255,140,60,0.45),
      0 0 40px 14px rgba(255,110,40,0.2);
    transform-origin:50% 100%;
    animation:flicker 2.6s ease-in-out infinite;
    animation-delay:var(--d, 0s);
  }
  .diya:hover .flame{
    box-shadow:
      0 0 10px 3px rgba(255,190,110,0.95),
      0 0 28px 10px rgba(255,150,70,0.6),
      0 0 50px 18px rgba(255,120,50,0.3);
  }
  .diya svg{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .diya-label{
    margin-top:6px;
    font-size:9px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:rgba(244,228,200,0.55);
    white-space:nowrap;
    transition:color 0.3s ease;
  }
  .diya:hover .diya-label, .diya:focus-visible .diya-label{
    color:var(--gold);
  }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) scaleX(1) rotate(0deg); opacity:1; }
    20%{ transform:scaleY(1.1) scaleX(0.92) rotate(-3deg); opacity:0.9; }
    45%{ transform:scaleY(0.9) scaleX(1.06) rotate(2deg); opacity:1; }
    70%{ transform:scaleY(1.06) scaleX(0.95) rotate(-2deg); opacity:0.93; }
    85%{ transform:scaleY(0.96) scaleX(1.02) rotate(1deg); opacity:1; }
  }
  @media (max-width:480px){
    .diya-label{ display:none; }
    .diya-row{ top:10px; gap:8px; }
  }
</style>

<body>

<div class="veil"></div>
<div class="mark">Neti Neti — Not This, Not This</div>
<div class="caption" id="caption">
  <span class="dev">सर्वं शिवमयं जगत्</span>
  everything in this universe is Shiva
</div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const captionEl = document.getElementById('caption');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildShape();
  }

  // ---------- Silhouette definition (Dhyanalinga: tall smooth ovoid on a simple round base) ----------
  function drawSilhouette(c){
    c.save();
    c.fillStyle = '#fff';

    // Simple grounding base — two soft, flat tiers, no spout, no ornament
    c.beginPath(); c.ellipse(0,238,190,36,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(0,208,168,38,0,0,Math.PI*2); c.fill();

    // The linga itself — one continuous, smooth, elongated ovoid
    function half(){
      c.beginPath();
      c.moveTo(0,-382);                              // apex, gently rounded
      c.quadraticCurveTo(66,-330, 96,-224);           // upper taper widening
      c.quadraticCurveTo(114,-140, 112,-56);          // approaching the widest point
      c.quadraticCurveTo(110,30, 92,110);             // easing back inward
      c.quadraticCurveTo(78,160, 42,182);              // settling into the base
      c.lineTo(0,182);
      c.closePath();
      c.fill();
    }
    half();
    c.save(); c.scale(-1,1); half(); c.restore();

    c.restore();
  }

  // Sample the silhouette into a point cloud (once, on resize)
  let shapePoints = [];
  let thirdEyePoint = {x:0, y:-382};
  function buildShape(){
    const off = document.createElement('canvas');
    const S = 1200;
    off.width = S; off.height = S;
    const octx = off.getContext('2d');
    octx.translate(S/2, S/2 + 40);
    drawSilhouette(octx);

    const img = octx.getImageData(0,0,S,S).data;
    const pts = [];
    const step = 2;
    for(let y=0;y<S;y+=step){
      for(let x=0;x<S;x+=step){
        const idx = (y*S+x)*4;
        if(img[idx+3] > 120){
          pts.push({x: x - S/2, y: y - S/2 - 40});
        }
      }
    }
    shapePoints = pts;
  }

  // ---------- Particle system ----------
  const MAX_PARTICLES = 5200;
  let particles = [];

  function rand(a,b){ return a + Math.random()*(b-a); }

  function initParticles(){
    particles = [];
    for(let i=0;i<MAX_PARTICLES;i++){
      const angle = Math.random()*Math.PI*2;
      const radius = rand(0.2,1)*Math.max(W,H)*0.65;
      particles.push({
        // scatter/energy-state orbit params
        orbitAngle: angle,
        orbitRadius: radius,
        orbitSpeed: rand(0.05,0.25) * (Math.random()<0.5?-1:1),
        noiseSeed: Math.random()*1000,
        // current drawn position
        x:0, y:0,
        // target shape point (assigned below)
        tx:0, ty:0,
        size: rand(0.7,2.2),
        hueMix: Math.random(), // 0 = ember, 1 = gold/spark
        isSpark: false
      });
    }
    assignTargets();
  }

  function assignTargets(){
    if(shapePoints.length === 0) return;
    for(let i=0;i<particles.length;i++){
      const p = shapePoints[Math.floor(Math.random()*shapePoints.length)];
      particles[i].tx = p.x;
      particles[i].ty = p.y;
    }
    // Designate a few particles as the eternal "spark" (third eye) that never fully scatters
    for(let i=0;i<10;i++){
      particles[i].isSpark = true;
      particles[i].tx = thirdEyePoint.x + rand(-3,3);
      particles[i].ty = thirdEyePoint.y + rand(-3,3);
    }
  }

  // ---------- Glow sprite for cheap additive rendering ----------
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = 64;
  (function makeSprite(){
    const sctx = sprite.getContext('2d');
    const g = sctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.4,'rgba(255,255,255,0.5)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    sctx.fillStyle = g;
    sctx.fillRect(0,0,64,64);
  })();

  function lerp(a,b,t){ return a + (b-a)*t; }
  function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

  // ---------- Cycle timing ----------
  const CYCLE = 20000; // ms, full loop
  const T_CONVERGE_END   = 0.28;
  const T_HOLD_END       = 0.62;
  const T_DIVERGE_END    = 0.85;
  // after T_DIVERGE_END -> pure energy phase until loop restarts

  let startTime = performance.now();

  function currentPhase(tNorm){
    if(tNorm < T_CONVERGE_END) return 'converge';
    if(tNorm < T_HOLD_END) return 'hold';
    if(tNorm < T_DIVERGE_END) return 'diverge';
    return 'energy';
  }

  let lastCaptionPhase = '';
  function updateCaption(phase, tNorm){
    if(phase === 'hold' && lastCaptionPhase !== 'hold'){
      captionEl.innerHTML = '<span class="dev">सर्वं शिवमयं जगत्</span>everything in this universe is Shiva';
      captionEl.classList.add('show');
    } else if(phase === 'energy' && lastCaptionPhase !== 'energy'){
      captionEl.innerHTML = '<span class="dev">ज्ञानं बन्धः</span>Limited knowledge creates bondage.';
      captionEl.classList.add('show');
    } else if(phase === 'converge' || phase === 'diverge'){
      captionEl.classList.remove('show');
    }
    lastCaptionPhase = phase;
  }

  function draw(now){
    const elapsed = (now - startTime) % CYCLE;
    const tNorm = elapsed / CYCLE;
    const phase = currentPhase(tNorm);
    updateCaption(phase, tNorm);

    ctx.clearRect(0,0,W,H);

    // faint static starfield backdrop
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    for(let i=0;i<starField.length;i++){
      const s = starField[i];
      const tw = 0.5 + 0.5*Math.sin(now*0.0006 + s.phase);
      ctx.globalAlpha = s.a * tw;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.restore();

    const cx = W/2;
    const cy = H/2 + H*0.03;
    const shapeScale = Math.min(W, H) / 1000;

    ctx.globalCompositeOperation = 'lighter';

    let convergeT = 0, divergeT = 0;
    if(phase === 'converge'){
      convergeT = easeInOutCubic(tNorm / T_CONVERGE_END);
    } else if(phase === 'hold'){
      convergeT = 1;
    } else if(phase === 'diverge'){
      divergeT = easeInOutCubic((tNorm - T_HOLD_END) / (T_DIVERGE_END - T_HOLD_END));
      convergeT = 1 - divergeT;
    } else {
      convergeT = 0;
    }

    const breathe = phase === 'hold' ? Math.sin(now*0.0012)*0.01 : 0;

    for(let i=0;i<particles.length;i++){
      const p = particles[i];

      // orbit / energy position (chaotic state)
      const t = now*0.001 + p.noiseSeed;
      const wobble = Math.sin(t*1.7)*14 + Math.cos(t*1.1)*14;
      const ang = p.orbitAngle + t*p.orbitSpeed;
      const orbX = cx + Math.cos(ang) * (p.orbitRadius) + wobble;
      const orbY = cy + Math.sin(ang) * (p.orbitRadius*0.6) + wobble*0.6;

      // shape position
      const shpX = cx + p.tx * shapeScale * (1+breathe);
      const shpY = cy + p.ty * shapeScale * (1+breathe);

      let px, py, alphaBoost = 0;
      if(p.isSpark){
        // the eternal spark: always at least dimly present at the third eye
        const settle = Math.max(convergeT, 0.18);
        px = lerp(orbX, shpX, settle);
        py = lerp(orbY, shpY, settle);
        alphaBoost = 0.6;
      } else {
        px = lerp(orbX, shpX, convergeT);
        py = lerp(orbY, shpY, convergeT);
      }

      p.x = px; p.y = py;

      const glowSize = (p.size * 7 + alphaBoost*10) * (1 + convergeT*0.3);
      const baseAlpha = (0.18 + p.hueMix*0.25 + convergeT*0.35 + alphaBoost);

      // color mix: ember -> gold -> spark white
      let r,g,b;
      if(p.isSpark){
        r=255; g=90; b=54;
      } else {
        const m = p.hueMix;
        r = lerp(201, 244, m);
        g = lerp(98, 228, m);
        b = lerp(43, 200, m);
      }

      ctx.globalAlpha = Math.min(baseAlpha, 1);
      ctx.drawImage(sprite, px - glowSize/2, py - glowSize/2, glowSize, glowSize);
      // tint pass
      ctx.globalAlpha = Math.min(baseAlpha*0.55, 1);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.arc(px, py, p.size*(1+convergeT), 0, Math.PI*2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }

  // static twinkling starfield
  let starField = [];
  function buildStars(){
    starField = [];
    const count = Math.floor((W*H)/9000);
    for(let i=0;i<count;i++){
      starField.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(0.4,1.4),
        a: rand(0.15,0.7),
        phase: Math.random()*Math.PI*2
      });
    }
  }

  window.addEventListener('resize', () => { resize(); buildStars(); assignTargets(); });

  resize();
  buildStars();
  initParticles();
  requestAnimationFrame(draw);
})();
</script>
</body>
