const S=[

// ============ SECTION 1: OVERVIEW ============
{sec:"intro", c:"gold", eyebrow:"Overview · Think First", t:"q",
 q:`Every Claude command normally just follows markdown instructions and stops. But <b>one</b> command needs to reach past Claude, into the real operating system, and keep running on its own after you close the chat.<br><br>Which command do you think that is — and what would it need to create to make that possible?`},

{sec:"intro", c:"gold", eyebrow:"Overview · 01", t:"a",
 h:"The <em>Normal</em> Command Flow",
 body:`<p>Most commands are simple. You type one, Claude reads a file, and does what it says.</p>
 <div class="ascii">You type:

/study-brief
     │
     ▼
Claude Code
     │
     ▼
.claude/commands/study-brief.md
     │
     ▼
Claude follows instructions
     │
     ▼
Result</div>
 <div class="note"><b>Key point:</b> Nothing runs automatically. The command only executes the moment you type it.</div>`},

{sec:"intro", c:"gold", eyebrow:"Overview · 02", t:"a",
 h:"<em>/cron-setup</em> — the Bridge",
 body:`<p><code>/cron-setup</code> is different from every other command:</p>
 <div class="note">&gt; <b>/cron-setup</b> is different from normal commands because it creates a <b>real operating-system scheduler</b>.</div>
 <div class="ascii">             /cron-setup
                  │
                  ▼
      .claude/commands/cron-setup.md
                  │
                  ▼
        Read schedule configuration
                  │
                  ▼
        scheduler/schedule.md
                  │
                  ▼
       Decide WHAT + WHEN to run
                  │
                  ▼
       Update schedule.md
                  │
                  ▼
      Create systemd .service
                  │
                  ▼
       Create systemd .timer
                  │
                  ▼
 systemctl --user enable + start
                  │
                  ▼
          Linux Scheduler</div>
 <p>So <code>/cron-setup</code> is basically a <b>bridge between Claude commands and Linux systemd</b>.</p>`},

{sec:"intro", c:"gold", eyebrow:"Overview · Recall", t:"r",
 h:"Quick recall: Overview",
 qs:[
  {q:"What's the one thing that makes /cron-setup different from every other command?", a:"It creates a <b>real OS-level scheduler</b> (systemd <b>.service</b> + <b>.timer</b>) instead of just running markdown instructions."},
  {q:"What does a normal command do when you're not actively typing it?", a:"<b>Nothing</b> — it only runs the moment you type it. No side effects otherwise."}
 ]},

// ============ SECTION 2: CRON-SETUP ============
{sec:"cron", c:"teal", eyebrow:"Cron-Setup · Think First", t:"q",
 q:`Before Claude can create any schedule, it has to check one file first. That file becomes the "source of truth" for every scheduled job.<br><br>What do you think that file is called, and why does it matter more than the schedule itself?`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 01", t:"a",
 h:"Step 1 — Read the Schedule",
 body:`<p>First, <code>/cron-setup</code> reads:</p>
 <div class="ascii">/cron-setup
     │
     ▼
scheduler/schedule.md</div>
 <p>This file is the <b>source of truth</b> for schedules.</p>
 <div class="ascii">scheduler/
└── schedule.md</div>
 <p>Conceptually:</p>
 <div class="ascii">┌──────────────────────────────────────────┐
│ scheduler/schedule.md                    │
├──────────────────────────────────────────┤
│ /study-brief   → weekdays 7:30 AM       │
│ /reflect       → every day 9:00 PM      │
│ /weekly-report → Friday 6:00 PM         │
│ /career-radar  → monthly                │
└──────────────────────────────────────────┘</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 02", t:"a",
 h:"Step 2 — Deciding What Runs",
 body:`<p>You tell <code>/cron-setup</code>:</p>
 <div class="ascii">/study-brief → 7:30 AM weekdays</div>
 <p>Claude converts that into a schedule:</p>
 <div class="ascii">Human language

"Every weekday at 7:30 AM"
             │
             ▼
       cron expression
             │
             ▼
       30 7 * * 1-5</div>
 <p>Another example:</p>
 <div class="ascii">"Every day at 9 PM"
       │
       ▼
   0 21 * * *</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 03", t:"a",
 h:"Step 3 — Update schedule.md",
 body:`<p>The configuration becomes:</p>
 <div class="ascii">┌─────────────────────────────────────────────┐
│ scheduler/schedule.md                       │
├─────────────────────────────────────────────┤
│                                             │
│ Command         Schedule                    │
│ ──────────────────────────────────────────  │
│ /study-brief    30 7 * * 1-5               │
│ /reflect        0 21 * * *                  │
│ /weekly-report  0 18 * * 5                  │
│                                             │
└─────────────────────────────────────────────┘</div>
 <p>Think:</p>
 <div class="ascii">schedule.md
     │
     │
     └── "WHAT should run and WHEN?"</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · Think First", t:"q",
 q:`When 7:30 AM arrives, systemd wakes up and runs something. But it does <b>not</b> directly run the logic inside <code>/study-brief</code>.<br><br>What command do you think systemd actually executes?`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 04", t:"a",
 h:"Step 4 — Create the .service",
 body:`<p>Now <code>/cron-setup</code> creates a Linux systemd service. Conceptually:</p>
 <div class="ascii">~/.config/systemd/user/
│
├── personal-os-study-brief.service
└── personal-os-study-brief.timer</div>
 <p>The <code>.service</code> says:</p>
 <div class="ascii">┌──────────────────────────────────────────────┐
│ personal-os-study-brief.service              │
├──────────────────────────────────────────────┤
│                                              │
│ When executed:                               │
│                                              │
│ claude -p "Run /study-brief"                │
│                                              │
└──────────────────────────────────────────────┘</div>
 <div class="note">This is extremely important. The OS is <b>not directly executing the logic of /study-brief</b>. It is executing: <b>claude -p "Run /study-brief"</b></div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 05", t:"a",
 h:"Step 5 — Create the .timer",
 body:`<p>The timer says "when should the service run?"</p>
 <div class="ascii">┌───────────────────────────────┐
│ .timer                        │
├───────────────────────────────┤
│ Monday     07:30              │
│ Tuesday    07:30              │
│ Wednesday  07:30              │
│ Thursday   07:30              │
│ Friday     07:30              │
└───────────────────────────────┘
             │
             ▼
       Trigger service</div>
 <p>So:</p>
 <div class="ascii">.timer
  │
  │ WHEN?
  ▼
.service
  │
  │ WHAT?
  ▼
claude -p "Run /study-brief"</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 06", t:"a",
 h:".timer + .service Together",
 body:`<p>This is the easiest mental model:</p>
 <div class="ascii">             SYSTEMD
                │
       ┌────────┴────────┐
       │                 │
     .timer           .service
       │                 │
       │ WHEN?           │ WHAT?
       │                 │
       ▼                 ▼
   7:30 AM       claude -p "Run /study-brief"
                         │
                         ▼
                     Claude Code
                         │
                         ▼
              .claude/commands/
                  study-brief.md
                         │
                         ▼
                  Execute instructions</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 07", t:"a",
 h:"The Complete /study-brief Automation",
 body:`<p>This is probably the <b>most important diagram</b> to understand the entire architecture:</p>
 <div class="ascii">                    7:30 AM
                       │
                       ▼
                Linux systemd
                       │
                       ▼
            study-brief.timer
                       │
                       ▼
           study-brief.service
                       │
                       ▼
       claude -p "Run /study-brief"
                       │
                       ▼
                 Claude Code
                       │
                       ▼
       .claude/commands/study-brief.md
                       │
                       ▼
              Claude reads rules
                       │
                       ▼
             Execute the command
                       │
              ┌────────┼────────┐
              ▼        ▼        ▼
            Vault    Calendar  Notion
              │        │        │
              └────────┼────────┘
                       ▼
                Study Brief
                       │
                       ▼
                     User</div>
 <div class="note"><b>One-line mental model:</b> Linux timer → starts Claude → Claude runs /study-brief → Claude reads study-brief.md → Claude does what the markdown says</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · 08", t:"a",
 h:"Why /cron-setup Is Special",
 body:`<p>Most commands are basically <b>.md instructions</b>:</p>
 <div class="ascii">/new
/setup
/status
/learn
/ingest
/reflect</div>
 <p>But <code>/cron-setup</code> touches the <b>real operating system</b>:</p>
 <div class="ascii">                 Personal OS
                     │
       ┌─────────────┴─────────────┐
       │                           │
   Claude layer               Linux layer
       │                           │
       ▼                           ▼
 .claude/commands/          systemd
       │                           │
       │                    .timer/.service
       │                           │
       └──────────────┬────────────┘
                      ▼
                Automated OS</div>`},

{sec:"cron", c:"teal", eyebrow:"Cron-Setup · Recall", t:"r",
 h:"Quick recall: /cron-setup",
 qs:[
  {q:"What file is the source of truth for every schedule?", a:"<b>scheduler/schedule.md</b>"},
  {q:"What two systemd files does /cron-setup create?", a:"A <b>.service</b> (WHAT to run) and a <b>.timer</b> (WHEN to run it)."},
  {q:"What command does the systemd service literally execute — not the command's actual logic?", a:'<b>claude -p "Run /X"</b> — the OS just starts Claude, which then reads the .md file itself.'},
  {q:"Name three commands that are just .md instructions with no OS access.", a:"Any of: <b>/new, /setup, /status, /learn, /ingest, /reflect</b>."}
 ]},

// ============ SECTION 3: STATUS ============
{sec:"status", c:"rose", eyebrow:"Status · Think First", t:"q",
 q:`/cron-setup <b>changes</b> the system — it creates files and talks to systemd. Based on that contrast, what do you think <code>/status</code> does instead? Does it create or schedule anything at all?`},

{sec:"status", c:"rose", eyebrow:"Status · 01", t:"a",
 h:"/status — Read, Don't Change",
 body:`<p><code>/status</code> is much simpler. It doesn't create anything. It doesn't schedule anything. It mainly <b>reads information and reports it</b>.</p>
 <div class="ascii">/status
   │
   ▼
status.md
   │
   ▼
Read system information
   │
   ▼
Summarize
   │
   ▼
Show health/status</div>`},

{sec:"status", c:"rose", eyebrow:"Status · 02", t:"a",
 h:"/status Default (Quick) Mode",
 body:`<p>When you type <code>/status</code>, it does a <b>quick health check</b>:</p>
 <div class="ascii">             /status
                │
                ▼
      .claude/commands/status.md

        ┌───────┼────────┐

     log.md   courses   schedule
        │       │        │

             Summary
                │
                ▼
              User</div>
 <p>It checks things like:</p>

courses

 <p>Think of it like:</p>

   ├── Inbox

          │
          ▼
       &lt; 10 lines</div>
 <div class="note">It is basically: "Give me a quick snapshot"</div>`},

{sec:"status", c:"rose", eyebrow:"Status · Think First", t:"q",
 q:`If quick mode gives you under 10 lines, what extra categories do you think a <b>full</b> diagnostic would pull in on top of that?`},

{sec:"status", c:"rose", eyebrow:"Status · 03", t:"a",
 h:"/status full — the Overview",
 body:`<p>Now you type <code>/status full</code>. Much more information is collected:</p>

                           │
       ┌───────────────────┼────────────────────┐

                           ▼
                      Connections

                       Open loops

{sec:"status", c:"rose", eyebrow:"Status · 04", t:"a",
 h:"What It Reads — Identity & Vault",
 body:`<p><b>Identity:</b></p>
 <div class="ascii">soul.md
   │
   ▼
Is Personal OS identity configured?</div>

│

{sec:"status", c:"rose", eyebrow:"Status · 05", t:"a",
 h:"Courses & Projects",
 body:`<p><b>Courses:</b></p>
 <div class="ascii">vault/courses/tracker.md
             │
             ▼
       Active courses?

       Project health summary</div>`},

{sec:"status", c:"rose", eyebrow:"Status · 06", t:"a",
 h:"Inbox & Scheduler",
 body:`<p><b>Inbox:</b></p>
 <div class="ascii">inbox/
  │
  ├── article.pdf
  ├── notes.md
  └── book.txt</div>
 <p><code>/status full</code> asks: "Are there files waiting to be processed?"</p>
 <p><b>Scheduler:</b></p>

let i=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
tabs=document.getElementById('tabs'),counter=document.getElementById('counter'),
prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  return '<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>'
       + '<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  if(s.t==='q'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
      +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
      +'<div class="qtext">'+s.q+'</div>'
      +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
  } else if(s.t==='r'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
      +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
      +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
      +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
  } else {
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(s.cto?lens(s.cto,s.dir):'');
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===s.sec));
  prevBtn.disabled=(i===0);
  nextBtn.textContent=(i===S.length-1)?'Done \u2713':'Next \u2192';
  nextBtn.disabled=(i===S.length-1);
  document.querySelector('main').scrollTop=0;window.scrollTo(0,0);
}
prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.target.closest('details'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
