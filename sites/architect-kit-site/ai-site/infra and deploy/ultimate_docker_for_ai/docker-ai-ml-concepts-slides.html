// ===== SECTION: WHY =====
{sec:"why", c:"teal", eyebrow:"Why Docker · 01", t:"q",
 q:`Before Docker, teams used <b>Virtual Machines (VMs)</b> to isolate their apps.
 VMs give you full, strong isolation — a complete fake computer inside your computer.
 So why did the industry move to Docker, which gives <b>less</b> isolation?
 What did they get in return for giving something up?`},

{sec:"why", c:"teal", eyebrow:"Why Docker · 01", t:"a",
 h:"Docker trades a little safety for a lot of <em>speed</em>",
 body:`<p>A Virtual Machine copies an entire computer — its own operating system, its own
 memory, everything — just to run one app. That is heavy and slow to start.</p>
 <p>A Docker container does not copy the operating system. It shares the host computer's
 operating system "engine" underneath, and only packs the app plus its own tiny bits.
 That makes it fast, light, and easy to move around.</p>
 <div class="ascii">                  DOCKER          vs        VIRTUAL MACHINE
Portability        <span class="hl">Very high</span>                  Lower
Resource use        <span class="hl">Light</span>                    Heavy
Startup speed        <span class="hl">Fast</span>                    Slow
Isolation           Good enough              <span class="rs">Very strong</span></div>
 <div class="ascii">STARTING A VM                    STARTING A CONTAINER
──────────────                   ────────────────────
1. Power on fake hardware        1. Ask the shared kernel for
2. Boot a full OS (BIOS,            a new isolated process
   kernel, init system...)       2. Mount the app's files
3. Start background services     3. Run the app
4. Finally start your app        <span class="hl">← done in well under a second</span>
   <span class="rs">← can take a minute or more</span></div>
 <p>As AI models and LLM apps get bigger and more complex, teams need something
 reproducible (same result every time), portable (runs anywhere), and scalable
 (handles more load). Docker became the standard way to get all three at once —
 VMs are now seen as the older, heavier option, saved only for cases that truly
 need maximum isolation.</p>
 <div class="note"><b>The trade, in one line:</b> Docker gives up some isolation to gain
 speed and portability. For almost all AI/ML work, that trade is worth it.</div>`},

{sec:"why", c:"teal", eyebrow:"Why Docker · 02", t:"q",
 q:`A container does not have its own separate operating system — it shares the
 host machine's OS. Given that, in your own words: is a container really a "small
 computer", or something else entirely? What is the one word that best describes
 what a container actually is?`},

{sec:"why", c:"teal", eyebrow:"Why Docker · 02", t:"a",
 h:"A container is a <em>process</em> wearing a costume, not a computer",
 body:`<p>A container is really just a normal running program on your computer — but
 Docker dresses it up so it <em>believes</em> it has its own private filesystem, its
 own network, and its own list of running processes. It shares the real engine
 (the Linux kernel) underneath with every other container on that machine.</p>
 <div class="ascii">Your Laptop
 └── One shared Operating System engine (the kernel)
       ├── Container 1  (thinks it's alone)
       ├── Container 2  (thinks it's alone)
       └── Container 3  (thinks it's alone)</div>
 <div class="ascii">WHAT MAKES A CONTAINER "BELIEVE" IT'S ALONE?
─────────────────────────────────────────────
<span class="hl">Namespaces</span>  → give it its OWN view of:
              process list, network, hostname,
              filesystem mount points, user IDs
<span class="tl">Cgroups</span>     → put a HARD LIMIT on how much
              CPU, memory, and disk it may use

Together: an illusion of a private machine,
built entirely out of the ONE real kernel.</div>
 <p>This sharing is exactly why containers start in under a second, while a VM can
 take a minute or more — a VM has to boot a whole fake computer from scratch every time.</p>`},

{sec:"why", c:"teal", eyebrow:"Why Docker · Recall", t:"r",

 qs:[

  {q:"In one sentence, why do containers start so much faster than VMs?",
   a:"Because a container is just a normal process using the <b>already-running</b> host OS kernel, while a VM must boot an entire separate fake computer from scratch."},
  {q:"Name the three qualities AI/ML teams need as models get bigger and more complex, that Docker provides.",
   a:"<b>Reproducible</b> (same result every time), <b>portable</b> (runs anywhere), and <b>scalable</b> (handles more load)."}
 ]},

// ===== SECTION: BENEFITS =====
{sec:"benefits", c:"gold", eyebrow:"Benefits · 01", t:"q",
 q:`Here is a very common complaint in tech teams: <b>"It works on my machine!"</b>
 — a bug shows up for one teammate but not another, even though they are running
 the "same" code. Which single Docker idea kills this complaint completely, and why?`},

{sec:"benefits", c:"gold", eyebrow:"Benefits · 01", t:"a",
 h:"Docker ends <em>\"it works on my machine\"</em> for good",
 body:`<p>The trick is simple: instead of everyone installing Python, libraries, and
 tools separately on their own laptop (and drifting slowly out of sync), you pack
 the <b>exact</b> versions of everything into one container image. Whoever runs that
 image — your laptop, a teammate's laptop, or a production server — gets the exact
 same environment. There is no room left for tiny version differences to cause bugs.</p>
 <div class="ascii">WITHOUT DOCKER                      WITH DOCKER
─────────────────                   ───────────
Your laptop:   Python 3.11          <span class="hl">One sealed image:</span>
Teammate's PC: Python 3.9             Python 3.11.4 + numpy 1.26.2
Server:        Python 3.10            + pandas 2.1.0 + your code
     │                                          │
     ▼                                          ▼
<span class="rs">"works on my machine"</span>              <span class="hl">runs IDENTICALLY</span>
 bugs creep in slowly              everywhere the image is run</div>
 <ul class="pts">
  <li><b>Consistent environments</b> — dev, staging, and production behave identically</li>
  <li><b>Simple dependency management</b> — the exact Python version, exact library
  versions, all locked together in one package</li>
  <li><b>Easy experiment tracking</b> — each container image can be tied to a
  specific experiment or environment version</li>
  <li><b>Portable deployment</b> — cloud, VM, edge device, or laptop, the same
  image runs the same way everywhere</li>
  <li><b>No more "works on my machine"</b> — the single most repeated problem
  Docker solves for teams</li>
 </ul>
 <div class="ascii">BUILD ONCE                        RUN ANYWHERE
─────────                         ─────────────
Write code + Dockerfile   ──▶     Pull the SAME image on:
       │                            • your laptop
       ▼                            • a teammate's laptop
Build ONE image                     • staging server
       │                            • production server
       ▼                            • a cloud GPU box
Push to a registry
(Docker Hub / GHCR)       ──▶     Every one runs the exact
                                   same bytes, no reinstalling</div>
 <div class="note"><b>Memory hook:</b> A container is a sealed lunchbox. Nobody can
 quietly swap out an ingredient once it's packed and sealed.</div>`},

 <p>Notice the pattern: every single reason traces back to the same root idea —
 packaging an exact, repeatable environment. The benefit just shows up differently

// ===== SECTION: WORKFLOW =====
{sec:"workflow", c:"violet", eyebrow:"Workflow · 01", t:"q",
 q:`Machine learning has many stages: collecting data, training a model, tracking
 experiments, packaging the model, deploying it, and watching it in production.
 Guess: does Docker touch just ONE of these stages, or does it show up across

{sec:"workflow", c:"violet", eyebrow:"Workflow · 01", t:"a",
 h:"Docker shows up at <em>every single stage</em> of the ML pipeline",
 body:`<div class="ascii">Data collection & exploration → JupyterHub notebooks in a container
Feature engineering            → same, consistent dev environment
Model training                 → containerised training jobs (even on GPU clusters)
Experiment tracking            → tools like MLflow or DVC, launched via Docker
Model packaging                → serving tools like TensorFlow Serving, TorchServe,
                                  or simply a FastAPI wrapper around the model
Deployment                     → Docker Compose, Kubernetes, or Hugging Face Spaces
Monitoring                     → the same containerised ecosystem, watched over time</div>
 <div class="ascii">          ┌────────────────────────────────────┐
          │                                    ▼
   ┌──────────┐  ┌──────────┐  ┌──────────┐  ┌──────────┐
   │  <span class="hl">Collect</span>  │─▶│  <span class="hl">Train</span>    │─▶│ <span class="hl">Deploy</span>   │─▶│ <span class="hl">Monitor</span>  │
   │  data    │  │  & track │  │  as an   │  │  in      │
   │          │  │  runs    │  │  API     │  │  prod    │
   └──────────┘  └──────────┘  └──────────┘  └────┬─────┘
                                                    │
                              model drifts, retrain │
                              (loop back to Train) ◀┘
   Every box above is a Docker container.</div>
 <p>Popular ML tools — JupyterHub, VS Code dev containers, MLflow, DVC — already
 plug directly into Docker. You don't need a separate, special setup for each one.</p>
 <div class="note"><b>The one big mental model to keep:</b> "Wrap it in a small web
 API (like FastAPI), then put that wrapper in a container, then deploy it." This
 exact pattern repeats for a classical ML model doing predictions, an LLM app
 calling an AI API, and even the newer AI "tool" servers called MCP servers. Same
 shape, different insides.</p>`},

// ===== SECTION: FRONTIER =====
{sec:"frontier", c:"amber", eyebrow:"New Frontier · 01", t:"q",
 q:`Docker started as a tool for normal apps, then grew into the standard for
 classical ML. Now it is expanding again — into the world of AI agents and LLMs.
 Guess: what NEW jobs might Docker start doing for an AI agent system, beyond
 just running a model?`},

{sec:"frontier", c:"amber", eyebrow:"New Frontier · 01", t:"a",
 h:"Docker is becoming infrastructure for the LLM & agent era",
 body:`<p>This is the newest, least obvious part of the story. Docker is no longer
 just for classical ML — it is quietly becoming a core piece of how AI agents
 and LLM apps get built and shipped:</p>
 <ul class="pts">
  <li><b>Docker Model Runner</b> — a curated library of ready-made AI models you
  can pull and run locally with one simple command, the same way you'd pull a
  container image</li>
  <li><b>Docker + MCP (Model Context Protocol)</b> — trusted, pre-built "tool
  servers" for AI agents, available through a Docker Hub-style catalogue, with
  a safe, managed way to launch and manage them</li>
  <li><b>NVIDIA NIM</b> — GPU-accelerated model serving that hides away all the
  messy graphics-driver setup, deployable the same way locally or at big scale
  via Kubernetes</li>
 </ul>
 <div class="ascii">CLASSICAL DOCKER JOB              DOCKER'S NEW AI/LLM JOB
────────────────────              ────────────────────────
Package your app's code           <span class="hl">Docker Model Runner</span>
  → run it anywhere                 → pull & run a ready AI model,
                                       one command, like pulling a
                                       normal image

Publish an image on                <span class="hl">Docker + MCP catalogue</span>
Docker Hub                          → pull a trusted, pre-built
  → anyone can pull it                "tool server" for an agent,
                                       same trust model as an image

Run on any hardware                <span class="hl">NVIDIA NIM</span>
  → CPU handles it fine              → GPU-accelerated serving,
                                       CUDA/driver mess hidden away</div>
 <div class="ascii">HOW AN AGENT ACTUALLY USES AN MCP TOOL SERVER
────────────────────────────────────────────
  Your AI Agent
      │  "I need to check the weather"
      ▼
  Docker MCP catalogue  ──▶  pulls a pre-vetted,
      │                      trusted "weather-tool"
      ▼                      container — no hand-
  Runs the tool server        rolled integration code
      │
      ▼
  Result goes back to the agent, which
  continues reasoning with the new information</div>
 <div class="note"><b>Memory hook:</b> think of Docker Hub for MCP tool servers
 the same way you think of an app store — trusted, pre-checked, one-click install,
 instead of everyone hand-building their own version from scratch.</div>`},

{sec:"frontier", c:"amber", eyebrow:"New Frontier · 02", t:"q",
 q:`A modern AI "agent" system usually needs three different things working
 together: something that remembers and reasons, something that gives it tools
 to use, and the actual AI brain making decisions. If you wanted to containerise
 an agent system properly, would you cram all three into ONE container, or
 split them apart? Why?`},

{sec:"frontier", c:"amber", eyebrow:"New Frontier · 02", t:"a",
 h:"Multi-agent systems: split each layer into its own container",
 body:`<div class="ascii">MULTI-AGENT SYSTEM, PROPERLY LAYERED
─────────────────────────────────────
<span class="hl">Agent container</span>      → the agent framework itself:
                     memory + agent-to-agent talk
<span class="tl">Tool / MCP container</span> → gives the agent access to
                     outside tools and actions
<span class="rs">Model container</span>      → the actual LLM brain the
                     agent calls (maybe via Model Runner)

All three composed together with Docker Compose or Kubernetes.</div>
 <div class="ascii">docker-compose.yml  (the glue that ties it together)
─────────────────────────────────────────
services:
  <span class="hl">agent</span>:
    image: my-agent:latest      # reasoning + memory
    depends_on: [tools, model]

  <span class="tl">tools</span>:
    image: mcp-catalog/weather  # tool/MCP server

  <span class="rs">model</span>:
    image: docker-model-runner/llama3   # the LLM brain

One file, three containers, one command: <code>docker compose up</code></div>
 <p>Agent frameworks like LangGraph or CrewAI-style systems need memory,
 agent-to-agent communication, and tool access. Docker can host each of these
 as its own separate, independently manageable container — instead of one huge,
 tangled container doing everything.</p>
 <div class="note"><b>Why split them:</b> Splitting means you can upgrade, scale,
 or restart just the "tools" layer without touching the model layer at all —
 the same reason microservices get split apart instead of built as one giant app.</div>`},

{sec:"frontier", c:"amber", eyebrow:"New Frontier · Recall", t:"r",
 h:"Quick recall: New frontier",
 qs:[
  {q:"What does Docker Model Runner let you do, in one sentence?",
   a:"Pull and run <b>ready-made AI models</b> locally with a simple command, the same way you'd pull a normal container image."},
  {q:"In a multi-agent system, name the three separately-hostable container layers.",
   a:"<b>Agent containers</b> (the framework — memory, agent-to-agent talk), <b>tool/MCP-server containers</b> (outside tools and actions), and <b>model containers</b> (the actual LLM the agent calls)."},
  {q:"What does NVIDIA NIM take away the pain of doing manually?",
   a:"It hides away <b>CUDA and GPU driver configuration</b>, so you get GPU-accelerated model serving without configuring the messy graphics stack yourself."}
 ]},

// ===== SECTION: SETUP =====
{sec:"setup", c:"ink", eyebrow:"Setup · 01", t:"q",
 q:`Docker Desktop is the popular, official way to run Docker on your laptop.
 But it has one hidden catch if you plan to use it at a company job, on a
 company laptop. What do you think that catch might be?`},

{sec:"setup", c:"ink", eyebrow:"Setup · 01", t:"a",
 h:"Docker Desktop has a licensing catch — Rancher Desktop is the free escape hatch",
 body:`<table style="width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem">
 <tr><th style="text-align:left;padding:7px 4px;color:var(--dim)"></th><th style="text-align:left;padding:7px 4px;color:var(--gold)">Docker Desktop</th><th style="text-align:left;padding:7px 4px;color:var(--teal)">Rancher Desktop</th></tr>
 <tr style="border-bottom:1px solid var(--line)"><td style="padding:7px 4px;color:#c9c7bf">License</td><td style="padding:7px 4px;color:#c9c7bf">Has <span class="hl">commercial-use restrictions</span> — matters on a company device</td><td style="padding:7px 4px;color:#c9c7bf">Fully open source</td></tr>
 <tr style="border-bottom:1px solid var(--line)"><td style="padding:7px 4px;color:#c9c7bf">CLI</td><td style="padding:7px 4px;color:#c9c7bf">Native docker CLI</td><td style="padding:7px 4px;color:#c9c7bf">Fully compatible, no aliasing needed</td></tr>
 <tr><td style="padding:7px 4px;color:#c9c7bf">Model Runner / MCP</td><td style="padding:7px 4px;color:#c9c7bf">Yes, built in</td><td style="padding:7px 4px;color:#c9c7bf"><span class="rs">No equivalent yet</span></td></tr>
 </table>
 <div class="ascii">Are you on a COMPANY / office laptop?
        │
        ├── <span class="hl">YES</span> → check employer's licensing policy first
        │        │
        │        ├── OK with commercial license → <span class="tl">Docker Desktop</span>
        │        │                                  (get Model Runner + MCP)
        │        │
        │        └── NOT allowed / unsure → <span class="tl">Rancher Desktop</span>
        │                                     (open source, but no
        │                                      Model Runner / MCP yet)
        │
        └── <span class="hl">NO</span> (personal laptop) → <span class="tl">Docker Desktop</span> is fine</div>
 <div class="note"><b>Risk flag:</b> Docker Desktop's commercial-use licensing terms
 are a real thing to check against your employer's policy before installing it on
 a work laptop — never just assume it's fine. Rancher Desktop is the safe,
 fully open-source fallback, but it currently has no equivalent to Docker Model
 Runner or Docker's MCP tooling — so you would lose those specific AI features.</div>
 <div class="ascii">DOCKER DESKTOP, UNDER THE HOOD (on Mac)
─────────────────────────────────────────
Your Mac
 └── a tiny Linux VM Docker Desktop creates for you
       └── the real Docker engine runs INSIDE this VM
             └── your containers live here

This is WHY resource settings (cores/RAM) exist —
you're really sizing that hidden Linux VM, not
your Mac directly. On native Linux, this VM step
isn't needed — Docker runs directly on the host.</div>`},

{sec:"setup", c:"ink", eyebrow:"Setup · 02", t:"q",
 q:`You just installed Docker and typed <code>docker version</code> in your
 terminal. If it only prints a "Client" section and nothing else, is Docker
 fully working, or is something missing?`},

{sec:"setup", c:"ink", eyebrow:"Setup · 02", t:"a",
 h:"Always check for BOTH \"Client\" and \"Server\" — not just one",
 body:`<div class="ascii">docker version
  → must show BOTH "Client" AND "Server" sections.
    Seeing only "Client" means the Docker engine
    isn't actually running yet — a very common
    early setup mistake.</div>
 <div class="ascii">docker version    (what "Client" and "Server" MEAN)
──────────────
YOU type a command
      │
      ▼
<span class="hl">Client</span>  → the "docker" command itself, just a
          messenger, sends your request onward
      │
      ▼
<span class="tl">Server</span>  → the real engine (called "dockerd") that
          actually builds, runs, and manages containers

If Server never answers, you have the messenger
but nobody home to receive the message.</div>
 <p>Docker Desktop runs a lightweight virtual machine in the background on Mac
 (it runs natively on Linux). You can configure how many CPU cores, how much RAM,
 swap, and disk space it gets in its settings — a common starting point is
 around 4 cores and 4GB RAM, roughly half of a typical laptop's resources.
 Docker Desktop also offers a quick built-in single-node Kubernetes option for
 local experiments, though many experienced users prefer a separate, more
 serious tool called "kind" for local Kubernetes testing.</p>
 <div class="note"><b>Memory hook:</b> this one cheap check — "did I see BOTH
 words?" — saves hours of confused debugging later. Small verification habits
 like this are worth writing into any onboarding checklist for a team, instead
 of assuming it's obvious to everyone.</div>`},

{sec:"setup", c:"ink", eyebrow:"Setup · 03", t:"q",
 q:`Besides Docker itself, what other tools and accounts do you think you'd
 need before you can comfortably follow a hands-on Docker-for-AI course?
 Try naming at least three.`},

{sec:"setup", c:"ink", eyebrow:"Setup · 03", t:"a",
 h:"The full environment checklist",
 body:`<div class="ascii">☐ Docker Hub account   ☐ GitHub account   ☐ Git
☐ Python + pip         ☐ <span class="hl">UV</span> (better than pip/venv/Conda)
☐ Code editor          ☐ Hardware: 4 cores/4GB min,
                                    8 cores/8GB/10GB comfy
                                    (or a cheap cloud VM)</div>
 <ul class="pts">
  <li><b>Docker Hub account</b> — needed to publish or pull container images
  (the same role GitHub plays for source code, but for images)</li>
  <li><b>GitHub account</b> — for cloning and forking course repositories</li>
  <li><b>Git</b> installed locally</li>
  <li><b>Python</b> plus <b>pip</b></li>
  <li><b>UV</b> — a fast, modern way to manage Python packages and virtual
  environments, recommended over plain pip, venv, or Conda, so installed
  packages never pollute your system-wide Python</li>
  <li>A code editor (VS Code or similar) — though some experienced users just
  work straight from the command line</li>
  <li><b>Hardware:</b> around 4 cores / 4GB RAM is workable for small models;
  8 cores / 8GB RAM / 10GB free disk is a comfortable baseline. If your laptop
  falls short, a cheap cloud VM (DigitalOcean, Vultr, Akamai) is a fine workaround</li>
 </ul>
 <div class="ascii">WITHOUT UV                        WITH UV
──────────                        ───────
System Python                     Isolated venv per project
  │                                  │
  ▼                                  ▼
pip install X globally     vs     uv installs X only INSIDE
  │                                  that project's own space
  ▼                                  │
Project A needs numpy 1.2         ▼
Project B needs numpy 2.0         Both A and B can each have
   ⚡ CONFLICT — one breaks         their own numpy version,
                                    no conflict, ever</div>
 <div class="note"><b>Golden rule when videos and docs disagree:</b> always trust
 the written documentation over the video. Documentation is far easier to keep
 up to date than re-recording an entire video every time a tool or version changes.</div>`},

{sec:"setup", c:"ink", eyebrow:"Setup · Recall", t:"r",
 h:"Quick recall: Setup",
 qs:[
  {q:"What is the real risk of installing Docker Desktop on a work laptop?",
   a:"Its <b>commercial-use licensing terms</b> may not be allowed by your employer's policy — always check first rather than assuming it's fine."},
  {q:"What is the one Docker Model Runner / MCP feature gap if you choose Rancher Desktop instead?",
   a:"Rancher Desktop currently has <b>no equivalent</b> to Docker Model Runner or Docker's MCP tooling — you'd need Docker Desktop (or another solution) for those specific features."},
  {q:"When `docker version` only shows a \"Client\" section, what does that mean?",
   a:"The Docker <b>engine (Server) isn't actually running yet</b> — a common early setup mistake worth checking for every time."},
  {q:"Why should you trust written documentation over course videos when they disagree?",
   a:"Because documentation is <b>much easier to keep current</b> than re-recording video content every time something changes."}
 ]},

let i=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
tabs=document.getElementById('tabs'),counter=document.getElementById('counter'),
prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  return '<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>'
       + '<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  if(s.t==='q'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
      +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
      +'<div class="qtext">'+s.q+'</div>'
      +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
  } else if(s.t==='r'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
      +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
      +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
      +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
  } else {
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(s.cto?lens(s.cto,s.dir):'');
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===s.sec));
  prevBtn.disabled=(i===0);
  nextBtn.textContent=(i===S.length-1)?'Done \u2713':'Next \u2192';
  nextBtn.disabled=(i===S.length-1);
  document.querySelector('main').scrollTop=0;window.scrollTo(0,0);
}
prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.target.closest('details'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
