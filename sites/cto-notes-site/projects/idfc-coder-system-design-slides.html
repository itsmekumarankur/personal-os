const S=[

{sec:"intro",c:"ink",eyebrow:"Optimus · System Design",t:"q",q:`You have 10,000 developers in a regulated fintech. <b>Would you build your own AI coding platform or buy an existing one?</b> What are the three strongest reasons that would make you choose one over the other?<br><br><span style="font-size:.85rem;color:var(--dim)">Think about: economics, data sovereignty, developer productivity, operational complexity.</span>`},

{sec:"intro",c:"ink",eyebrow:"Optimus · System Design",t:"a",h:"Self-Hosted AI Code Generation Platform <em>for a 10,000-Person Fintech</em>",body:`
<p>Replacing expensive third-party AI coding assistants with self-hosted LLMs in a regulated fintech environment — built for <strong>data sovereignty, cost control, and production reliability</strong>, and wired directly into the Jira workflow via an autonomous agent.</p>
<div class="ascii">Scale         : 10,000 devs
Savings       : 54-72%
Cloud         : AWS
Primary model : DeepSeek Coder 33B
Timeline      : 18 months</div>
<div class="note"><b>What we learned (exec summary):</b> a regulated fintech can replace third-party AI coding tools with a self-hosted stack without giving up developer productivity — as long as sovereignty, cost and reliability are designed in from day one, not bolted on later.</div>`},

/* ---- BUSINESS CASE ---- */
{sec:"case",c:"teal",eyebrow:"Business Case · 01",t:"q",q:`If 10,000 developers generate 50 AI requests every day, <b>how would you estimate the annual cost</b> of an external AI coding platform? Before calculating, which assumptions could make your estimate wrong by 2&times; or 3&times;?`},

{sec:"case",c:"teal",eyebrow:"Business Case · 01",t:"q",q:`If the external API costs several million dollars a year, <b>what would self-hosting actually need to cost before migration becomes economically rational?</b> Would you compare only GPU cost, or something else?`},

{sec:"case",c:"teal",eyebrow:"Business Case · 01",t:"a",h:"The cost reality check",body:`
<div class="ascii">CURRENT STATE (third-party APIs)
10,000 developers × ~50 API calls/day × $0.03/call
= $15,000/day = $450,000/month = <span class="hl">$5.4M/year</span>

But this is conservative. In reality:
 • Heavy users make 200+ calls/day
 • Code generation requires longer context windows
 • Premium models cost $0.05-0.10 per call
 • <span class="rs">Real cost: $8-12M/year</span></div>
<div class="ascii">SELF-HOSTED ALTERNATIVE (Reserved, 3-year commitment)
 • 8× p4d.24xlarge (A100-40GB): ~$32/hour each
 • Total compute: ~$256/hour = $186,880/month
 • Storage, networking, management: ~$50,000/month
 • Engineering team (3 FTE): ~$50,000/month
 Total: ~$286,880/month = $3.4M/year

 <span class="tl">Annual savings: $4.6-8.6M (54-72% reduction)</span></div>
<div class="note"><b>What we learned:</b> at 10,000-developer scale, per-call API pricing scales <b>linearly</b> with usage while self-hosted infrastructure scales in <b>steps</b> (GPU nodes) — so the larger and heavier the usage, the more self-hosting's economics win.</div>`},

{sec:"case",c:"teal",eyebrow:"Business Case · 01b",t:"q",q:`Suppose the AI provider is acquired by one of your competitors tomorrow. <b>What information has your organization already exposed through the AI API</b>, and which of those exposures would be impossible to reverse?`},

{sec:"case",c:"teal",eyebrow:"Business Case · 01b",t:"q",q:`If two architectures have similar cost and productivity, <b>what architectural property would make a regulated bank prefer one over the other?</b> How would you prove that property technically rather than through a compliance statement?`},

{sec:"case",c:"teal",eyebrow:"Business Case · 01b",t:"a",h:"The control imperative: data sovereignty",body:`
<div class="ascii">DATA SOVEREIGNTY MATRIX
                      Third-Party API   Self-Hosted
Code leaves VPC       YES ⚠            NO ✅
Provider sees code    YES ⚠            NO ✅
Audit trail           Limited          Complete
Model customization   Impossible       Full control
Latency SLA           Provider's       Your infrastructure
Regulatory (SOC2)     Complex          Direct control</div>
<div class="note"><b>What we learned:</b> cost savings alone don't justify the migration risk — the real unlock is that <b>code never leaves the VPC</b>, giving complete audit trails and regulatory control a third-party API can never offer.</div>`},

{sec:"case",c:"teal",eyebrow:"Business Case · Recall",t:"q",q:`You have 30 seconds with the CTO: <b>what numbers and arguments would you use to justify self-hosting</b> without showing the detailed calculations?`},

{sec:"case",c:"teal",eyebrow:"Business Case · Recall",t:"r",h:"Quick recall: the business case",qs:[
{q:`Conservative vs realistic third-party spend, and the self-hosted figure.`,a:`Conservative <b>$5.4M/yr</b>; realistic with heavy usage <b>$8–12M/yr</b>. Self-hosted ~$286,880/month = <b>$3.4M/yr</b> &rarr; savings $4.6–8.6M (54–72%).`},
{q:`Name the six rows of the sovereignty matrix.`,a:`Code leaves VPC, provider sees code, audit trail, model customization, latency SLA, regulatory (SOC2) control.`}]},

/* ---- LLM SELECTION ---- */
{sec:"llm",c:"gold",eyebrow:"LLM Selection · 02",t:"q",q:`You have eight candidate models and one model scores highest on raw code-generation quality. <b>Would you automatically select it for production?</b> What dimensions could make the highest-scoring model the wrong architectural choice?`},

{sec:"llm",c:"gold",eyebrow:"LLM Selection · 02",t:"q",q:`Design your model-selection framework before seeing these scores. <b>Which six dimensions would you measure</b>, and how would you weight them for an enterprise coding assistant?`},

{sec:"llm",c:"gold",eyebrow:"LLM Selection · 02",t:"a",h:"The candidate pool: 8 models, 6 dimensions",body:`
<div class="ascii">EVALUATION MATRIX (1-10, higher = better)
Model                 CodeGen  Latency  Memory  Fine-tune  License
Code Llama 34B          8.2      7.5      8.0      9.0      Open
DeepSeek Coder 33B      8.5      7.8      8.2      8.5      Open
Mistral 7B              6.5      9.5      9.5      8.0      Apache
StarCoder2 15B          7.8      8.0      8.5      7.5      Open
Llama 2 70B             8.8      5.0      5.0      9.0      Custom
GPT-NeoX 20B            6.0      7.0      7.0      7.0      Apache
Phi-2 (fine-tuned)      7.2      9.0      9.8      6.0      MIT
WizardCoder 34B         8.7      7.0      7.5      8.0      Open</div>
<div class="note"><b>What we learned:</b> benchmark scores on paper rarely tell the full story — <b>no single model wins on every axis</b>, which is exactly why a multi-model strategy made more sense than picking one "best" model.</div>`},

{sec:"llm",c:"gold",eyebrow:"LLM Selection · 02b",t:"q",q:`Would you deploy one LLM for every request, or build a model router? <b>If you build a router, what signals would determine</b> whether a request goes to a small, medium, or large model?`},

{sec:"llm",c:"gold",eyebrow:"LLM Selection · 02b",t:"a",h:"The final decision: a multi-model strategy",body:`
<div class="ascii">PRIMARY WORKHORSE: DeepSeek Coder 33B
 |- best code-generation quality-to-latency ratio
 |- open license, no commercial restrictions
 |- excellent at financial domain code patterns
 +- runs on A100-40GB with comfortable headroom

FALLBACK / FAST PATH: Mistral 7B (fine-tuned)
 |- lightning fast for simple completions
 |- runs on T4 GPUs at a fraction of the cost
 |- perfect for IDE autocomplete
 +- 95% of simple queries don't need 33B parameters

SPECIALIZED PATH: WizardCoder 34B
 |- complex refactoring tasks
 |- better at test generation
 +- only invoked by explicit user request</div>
<div class="ascii">WHY OTHERS WERE REJECTED
Llama 2 70B  - too large, too slow: 2.5s inference on A100
               (unacceptable for IDE), needs 2× A100s, and Meta's
               custom license created legal review delays
GPT-NeoX     - outdated architecture: RoPE embeddings missing,
               poor context handling, declining community support
StarCoder2   - good not great: filled-attention bugs in initial
               release, sparse finetuning documentation
Phi-2        - too small: failed multi-file refactoring, cannot
               handle the 16K context requirement</div>
<div class="ascii">INTERNAL BENCHMARK - 500 real PRs from the last year (Pass@1)
Task Category             DS-Coder  WizCoder  Mistral
CRUD API Generation         92%       89%      78%
SQL Query Building          88%       85%      82%
Unit Test Writing           76%       82%      65%
Refactoring (Multi-file)    71%       74%      42%
Regex/Pattern Match         94%       91%      88%
Security Review             68%       65%      55%</div>
<div class="note"><b>What we learned:</b> the best model for a task isn't always the biggest — routing <b>95% of simple completions to a small fine-tuned model</b> while reserving the 33B for real generation is what made the economics and latency work.</div>`},

{sec:"llm",c:"gold",eyebrow:"LLM Selection · Recall",t:"q",q:`Imagine your primary model suddenly becomes 2&times; slower. <b>Which workloads would you immediately move to another model</b>, and what quality degradation would you be willing to tolerate?`},

{sec:"llm",c:"gold",eyebrow:"LLM Selection · Recall",t:"r",h:"Quick recall: model choice",qs:[
{q:`Name the three-model strategy and each one's job.`,a:`<b>DeepSeek Coder 33B</b> = primary workhorse. <b>Mistral 7B fine-tuned</b> = fast path for simple completions/IDE autocomplete (95% of simple queries). <b>WizardCoder 34B</b> = specialized path for complex refactoring and test generation, on explicit request only.`},
{q:`Why was Llama 2 70B rejected despite the best CodeGen score?`,a:`2.5 s inference on A100 (unacceptable for IDE use), needs 2× A100s for comfortable deployment, and Meta's custom license caused legal review delays.`},
{q:`Which internal-benchmark categories were the model's weakest?`,a:`<b>Security review (68%)</b> and <b>multi-file refactoring (71%)</b> — WizardCoder edged it on unit tests (82%) and refactoring (74%).`}]},

/* ---- AWS INFRA ---- */
{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03",t:"q",q:`Design the network architecture from scratch: <b>where should internet-facing traffic terminate</b>, where should application services live, where should GPUs live, and where should state live? What security boundary would you create between each layer?`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03",t:"q",q:`Looking at the proposed topology, <b>what would happen if the GPU layer were compromised?</b> Can an attacker move laterally into the application or data layer? What controls would prevent that?`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03",t:"a",h:"VPC topology",body:`
<div class="ascii">INTERNET
   |
[AWS WAF + Shield]
   |
[Route 53 DNS] --- [CloudFront CDN]
   |
+--------------------------------------------------+
| VPC (10.0.0.0/16)                                |
| +----------------------------------------------+ |
| | Public Subnets (DMZ)                         | |
| |   [Application Load Balancer] ALB-1a  ALB-1b | |
| +----------------------+-----------------------+ |
| +----------------------v-----------------------+ |
| | Private App Subnets                          | |
| |   IDFC-Coder Wrapper (ECS Fargate)           | |
| |     Task-1   Task-2                          | |
| +----------------------+-----------------------+ |
| +----------------------v-----------------------+ |
| | GPU Compute Subnets                          | |
| |   SageMaker Endpoints                        | |
| |     Endpoint-1 (DS-33B):  ml.p4d.24xl ×2     | |
| |     Endpoint-2 (Mistral): ml.g5.12xl  ×2     | |
| +----------------------------------------------+ |
| +----------------------------------------------+ |
| | Data/State Subnets                           | |
| |   ElastiCache(Redis)  DynamoDB(Cache)        | |
| |   SQS (Queues)        S3 Model Registry      | |
| +----------------------------------------------+ |
+--------------------------------------------------+</div>
<div class="note"><b>What we learned:</b> isolating wrapper service, GPU compute and data layers into separate subnets isn't just security hygiene — it's what lets each layer <b>scale, fail, and be audited independently</b>.</div>`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03b",t:"q",q:`An H100 is dramatically faster than an A100. If performance is your goal, <b>why wouldn't you simply buy H100s?</b> What metric should actually determine the winner: raw inference speed, cost/request, concurrency, latency, or something else?`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03b",t:"q",q:`You have 500 concurrent developers but a fixed monthly GPU budget. <b>Would you optimize for maximum requests per second or minimum cost per request?</b> How would you calculate the right balance?`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03b",t:"a",h:"The GPU math: A100 vs H100",body:`
<div class="ascii">OUR CONSTRAINTS
 |- 10,000 developers, peak concurrency ~500
 |- Target latency: p95 &lt; 800ms
 |- Budget: $250K/month for compute
 +- Must fit models in a single GPU (no tensor parallelism)

OPTION 1: A100-40GB (p4d.24xlarge)
 |- 8× A100 GPUs, 40GB each
 |- 1 instance of DeepSeek-33B per GPU; with quantization, 2 per GPU
 |- Per-instance cost: $32.77/hr (1-year reserved)
 |- Capacity per node: 8-16 concurrent requests
 |- 8 nodes × 8 GPUs × 1.5 (avg utilization) = 96 concurrent
 +- COST: 8 × $32.77 × 730 = $191,380/month

OPTION 2: H100-80GB (p5.48xlarge)
 |- 8× H100 GPUs, 80GB each; 2-3× faster inference than A100
 |- Per-instance cost: $98.32/hr (1-year reserved)
 |- Capacity per node: 24-32 concurrent requests
 |- 3 nodes × 8 GPUs × 2 = 48 concurrent (but 2× faster)
 +- COST: 3 × $98.32 × 730 = $215,200/month

<span class="hl">WINNER: A100s</span> - better cost/capacity ratio, sufficient
performance for our latency targets, more flexible for fine-tuning.</div>
<div class="note"><b>What we learned:</b> the faster, more expensive H100 wasn't the right call — once you model real concurrency against latency targets, <b>the "better" chip can still be the worse business decision</b>. (The real question: what happens Monday morning when 40% of developers hit the system at once?)</div>`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03c",t:"q",q:`If traffic is highly bursty, would you solve the problem by <b>adding more GPUs, increasing batch size, queuing requests, or accepting higher latency?</b> Which combination gives you the best cost/latency trade-off?`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · 03c",t:"a",h:"Auto-scaling &amp; the batching queue",body:`
<div class="ascii">SAGEMAKER AUTO-SCALING POLICY - DeepSeek endpoint (primary)
Target Tracking:
 |- Metric: SageMakerVariantInvocationsPerInstance
 |- Target: 8 requests per instance
 |- Scale-out: when &gt; 10 for 2 minutes
 +- Scale-in:  when &lt; 3 for 10 minutes
Min Instances: 4 (off-peak)   Max Instances: 16 (peak)
Cool-down: 300 seconds
Scheduled Scaling:
 |- Mon-Fri 08:00-10:00 : Min 12 instances
 |- Mon-Fri 10:00-17:00 : Min 8 instances
 +- Weekends / 02:00-06:00 : Min 2 instances</div>
<div class="ascii">BATCH OPTIMIZATION QUEUE
Client sends: "Write a function to..."
   |
[SQS queue accumulates for a 50ms window]
   |
Batch of 4 requests formed: [req1, req2, req3, req4]
   |
[Single forward pass through model]
   |
[Responses split and returned individually]

Result: <span class="hl">4× throughput, same GPU memory</span></div>
<div class="note"><b>What we learned:</b> static capacity planning fails at this scale — <b>scheduled scaling</b> (matching known daily/weekly patterns) combined with reactive <b>target-tracking</b> is what kept cost and latency both in check.</div>`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · Recall",t:"q",q:`A production incident occurs and the system suddenly receives 5&times; normal traffic. <b>Walk through what should happen</b> from the first incoming request until additional GPU capacity becomes available.`},

{sec:"aws",c:"violet",eyebrow:"AWS Infra · Recall",t:"r",h:"Quick recall: infrastructure",qs:[

{sec:"wrap",c:"rose",eyebrow:"Jira Agent · 05",t:"q",q:`You're building an autonomous agent that converts Jira tickets into code. <b>What should trigger the agent</b>: polling, webhooks, scheduled jobs, or events? What failure modes exist with each approach?`},

{sec:"wrap",c:"rose",eyebrow:"Jira Agent · 05",t:"q",q:`The agent reads a ticket and generates code. <b>At what point should you require human approval</b>, and when—if ever—would you allow the agent to create a PR automatically?`},

{sec:"wrap",c:"rose",eyebrow:"Jira Agent · 05",t:"a",h:"Jira integration: the autonomous agent",body:`
<div class="ascii">JIRA AGENT CONTROLLER
Scheduler (EventBridge) - every 30 minutes: cron(0/30 * * * ? *)
 |- State Check (DynamoDB): last poll timestamp, cursor: ticket-45678
Jira Connector (rate limited)
 |- JQL: project = "IDFC" AND status in ("In Development","Ready")
 |        AND updated &gt;= -30m ORDER BY updated DESC
 |- Rate limits: Jira Cloud 10 req/s; our self-hosted 50 req/s
 |- Token bucket: burst 30, sustained 10/sec
 +- Exponential backoff: 1s, 2s, 4s, 8s
Prompt Transformer - ticket -&gt; prompt
 |  {"ticket_id":"IDFC-1234","title":"Add fraud detection rule",
 |   "acceptance_criteria":["Must flag transactions &gt; $10K",
 |                          "Must not exceed 100ms latency"]}
 +- transforms to: "Write a Java method that implements..."
Result Publisher - three output actions
 |- Option A: comment on ticket ("🤖 AI Suggestion: &#96;&#96;&#96;java...")
 |- Option B: create subtask ("Implement: ...")
 +- Option C: create pull request (via Bitbucket/GitHub API)</div>
<div class="note"><b>What we learned:</b> turning tickets into code isn't a single API call — it's a full pipeline of polling, rate-limited fetching, prompt transformation, and a <b>deliberate choice of how to publish</b> the result.</div>`},

{sec:"wrap",c:"rose",eyebrow:"Jira Agent · 05b",t:"q",q:`Suppose Jira search says ticket version 10 exists, but a direct GET returns version 11. <b>Which version should the AI process?</b> How would you design the system so the same ticket isn't processed twice?`},

{sec:"wrap",c:"rose",eyebrow:"Jira Agent · 05b",t:"a",h:"Handling Jira's quirks: eventual consistency",body:`
<div class="ascii">EVENTUAL CONSISTENCY PATTERN
Problem: Jira's search index may be stale
Solution: DUAL VERIFICATION
 1. Get tickets from search (fast, maybe stale)
 2. For each candidate, direct GET ticket (slow, always current)
 3. Compare versions:
      if search.version &lt; direct.version: use direct version
      if already processed (idempotency key): skip

RATE LIMIT EXHAUSTION HANDLING
 • Pre-emptive: track X-RateLimit-Remaining
 • Reactive: queue overflow -&gt; DLQ
 • Backpressure: skip poll if previous not complete
 • Priority queue: urgent tickets first</div>
<div class="note"><b>What we learned:</b> third-party SaaS APIs are <b>eventually consistent by default</b> — building dual verification (search + direct GET) was necessary just to avoid acting on stale data. Open question worth arguing: is auto-generating code from tickets helping developers, or just creating more review burden?</div>`},

{q:`Raw, cached and blended cost per request?`,a:`Raw <b>$0.088</b>; with 40% cache hits <b>$0.053</b>; blended for our actual usage <b>$0.025</b> per developer request (vs Claude API $0.03–0.10).`},

{sec:"prod",c:"amber",eyebrow:"Production · 06",t:"q",q:`Your model endpoint isn't failing—it is simply becoming slower. <b>At what point should your system stop sending requests to it?</b> What should happen to requests already in flight?`},

{sec:"prod",c:"amber",eyebrow:"Production · 06",t:"q",q:`How many times should you retry an AI request? <b>When does retrying improve reliability, and when does retrying actually make an outage worse?</b>`},

{sec:"prod",c:"amber",eyebrow:"Production · 06",t:"a",h:"Resilience: circuit breaker &amp; retries",body:`
<div class="ascii">CIRCUIT BREAKER STATE MACHINE
   [CLOSED]  (normal operation)
      |  failures &gt;= 5 in a 60s window
      v
   [OPEN]    (fail fast, return cache)
      |  30 second timeout
      v
   [HALF-OPEN] (test with 1 request)
      |  Success -&gt; CLOSED
      +- Failure -&gt; OPEN (back to timeout)</div>
<div class="ascii">RETRY STRATEGY WITH JITTER
Attempt 1: immediate
Attempt 2: 1s + random(0-200ms)
Attempt 3: 2s + random(0-400ms)
Attempt 4: 4s + random(0-800ms)
Attempt 5: 8s + random(0-1600ms)  [MAX]
Then: Dead Letter Queue -&gt; SQS -&gt; Lambda -&gt; Alert -&gt; Slack</div>
<div class="note"><b>What we learned:</b> circuit breakers and jittered retries aren't boilerplate — they're what stands between a slow GPU endpoint and a full outage, by <b>failing fast and falling back to cache</b> instead of queuing forever.</div>`},

{sec:"prod",c:"amber",eyebrow:"Production · 06b",t:"q",q:`You have a new model version that is 10% better at code generation but 20% slower. <b>How would you safely introduce it into production</b> without risking all developers at once?`},

{sec:"prod",c:"amber",eyebrow:"Production · 06b",t:"a",h:"Model deployment: canary with auto-rollback",body:`
<div class="ascii">CANARY DEPLOYMENT FOR MODEL UPDATES
Current: deepseek-v1.2 (tag: prod)   New: deepseek-v1.3 (tag: canary)
Traffic splitting (SageMaker), endpoint idfc-coder-prod:
 |- Variant-A (v1.2): 90% weight
 +- Variant-B (v1.3): 10% weight
Monitoring period: 4 hours

AUTOMATIC ROLLBACK IF:
 |- p95 latency &gt; 1200ms (baseline: 800ms)
 |- Error rate &gt; 5% (baseline: 1%)
 |- Token output length &lt; 50 (hallucination risk)
 +- User rejection rate &gt; 20%

GRADUAL PROMOTION:
 Hour 4: 25%  |  Hour 8: 50%  |  Hour 12: 100%
 After 24h stable: decommission v1.2</div>
<div class="note"><b>What we learned:</b> model updates need the same production rigor as code deploys — canary splitting with automatic rollback thresholds (latency, error rate, even <b>output length as a hallucination signal</b>) catches regressions before they reach everyone.</div>`},

{sec:"prod",c:"amber",eyebrow:"Production · 06c",t:"q",q:`With thousands of developers sharing the same AI platform, <b>what would you monitor</b> to answer: "Who is consuming capacity, who is getting poor latency, and who is costing us the most?"`},

Business Metrics          Technical Metrics

 • Tokens consumed         • Queue depth
 • Cache hit rate          • GPU utilization
 • Cost per team           • Error rates

X-RAY TRACE: request-abc123
 |- API Gateway:        12ms

<div class="ascii">TENANT ISOLATION MODEL
Option A: SOFT MULTI-TENANCY  (WE CHOSE THIS)

/* ---- WAR STORIES ---- */
{sec:"war",c:"rose",eyebrow:"War Story 1 · 07",t:"q",q:`p50 is 1.2 seconds and p95 is 3.5 seconds. <b>Before blaming the LLM, draw the entire request path</b> and identify every component that could contribute to tail latency.`},

{sec:"war",c:"rose",eyebrow:"War Story 1 · 07",t:"q",q:`If the model itself is responsible for most of the latency, <b>what are your options besides replacing the model?</b> Which would you try first and why?`},

{sec:"war",c:"rose",eyebrow:"War Story 1 · 07",t:"a",h:"Challenge 1 — the latency nightmare",body:`
<div class="ascii">PHASE 1 - Unoptimized (Week 1)
Client -&gt; API Gateway -&gt; Lambda -&gt; SageMaker -&gt; Client
 |- p50: 1200ms
 |- p95: 3500ms
 +- User feedback: "Slower than Copilot!"

ROOT CAUSE ANALYSIS - why so slow?
 |- No batching: one forward pass per request
 |- Cold starts: Lambda initialization 200-400ms
 |- No streaming: waiting for the full response
 |- Model too big: 33B parameters, lots of compute
 +- Network latency: cross-AZ calls</div>
<div class="ascii">PHASE 2 - Optimized (Week 3)
Client -&gt; ALB -&gt; ECS (warm) -&gt; Batched -&gt; Streaming
Changes made:
 |- Switched to ECS Fargate (no cold starts)
 |- Dynamic batching (50ms accumulation window)
 |- Token streaming via Server-Sent Events
 |- Model quantization: FP32 -&gt; INT8 (2× speed)
 |- KV-cache optimization for repeated prefixes
 +- Cross-AZ placement groups for SageMaker
Results:
 |- p50: 340ms  (3.5× improvement)
 |- p95: 720ms  (4.8× improvement)
 +- Throughput: 800 req/sec (from 200)</div>
<div class="note"><b>What we learned:</b> the 3.5 s p95 wasn't a model problem — it was an <b>architecture problem</b> (cold starts, no batching, no streaming). Fixing the plumbing delivered a bigger win than any model swap would have.</div>`},

{sec:"war",c:"rose",eyebrow:"War Story 2 · 07",t:"q",q:`A 33B model requires roughly 66 GB at FP16, but your GPU has 40 GB. <b>What exactly happens when you try to load it?</b> What architectural options exist before buying a larger GPU?`},

{sec:"war",c:"rose",eyebrow:"War Story 2 · 07",t:"q",q:`Would you quantize the model, distribute it across GPUs, reduce context, reduce batch size, or choose another model? <b>How would you decide which lever to pull first?</b>`},

{sec:"war",c:"rose",eyebrow:"War Story 2 · 07",t:"a",h:"Challenge 2 — the OOM crisis",body:`
<p><strong>What happened:</strong> Tuesday 14:00, production outage — SageMaker returning 500s. Root cause: DeepSeek-33B OOM on the 40 GB A100 because the context window grew to 16K tokens.</p>
<div class="ascii">MEMORY ANALYSIS - GPU budget 40GB
Model weights (FP16): 33B × 2 bytes = 66GB
   <span class="rs">Wait, that doesn't fit!</span>
Recalculate with quantization:
Model weights (INT8): 33B × 1 byte = 33GB
KV cache (batch 4, seq_len 4096):     8GB
Activations:                          4GB
CUDA overhead:                        2GB
------------------------------------------
Total: 47GB  <span class="rs">❌ STILL DOESN'T FIT!</span></div>
<div class="ascii">THE FIX
Solution 1: Flash Attention 2
 |- reduces memory 5-10× for attention
 +- KV cache: 8GB -&gt; 1.5GB
Solution 2: Gradient checkpointing (even for inference)
 +- Activations: 4GB -&gt; 1GB
Solution 3: Batch size reduction
 +- from 4 to 2 during peak

NEW MEMORY PROFILE
 Weights 33GB | KV cache 1.5GB | Activations 1GB | Overhead 2GB
 Total: 37.5GB  <span class="tl">✅ FITS!</span>

Also added automatic context window adjustment:
 |- Monitor: GPU memory utilization
 |- If &gt; 85%: reduce max_tokens by 25%
 +- Alert: if sustained &gt; 90% for 5 min</div>
<div class="note"><b>What we learned:</b> back-of-envelope memory math (FP16 weights alone) is <b>dangerously misleading</b> — real GPU budgets must account for KV cache, activations and CUDA overhead together.</div>`},

{sec:"war",c:"rose",eyebrow:"War Story 3 · 07",t:"q",q:`The AI invents an internal API and generates code using it. <b>Is this fundamentally a model problem, a prompt problem, a retrieval problem, or a governance problem?</b> How would you prevent it systematically?`},

{sec:"war",c:"rose",eyebrow:"War Story 3 · 07",t:"q",q:`If the model doesn't know whether an internal API exists, <b>what evidence should you provide to the model</b> before allowing it to generate code?`},

{sec:"war",c:"rose",eyebrow:"War Story 3 · 07",t:"a",h:"Challenge 3 — hallucination mitigation",body:`
<ul class="pts">
<li><strong>Non-existent APIs</strong> — model invents calls like <code>BankAPI.getInstance().getV2Client()</code>, an internal API not present in training data.</li>
<li><strong>Incorrect business logic</strong> — suggests a $10,000 fraud threshold when policy requires $5,000.</li>
<li><strong>Security anti-patterns</strong> — string-concatenated SQL, a firing offence in fintech code.</li>
</ul>
<div class="ascii">SOLUTION 1 - GROUNDED SYSTEM PROMPT
You are IDFC-First Bank's internal code assistant.
CONSTRAINTS (enforced):
1. Only use APIs from our SDK:
   com.idfc.banking.v3.*  com.idfc.fraud.detection.*
   com.idfc.compliance.*
2. All database queries MUST use parameterized statements
   (PreparedStatement only)
3. All monetary values MUST use BigDecimal, never float/double
4. All external calls MUST have: timeout (max 30s), circuit
   breaker, retry with backoff
5. If unsure about an API or policy, respond with:
   "NEEDS_CLARIFICATION: [question]"  <span class="hl">Do not guess.</span>
CONTEXT INJECTION:
   {relevant_code_from_codebase} {relevant_confluence_docs}
   {jira_acceptance_criteria}</div>
<div class="ascii">SOLUTION 2 - POST-PROCESSING VALIDATION (before returning)
1. Static analysis (SonarQube rules)
   |- no SQL injection patterns
   |- no hardcoded credentials
   +- checked exceptions handled
2. API validation
   |- verify all method calls exist in the SDK
   +- if not found: replace with a comment
3. Policy check
   |- fraud thresholds read from config service
   +- inject correct values</div>
<div class="note"><b>What we learned:</b> prompting alone can't be trusted to stop hallucinated APIs or wrong compliance thresholds — it took <b>explicit constraints, a "don't guess, ask" instruction, and a post-processing validation layer</b> to make outputs safe to ship.</div>`},

{sec:"war",c:"rose",eyebrow:"War Story 4 · 07",t:"q",q:`You've proven the architecture with hundreds of developers. Now you're going to 10,000. <b>What is the first component you expect to become the bottleneck</b>, and why?`},

{sec:"war",c:"rose",eyebrow:"War Story 4 · 07",t:"a",h:"Challenge 4 — the 10,000-user rollout",body:`
<div class="ascii">PHASED ADOPTION STRATEGY
Phase 1: Pioneers (Month 1, 100 users)
 |- selected power users from Core Platform team
 |- direct Slack channel with platform team, weekly feedback
 +- Goal: iron out UX issues, gather testimonials
Phase 2: Early Adopters (Month 2, 1,000 users)
 |- add 2-3 more teams; IDE plugin (VS Code, IntelliJ)
 |- gamification: leaderboard of tokens saved
 +- Goal: prove productivity improvement
Phase 3: Majority (Month 3-4, 5,000 users)
 |- self-service onboarding portal; 30-min training video
 |- auto-enrollment for new hires
 +- Goal: make it default, not optional
Phase 4: Laggards (Month 5-6, 10,000 users)
 |- mandatory for certain ticket types
 |- "AI-first" workflow: must review AI suggestion before
 |   writing from scratch
 +- Goal: complete transformation</div>
<div class="ascii">ADOPTION FRICTION POINTS &amp; SOLUTIONS
"It's slower than Copilot"
 -&gt; show latency metrics; it's actually faster for our codebase
    because of context injection
"The code is wrong"
 -&gt; add "Report bad suggestion" button; track rejection rate and
    feed back to fine-tuning; public dashboard showing improvement
"I don't trust AI"
 -&gt; start with test generation (low risk); show bugs caught by AI
    suggestions; peer pressure: "your team's top performer uses it"
"It doesn't understand our codebase"
 -&gt; RAG pipeline: index all repos, retrieve context;
    fine-tune on our private code (with permissions)</div>
<div class="note"><b>What we learned:</b> technology readiness and organizational readiness are two different problems — the phased pioneer &rarr; early adopter &rarr; majority &rarr; laggard rollout mattered as much as any latency or accuracy fix.</div>`},

{sec:"war",c:"rose",eyebrow:"War Stories · Recall",t:"q",q:`Without looking back, <b>name four production problems you would expect</b> when taking an AI coding platform from prototype to enterprise scale.`},

{sec:"score",c:"ink",eyebrow:"CTO Retrospective · 09",t:"q",q:`Which architectural mistake is more dangerous: <b>under-engineering the first version or over-engineering it?</b> How would you design the smallest architecture that can still teach you the right things?`},

{sec:"score",c:"ink",eyebrow:"CTO Retrospective · 09",t:"a",h:"What we got right, and what we'd change",body:`
<div class="ascii">WHAT WE GOT RIGHT
1. STARTED WITH THE HARDEST TEAM
   +- Core Platform was most demanding, most skeptical
   +- If we could satisfy them, others would follow
2. BUILT FOR FAILURE
   +- every component has a fallback; circuit breakers everywhere
   +- "What happens when this breaks at 3 AM?"
3. MEASURED OBSESSIVELY
   +- you can't improve what you don't measure
   +- every decision backed by data; killed features without impact
4. TREATED IT AS PRODUCT, NOT TOOL
   +- UX design, not just an API
   +- developer advocacy team; regular town halls for feedback</div>
<div class="ascii">WHAT WE'D DO DIFFERENTLY
1. START SMALLER
   +- begin with a 7B model for autocomplete only
   +- add complexity gradually - <span class="rs">we overbuilt the initial system</span>
2. INVEST IN FINE-TUNING EARLIER
   +- generic models hallucinate on proprietary APIs
   +- fine-tuning on our codebase would have saved months
   +- now running weekly fine-tuning jobs
3. PLAN FOR GPU SHORTAGES
   +- A100 availability was constrained
   +- should have reserved instances from day 1
   +- consider multi-cloud (GCP TPUs as backup)
4. OVER-COMMUNICATE COSTS
   +- developers don't see GPU bills
   +- should show "this request cost $0.003"
   +- creates natural conservation behaviour</div>
<div class="note"><b>The real question nobody asks:</b> "Are we actually making developers better, or just faster?" AI code generation can create <b>code debt at unprecedented speed</b>. Investments made in response: AI-generated code review tools (fighting fire with fire), mandatory test coverage thresholds for AI code, "explain the code" sessions in PR reviews, and tracking the long-term maintenance burden of AI-generated code. The goal isn't to replace developers — it's to remove the boring parts so they can focus on architecture, security and innovation, while staying vigilant that we're not creating a generation of developers who can't code without AI.</div>`},

let i=0;

prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  return '<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>'
       + '<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  if(s.t==='q'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
      +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
      +'<div class="qtext">'+s.q+'</div>'
      +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
  } else if(s.t==='r'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
      +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
      +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
      +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
  } else {
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(s.cto?lens(s.cto,s.dir):'');
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));

prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
