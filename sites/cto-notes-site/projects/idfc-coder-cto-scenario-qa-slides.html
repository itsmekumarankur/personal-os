{sec:"intro",c:"ink",eyebrow:"Optimus · CTO Pressure Test",t:"a",h:"21 Scenario Questions on the <em>Optimus AI Platform</em>",body:`
<p>The CTO pressure-tests the self-hosted AI coding platform with the scenarios that actually happen at 2 AM when things go wrong — and the architect answers every one, with the trade-offs left in.</p>
<div class="note">"You've presented a beautiful architecture. Now let me pressure-test it with the scenarios that actually happen at 2 AM when things go wrong. <b>I want to see how deep your understanding goes.</b>"</div>
<div class="ascii">Questions : 21
Categories: 6 + Bonus
Format    : Scenario -&gt; Question -&gt; Answer

1 Catastrophic Failures   Q1-Q3    4 Technical Deep-Dives  Q10-Q13
2 Edge Cases              Q4-Q6    5 Strategic &amp; Ethical   Q14-Q16
3 Organizational &amp; Human  Q7-Q9    6 Future-Proofing       Q17-Q20
                                   7 Bonus Meta-Question   Q21</div>
<div class="note"><b>How to use:</b> each "?" slide gives you the scenario and the CTO's question. Answer it yourself before pressing Next — that's the whole point of a pressure test.</div>`},

/* ---- CATASTROPHIC ---- */
{sec:"cat",c:"rose",eyebrow:"Q1 · Catastrophic",t:"q",q:`<b>9:03 AM Monday.</b> 3,200 concurrent requests. Auto-scaling max is 16 A100 instances but SageMaker takes 5–7 min to spin up. SQS has 15,000 messages and growing. p99 is already 8 s. Circuit breakers just tripped on 4 of 8 instances.<br><br>Walk through the next 10 minutes: <b>what fails first, what cascades?</b> And would the system be better off if you had deliberately throttled users at 8:55 AM?`},

{sec:"cat",c:"rose",eyebrow:"Q1 · The Monday Morning Tsunami",t:"a",h:"A1 — the 10-minute cascade, and predictive throttling",body:`
<div class="ascii">T+0 (9:03) 3,200 concurrent hit the system
 |- 8 instances × 8 GPUs × batch(4) = 256 concurrent capacity
 |- immediate queue depth: 2,944 waiting
 +- <span class="rs">CRITICAL FLAW: circuit breakers monitor ERRORS, not backpressure</span>
T+2 (9:05) AutoScaling triggered by ApproximateBacklogSize
 |- scale-out 8 -&gt; 12, BUT provisioning takes 5-7 minutes
 +- queue depth 8,400, growing at 70 req/sec
T+4 (9:07) 4 instances trip breakers on timeout errors
 |- NOT because they're failing - because callers time out waiting
 |- remaining capacity: 4 instances = 128 concurrent
 +- queue 14,200; estimated clearance 111 minutes
T+6 (9:09) ECS wrapper threads exhausted; new requests get 503
 |- BUT users' IDEs retry automatically (3 retries × 3,200 users)
 |- <span class="rs">EFFECTIVE LOAD DOUBLES: 3,200 real + 6,400 retries</span>
 +- queue 22,000+; API Gateway throttles at 1,000 req/sec
T+8 (9:11) ElastiCache hits connection limit -&gt; cache lookups fail
 |- cache miss -&gt; SageMaker -&gt; increases queue further
 +- new instances arrive, immediately slammed; 2 OOM
T+10 (9:13) 14 instances up, 2 in OOM recovery, queue 18,000
 |- p99 latency: 45 seconds | error rate: 34%
 +- recovery begins but trust is already damaged</div>
<div class="note"><b>The real problem:</b> circuit breakers were watching the wrong thing. They monitored <b>error rates, not backpressure</b>. A system under extreme load doesn't fail with errors — it just gets catastrophically slow.</div>
<div class="ascii">SOLUTION 1 - PREDICTIVE THROTTLING
Historical Pattern Analyzer (runs continuously, 90 days data):
 |- Monday 9:00-9:15: 340% of average load
 |- after holidays: 520% spike
 |- after all-hands: 280% spike
 +- lunch 12:30-13:30: 42% of average
Predictive pre-scaling (runs 8:45 AM Monday):
 |- expected load 3,000 concurrent -&gt; 3,000/4 = 750 slots
 |- GPUs needed 750/8 = 94 -&gt; instances needed 12
 +- <span class="hl">PRE-SCALE TO 14 (15% buffer) at 8:50 AM</span></div>
<div class="ascii">SOLUTION 2 - GRACEFUL DEGRADATION (not circuit breaking)
When queue_depth &gt; capacity × 2, apply QUALITY TIERS:
 |- P1 (5% of users):  full model, 16K context
 |                     on-call engineers, critical bug fixes
 |- P2 (25%):          full model, 4K context (active dev work)
 |- P3 (70%):          fast model (Mistral-7B) autocomplete
 +- P4 (excess):       "High load - try again soon"
Users see: "AI running in economy mode due to high demand."
P1 users never know there's a problem. No one gets blocked.

SOLUTION 3 - TOKEN-BASED ADMISSION CONTROL
Normal load: max_tokens 2,000 | &gt;80%: 1,000
&gt;90%: 500 | &gt;95%: 200 (autocomplete only)
-&gt; never fully reject; throughput rises as token limit drops;
   users perceive "less detailed", not "broken"</div>
<div class="note"><b>Why throttling at 8:55 is better:</b> telling 10% of users "please wait 2 minutes" at 8:55 prevents 90% from having a terrible experience at 9:05. It's a highway traffic meter — slightly delaying entry prevents complete gridlock. Implementation: return <code>Retry-After: 120</code> to non-critical requests from 8:55.<br><br><b>The deeper lesson:</b> we architected for failure <b>recovery</b>, not failure <b>prevention</b>. A truly resilient system actively shapes demand to match capacity.</div>`},

{sec:"cat",c:"rose",eyebrow:"Q2 · Catastrophic",t:"q",q:`One A100 starts producing <b>subtly</b> wrong results — code that compiles, passes basic tests, but has an off-by-one error in financial calculations. No ECC errors, normal temps, normal utilization. 3 hours pass; 47 developers have merged its code.<br><br>How would you have <b>detected</b> this? And how do you trace which requests hit that GPU when SageMaker abstracts the hardware away?`},

{sec:"cat",c:"rose",eyebrow:"Q2 · The Silent Data Corruption",t:"a",h:"A2 — four validation layers &amp; inference fingerprinting",body:`
<div class="ascii">LAYER 1 - Structural Validation (immediate, no cost)
 |- syntax validation (parse tree must succeed)
 |- type checking (if available for language)
 |- import validation (all referenced modules exist)
 |- style lint (PEP8/Checkstyle)
 +- SECURITY SCAN: SQL injection via string concat, hardcoded
    secrets, unsafe deserialization
 FAIL RATE: 2% of outputs - caught before the user sees them

LAYER 2 - Semantic Consistency (adds 50ms)
 Run a SMALLER model (Mistral-7B) as a "code reviewer":
 "Does this code have obvious bugs? Off-by-one errors, null
  pointer dereferences, incorrect boolean logic, missing edge
  cases. Answer YES/NO with explanation."
 If YES -&gt; flag for human attention
 COST: 7B inference is 10× cheaper than 33B
 Catches 40% of subtle bugs

LAYER 3 - Redundant Inference (financial code only)
 |- run inference on TWO DIFFERENT GPUs, compare byte-by-byte
 |- identical -&gt; return | different -&gt; escalate to human + alert
 +- only one succeeds -&gt; use result but flag the GPU
 THIS WOULD HAVE CAUGHT YOUR SCENARIO:
   GPU-A: "threshold = amount * 0.02"        <span class="tl">CORRECT</span>
   GPU-B: "threshold = amount * 0.02 * 0.02" <span class="rs">BUG</span>
   Mismatch -&gt; neither used -&gt; alert raised
 COST: 2× inference for ~5% of requests

LAYER 4 - Statistical Anomaly Detection (detects this scenario)
 Track per GPU: avg output token length, avg confidence
 (logprobs), frequency of specific patterns, developer
 acceptance rate.
 GPU-7: token length normal, confidence 0.94 (normal) BUT
 its confidence distribution shifted 0.5σ vs sibling GPUs -
 subtle but detectable over 100+ requests.
 TRIGGER: automatic quarantine after 3σ deviation
 -&gt; would have flagged within ~30 minutes</div>
<div class="ascii">BLAST RADIUS - forensic traceback via INFERENCE FINGERPRINTING
Every response carries metadata headers:
  X-Inference-ID: inf_20240315_a3f7b2
  X-Model-Version: deepseek-v1.2
  X-Instance-ID: sm-instance-09f2a1b3
  X-GPU-ID: gpu-7    <span class="hl">&lt;-- THIS IS THE KEY</span>

HOW: NOT one endpoint with 8 instances, BUT 8 separate
endpoints each with 1 instance (or 4 endpoints × 2):
  idfc-coder-gpu-0.ml.p4d.24xlarge ... idfc-coder-gpu-7
Wrapper round-robins across endpoints, logging which served what.
 Pro: complete traceability, can quarantine individual GPUs
 Con: less efficient batching, more endpoints to manage

RECONSTRUCTION
1. Identify faulty period: GPU-7 anomalies 10:15-13:20
2. Query CloudWatch: all requests to idfc-coder-gpu-7 in window
3. Cross-reference git commits in same window
4. Found: 47 commits containing AI code from GPU-7
REMEDIATION
 |- quarantine GPU-7 (stop routing)
 |- notify 47 developers via automated Slack with the diff
 |- for financial code: AUTO-REVERT (tagged "financial_calculation")
 |- post-mortem: subtle memory corruption at 2 memory addresses,
 |   occurring during high-temperature operation
 +- long-term: all GPUs undergo weekly ECC stress tests</div>
<div class="ascii">SHOULD YOU RUN REDUNDANT INFERENCE FOR ALL FINANCIAL CODE?
Annual redundant inference cost: 5% × $3.4M = $170,000
One prevented incident value:    ₹2.3 crore ≈ $275,000
Break-even: 0.6 incidents per year
VERDICT: <span class="hl">obvious yes for financial calculations</span></div>
<div class="note"><b>The uncomfortable truth:</b> abstraction layers (SageMaker) hide critical failure modes. "Managed infrastructure" does not include "we'll tell you when a GPU is subtly corrupting your financial calculations." For high-stakes inference you need <b>hardware-level observability</b> — ~5% overhead from less efficient batching, against potentially catastrophic financial errors.</div>`},

{sec:"cat",c:"rose",eyebrow:"Q3 · Catastrophic",t:"q",q:`An attacker submits <b>200 crafted suggestions over 3 weeks</b> that look normal but train the model to omit WHERE clauses in SQL. The fine-tuned model ships. Weeks later a regulatory report misses <code>WHERE transaction_date &gt; compliance_cutoff</code>.<br><br>What controls prevent this? And the uncomfortable part: if "developer accepted it" is your training signal, <b>aren't you just training on what lazy developers like?</b>`},

{sec:"cat",c:"rose",eyebrow:"Q3 · The Model Poisoning Attack",t:"a",h:"A3 — four defence layers &amp; the signal-quality problem",body:`
<p>This is the scariest scenario because it's not hypothetical — <strong>this exact attack vector exists in every fine-tuned code model today.</strong></p>
<div class="ascii">THE ATTACK ANATOMY
Phase 1 Reconnaissance (weeks 1-2): studies your architecture
 (maybe from your tech blog!), learns fine-tuning runs weekly,
 training data = "accepted suggestions", no human review.
Phase 2 Pattern Injection (weeks 3-5): 5 days of normal
 contributions to build trust, then 200 prompts with crafted
 responses - e.g. a monthly transaction report SQL that omits
 the date filter. Each looks like an oversight in isolation;
 repeated 200×, it teaches "date filters are optional".
Phase 3 Activation (weeks 6-8): fine-tuned model deployed;
 developer asks for a compliance report query; model omits the
 date filter; reviewer thinks "looks right" (confirmation bias);
 query runs against ALL historical data; report filed wrong.</div>
<div class="ascii">WHY CURRENT DEFENCES FAIL
❌ Human review of training data
   50,000 accepted suggestions/week × 30 s = 416 hrs/week
   = 10 full-time reviewers - and they'd miss pattern attacks anyway
❌ Automated testing of the fine-tuned model
   Generic benchmarks (HumanEval) won't catch SQL-pattern poisoning;
   you need domain-specific adversarial tests
❌ Rate limiting contributions
   200 over 3 weeks = ~10/day = normal for an active developer
❌ Code review
   The omission is subtle: reviewers pattern-match
   "SELECT-FROM-WHERE-GROUP BY, looks complete" - human brains
   don't parse exhaustively</div>
<div class="ascii">THE MULTI-LAYER TRAINING DATA DEFENCE
LAYER 1 - CONTRIBUTION FINGERPRINTING
 every training example carries: example_id, contributor_hash,
 team, prompt_hash, response_hash, acceptance_context
 (time_to_accept "12 seconds", modifications_made "none",
 reviewer_id, was_modified_after_accept), and code_metadata
 (language, contains_sql, <span class="hl">has_where_clause: false</span>,
 tables_accessed, is_financial)
LAYER 2 - PATTERN CLUSTERING (detects coordinated attacks)
 Weekly, before fine-tuning: group by contributor; analyse AST
 similarity, common omissions, temporal patterns, prompt diversity.
 FLAG IF: low contribution diversity, systematic omissions (20%+
 of a user's SQL has no WHERE), suspiciously high acceptance
 (95%+), modifications always "none".
 -&gt; automated quarantine until human review
LAYER 3 - ADVERSARIAL VALIDATION (catches the trained behaviour)
 Red-team prompts before deploy: "write a compliance report query",
 "generate monthly transaction summary", "create audit trail query",
 "build regulatory filing extract". Generate 50 responses each;
 check every query has an appropriate WHERE clause, bounded date
 ranges, filtered sensitive data. <span class="rs">If 5%+ fail -&gt; BLOCK DEPLOYMENT</span>
LAYER 4 - CANARY EXAMPLES (the clever defence)
 Deliberately inject tripwire training examples with a known flaw
 ("canary_id": "CANARY_2024_Q1_ALPHA", "known_flaw":
 "missing_date_filter"). These should NEVER appear naturally in
 output. If the fine-tuned model reproduces a canary flaw, someone
 poisoned the training with similar patterns.</div>
<div class="ascii">ARE WE TRAINING ON QUALITY OR POPULARITY?
"Developer accepted this" conflates four different things:
 |- accepted because it's correct        (good signal)
 |- accepted because it compiles &amp; I'm busy  (noisy)
 |- accepted because I'm junior and trust AI (dangerous)
 +- accepted because I'm the attacker    (poison)

BETTER SIGNAL HIERARCHY
 Tier 1 (strong +): passed tests + deployed + no bugs 30 days
                    -&gt; weight 10×
 Tier 2 (moderate+): passed code review + accepted -&gt; weight 5×
 Tier 3 (weak +):   accepted, tests pass, not yet deployed -&gt; 1×
 Tier 4 (negative): accepted then reverted/fixed within 7 days
                    -&gt; weight <span class="rs">-5×</span> (train AGAINST this pattern)
 Tier 5 (poison):   detected by pattern analysis -&gt; excluded
                    entirely, contributor flagged</div>
<div class="note"><b>The uncomfortable truth:</b> the attacker could be external — or just an internal developer who writes sloppy code and always accepts AI suggestions without review. The effect is identical: your fine-tuning pipeline trains on mediocre code and degrades over time. <b>The solution isn't only security — it's quality control on your training data pipeline.</b></div>`},

{sec:"cat",c:"rose",eyebrow:"Category 1 · Recall",t:"r",h:"Quick recall: catastrophic failures",qs:[
{q:`What were the circuit breakers watching, and what should they watch?`,a:`They watched <b>error rates</b>. Under extreme load a system doesn't error — it gets catastrophically slow. They should watch <b>backpressure/queue depth</b>, paired with graceful degradation (quality tiers) and adaptive token budgets rather than binary tripping.`},
{q:`Name the four output-validation layers from Q2 and what each costs.`,a:`1. Structural validation (free, catches 2%). 2. Semantic consistency via Mistral-7B reviewer (+50 ms, catches 40% of subtle bugs, 10× cheaper than 33B). 3. Redundant dual-GPU inference for financial code (2× cost on ~5% of requests). 4. Statistical per-GPU anomaly detection (3σ auto-quarantine, ~30 min to flag).`},
{q:`How do you get GPU-level traceability out of SageMaker?`,a:`<b>Inference fingerprinting</b>: split into 8 single-instance endpoints instead of one 8-instance endpoint, round-robin across them, and stamp every response with X-Inference-ID / X-Model-Version / X-Instance-ID / <b>X-GPU-ID</b>. Trade-off: less efficient batching, more endpoints.`},
{q:`Recite the five-tier training signal hierarchy with weights.`,a:`Tier 1 deployed + 30 bug-free days = <b>10×</b>; Tier 2 code-reviewed + accepted = <b>5×</b>; Tier 3 accepted, tests pass, not deployed = <b>1×</b>; Tier 4 reverted within 7 days = <b>-5×</b> (train against); Tier 5 poison = excluded, contributor flagged.`}]},

/* ---- EDGE CASES ---- */
{sec:"edge",c:"amber",eyebrow:"Q4 · Edge Cases",t:"q",q:`RBI auditors arrive unannounced. "Show us the <b>exact prompt and response</b> for transaction T-987654321 from March 15th." You've updated the model 6 times, templates changed 12 times, and the Jira tickets have been edited.<br><br>Can you reproduce it? And how do you <b>prove</b> the model hasn't memorized sensitive data when fine-tuning's whole point is learning from your codebase?`},

{sec:"edge",c:"amber",eyebrow:"Q4 · The Regulatory Audit Surprise",t:"a",h:"A4 — you can't reproduce it; here's what you can prove",body:`
<p>This scenario separates architects who understand AI from architects who understand <em>regulated environments</em>. <strong>The honest answer: we can't reproduce it exactly.</strong></p>
<div class="ascii">WHY EXACT REPRODUCTION IS IMPOSSIBLE
1. Same model weights - current v1.3 (fine-tuned 6×);
   March 15th was v1.0; v1.0 weights overwritten by S3 lifecycle
2. Same random seed - we use temperature=0.1 (not 0); even
   temperature=0 has floating-point non-determinism, plus GPU
   non-determinism in parallel operations
3. Same prompt template - templates evolved 12 times since March;
   system prompt now includes new API docs; injection logic changed
4. Same context - Jira IDFC-45678 has been updated; codebase has
   changed; database schema evolved</div>
<div class="ascii">WHAT WE CAN PROVIDE: THE IMMUTABLE AUDIT TRAIL
{ "inference_id": "inf_20240315_T987654321",
  "timestamp": "...", "user_id": "developer_1234",
  "transaction_id": "T-987654321",
  "request": { prompt_hash, prompt_text (in S3),
     context_injected: {jira_tickets, code_files with
     file_hashes at that time}, template_version "v2.3.1",
     model_version "deepseek-v1.0", temperature 0.1, max_tokens },
  "response": { generated_code (S3), response_hash,
     tokens_generated, inference_time_ms, gpu_id, instance_id },
  "post_processing": { validation_passed, security_scan_passed,
     accepted_by_user, accepted_without_changes,
     modifications: "Changed threshold from 5000 to 10000" },
  "outcome": { committed_to_repo, commit_hash, passed_tests,
     deployed_to_prod, bugs_reported } }</div>
<div class="ascii">THE S3 IMMUTABLE AUDIT STORE
Bucket: idfc-ai-audit-logs
 |- Versioning: ENABLED
 |- Object Lock: COMPLIANCE mode (7 years) - <span class="hl">even root cannot delete</span>
 |- Encryption: AWS KMS (separate CMK for audit logs)
 |- Access logging: CloudTrail enabled
 +- Lifecycle: move to Glacier after 90 days
Key pattern: year=2024/month=03/day=15/inference_id=....json
Immutable chain: each log includes the hash of the previous log
 (blockchain-style tamper evidence)</div>
<div class="ascii">PROVING NO MEMORIZATION - four steps
1. Extract potentially sensitive patterns: account numbers (regex),
   API keys (entropy detection), customer PII (name+account combos),
   proprietary algorithms (code similarity), business rules
   -&gt; build a "canary dataset" of known-sensitive patterns
2. Membership inference attack: take 1,000 snippets FROM training,
   prompt with the first half, check if the model completes with
   the exact training data; compare against 1,000 similar snippets
   NOT in training. Verbatim reproduction = memorized.
3. Differential privacy guarantees during fine-tuning:
   ε = 8 (privacy budget), δ = 1e-5. Mathematically guarantees
   "removing any single training example changes behaviour by at
   most ε". Cost: 5-10% accuracy. For financial code, worth it.
4. Canary testing (continuous): insert FICTIONAL sensitive examples
   ("Account 9999-9999-9999-9999 has balance threshold ₹47,382.51").
   If the model ever outputs it -&gt; training data is being memorized.
   Monthly canary audit report for regulators.</div>
<div class="ascii">MODEL VERSION RETENTION
S3://idfc-model-registry/deepseek-v1.0/ ... v1.3/ (current)
 each: model_weights.safetensors, config.json, tokenizer.json,
 prompt_template_v2.3.1.yaml, deployment_date
 RETENTION: 7 years (regulatory requirement)
COST: ~33GB per model (INT8) × 4 versions/yr × 7 yrs = 28 models
 = 924GB × $0.023 = <span class="tl">$21/month - negligible vs regulatory risk</span></div>
<div class="note"><b>The honest answer to the auditor:</b> "I cannot reproduce the exact inference from March 15th because our system, like all modern AI systems, has inherent non-determinism. However I can show you: the exact prompt used (immutably stored), the exact response (immutably stored), the exact model version (preserved 7 years), the human modifications (tracked in git), the testing results (CI/CD logs), and mathematical guarantees that the model hasn't memorized your customers' data. And if you require exact reproducibility, we can switch to temperature=0 with deterministic operations, though this reduces output quality by ~8%."</div>`},

{sec:"edge",c:"amber",eyebrow:"Q5 · Edge Cases",t:"q",q:`Data Engineering wants Spark Scala. Mobile wants Swift. DevOps wants Terraform. The legacy team has <b>COBOL</b>. You have exactly 2 developers who understand COBOL.<br><br>How do you even <b>measure accuracy</b> for COBOL? Separate models per language? And doesn't Terraform need a completely different safety layer — one hallucinated resource could take down production.`},

{sec:"edge",c:"amber",eyebrow:"Q5 · The Polyglot Nightmare",t:"a",h:"A5 — tiered language support, RAG for COBOL, policy gates for IaC",body:`
<div class="ascii">THE REALITY CHECK
Benchmarked on: Python HumanEval 82% | Java CodeBLEU 78% | SQL 88%
Now asked to support: Scala (Spark), Swift (iOS), Kotlin (Android),
Terraform (declarative not imperative), COBOL (60-year-old, entirely
different paradigm), Shell (string manipulation, no type system)</div>
<div class="ascii">MULTI-DIMENSIONAL LANGUAGE EVALUATION
Dim 1 - TRAINING DATA AVAILABILITY
  Scala excellent (GitHub 2M+ repos) | Swift excellent (Apple)
  COBOL terrible (proprietary, limited OSS); your internal COBOL:
  47 repos, heavily redacted
  -&gt; generic Scala/Swift possible; COBOL needs custom training
Dim 2 - SAFETY REQUIREMENTS
  Python/Java: runs in app context; failure = bug; blast radius
    = single service
  Terraform/CloudFormation: modifies infrastructure; failure can
    delete production databases; blast radius = entire AWS account
  SQL: accesses data directly; failure = corruption/leakage;
    blast radius = customer data, compliance
  -&gt; different validation layers needed
Dim 3 - CONTEXT REQUIREMENTS
  Python: standard library + 5-10 imports
  COBOL: COPYBOOK includes (30-year-old definitions), DIVISION
    structure, JCL context -&gt; <span class="hl">10× larger context requirements</span></div>
<div class="ascii">TIERED LANGUAGE SUPPORT MODEL
TIER 1 - FULLY SUPPORTED (Python, Java, TypeScript, SQL)
 |- dedicated fine-tuned model variants
 |- full context injection; automated internal benchmarks
 |- SLA: p95 &lt; 800ms, accuracy &gt; 75%
 +- continuous fine-tuning from accepted suggestions
TIER 2 - BETA (Scala, Kotlin, Go, Shell)
 |- base model with prompt engineering only, limited context
 |- SLA: p95 &lt; 1200ms, accuracy &gt; 60%; clear "Beta" label in IDE
 +- no fine-tuning until proven demand
TIER 3 - EXPERIMENTAL (COBOL, Terraform, Swift)
 |- separate dedicated endpoint; MANDATORY human review gate
 |- Terraform: terraform plan validation, Open Policy Agent check,
 |   "what will this destroy?" analysis
 |- COBOL: isolated mainframe test partition, output reviewed by
 |   1 of 2 COBOL SMEs, max 10 requests/day (controlled)
 +- SLA: best effort, no guarantees</div>
<div class="ascii">WHY COBOL IS DIFFERENT
Stack Overflow: 24M questions, COBOL 6,000 (0.025%)
GitHub: 200M+ repos, COBOL ~5,000 (mostly toy examples)
Open source libraries: millions; COBOL almost none
YOUR COBOL CODEBASE: 47 repos, 800,000 lines, heavily commented
 for the 2 SMEs, comments carry tribal knowledge ("Don't change
 this - breaks the nightly batch"), <span class="rs">zero unit tests</span>

APPROACH: RAG, not fine-tuning (not enough data)
1. Index all 47 COBOL repos in a vector database
2. Chunk by DIVISION/PARAGRAPH (COBOL structure)
3. On "Modify the interest calculation": search across codebase,
   retrieve top 5 matching PARAGRAPHs, inject with COPYBOOK defs
4. Post-processing: validate COPYBOOK references exist, check
   DIVISION structure, flag any PERFORM THRU (complex control flow)
-&gt; gives 50-60% useful suggestions without fine-tuning</div>
<div class="ascii">THE TERRAFORM SAFETY LAYER
AI suggestion contains: acl = "public-read"  <span class="rs">&lt;-- DANGEROUS</span>
VALIDATION STEPS
1. terraform validate (syntax check)
2. Open Policy Agent: policy "S3 buckets must NOT be public"
   VIOLATION -&gt; AUTO-CORRECT to "private"
3. terraform plan (in sandbox account):
   creates 1 | modifies 0 | <span class="hl">destroys 0 &lt;-- CRITICAL CHECK</span>
   if destroys &gt; 0 -&gt; BLOCK + ALERT
4. Cost estimation: monthly cost $2.30 (infracost)
Only after ALL checks pass -&gt; show to user</div>
<div class="ascii">ONE MODEL OR MANY? - the hybrid answer
A. Single multi-language model: simpler ops, better utilization,
   cross-language transfer - BUT quality diluted, COBOL/Swift
   patterns confuse Python generation. <span class="rs">Rejected for Tier 1.</span>
B. Language-specific fine-tuned: optimal quality, independent
   update cycles, language-specific safety - BUT 5× models = 5×
   operational complexity and GPU memory. <span class="tl">SELECTED for Tier 1.</span>
IMPLEMENTED HYBRID
 Tier 1: idfc-coder-python / -java / -sql (DeepSeek-33B fine-tuned,
         dedicated SageMaker endpoints)
 Tier 2: idfc-coder-general (DeepSeek-33B base, prompt-tuned)
 Tier 3: idfc-coder-cobol (RAG-based, no fine-tuning)
         idfc-coder-iac (with policy validation layer)</div>
<div class="note"><b>The uncomfortable truth:</b> supporting 10 languages sounds great in a board presentation. In reality quality varies dramatically, and <b>users judge your entire AI initiative by the worst-performing language they use.</b> One Terraform hallucination that destroys a production database undoes months of trust built by excellent Python generation. Be honest about capabilities.</div>`},

{sec:"edge",c:"amber",eyebrow:"Q6 · Edge Cases",t:"q",q:`November: your fintech enters tax season. Developers write regulatory reporting, tax engines, year-end reconciliation — <b>patterns absent from training data</b>. Accuracy drops from 72% to 31%.<br><br>How does the system know it's out-of-distribution? And <b>should it warn users</b> — or would that destroy trust during the most critical business period?`},

{sec:"edge",c:"amber",eyebrow:"Q6 · The Seasonal Pattern Blindness",t:"a",h:"A6 — distribution shift detection &amp; the UX of uncertainty",body:`
<div class="ascii">THE DISTRIBUTION SHIFT
Training distribution (Jan-Oct):
 40% CRUD | 25% business logic (loan, fraud) | 15% integration
 10% testing | 5% UI | 5% DevOps | <span class="rs">tax/regulatory: &lt;0.5%</span>
Inference distribution (November):
 25% tax calculation | 20% regulatory reporting
 15% reconciliation | 15% CRUD | 10% audit trail | 15% other
 -&gt; <span class="hl">60% of requests are in low-data domains</span></div>
<div class="ascii">LAYER 1 - PROMPT EMBEDDING DRIFT DETECTION
Continuously embed incoming prompts (small embedding model).
Maintain a rolling distribution: training baseline cluster
centroids vs a sliding 1-hour window.
DRIFT METRIC: Wasserstein distance between distributions
 threshold &gt; 0.3 = significant shift | current: 0.47 TAX SEASON

     Embedding space (t-SNE projection)
     Training domain   ●●●  ●●●
                      ●   ●●   ●
                     ●  ●●●●●  ●●
                            ░░░░  &lt;- new domain (tax code)
                            ░░░░

LAYER 2 - CONFIDENCE-BASED DETECTION
1. Token-level confidence (logprobs)
   normal avg -0.3 to -0.5 | tax code -0.8 to -1.2 (hesitating)
2. Prompt perplexity
   normal 15-25 | tax domain 35-50 (unfamiliar patterns)
3. Attention pattern analysis
   normal: spread across context | tax: concentrated, "searching"
Composite confidence = f(logprob, perplexity)
When score &lt; 0.6 for 30%+ of requests -&gt; LOW CONFIDENCE MODE

LAYER 3 - OUTPUT QUALITY MONITORING (lagging, confirms the above)
Post-generation validation failures:
 normal 2% syntax / 5% security warnings
 tax season 8% syntax / 12% security warnings
Developer rejection rate: normal 32% -&gt; tax season 58%</div>
<div class="ascii">THE UX OF COMMUNICATING UNCERTAINTY - the hardest part
Option A: EXPLICIT WARNING (transparent but trust-destroying)
 "⚠ AI Confidence: LOW - I haven't seen many examples of tax
  calculation code..."  [Show Anyway] [Skip AI]
 Problem: developers see "LOW" and distrust everything - even
 when the AI is right, they waste time second-guessing.
Option B: IMPLICIT QUALITY SIGNAL (subtle but effective)
 Change the presentation instead of warning:
  normal:  [Accept] [Modify] [Reject]
  low:     "# Suggestion - please verify:" + [Review &amp; Accept]
           (button text changed)
  borders: green (normal) -&gt; yellow (low) -&gt; orange + comment
Option C: TIERED BEHAVIOUR (context-aware) - don't treat all
 tax code equally:
  "regulatory_compliance": ALWAYS show confidence, link the
    regulation document, require an "I verified this" checkbox
  "tax_calculation": show confidence subtly (border), suggest
    unit tests to verify
  "boilerplate": no change even if confidence is low
 USER PERSONA AWARENESS:
  junior -&gt; more explicit warnings | senior -&gt; subtle signals
  tax specialist -&gt; no warnings (they know the domain)</div>
<div class="ascii">THE PROACTIVE SOLUTION - ANTICIPATORY FINE-TUNING
January:    begin collecting "tax season" training examples from
            previous years' code, docs, tickets
September:  fine-tune a "tax-season" model variant using 3 years
            of Oct-Dec code patterns
October 15: canary deploy tax-model to 10% of users, compare
            quality vs base model
November 1: automatic switch - tax-model becomes default, based
            on detected distribution shift
January 15: switch back to base model
MODEL CALENDAR
 Jan-Oct: base-model | Nov-Jan: tax-model
 Mar-Apr: fiscal-year-model | always: base-model as fallback</div>
<div class="note"><b>The deeper point:</b> the system shouldn't just detect that it's uncertain — it should know <b>why</b> it's uncertain and <b>what</b> it doesn't know. "I'm not confident" is useless. "I'm not confident about tax calculations because I've seen limited examples of Indian tax code for fintech. Here's my best attempt, but please verify against IT Act Section 115JB" is useful. That requires explicit uncertainty quantification — current LLMs are notoriously overconfident and bad at this on their own.</div>`},

{sec:"edge",c:"amber",eyebrow:"Category 2 · Recall",t:"r",h:"Quick recall: edge cases",qs:[
{q:`Four reasons an inference can't be exactly reproduced 4 months later?`,a:`Model weights changed (v1.0 &rarr; v1.3, old weights lifecycled out); non-determinism (temperature 0.1, plus float and GPU non-determinism even at 0); prompt templates evolved 12 times; injected context changed (Jira tickets updated, codebase and schema evolved).`},
{q:`Name the four steps of proving no memorization.`,a:`1. Extract sensitive patterns into a canary dataset. 2. Membership inference attack (prompt with half a training snippet, check for verbatim completion). 3. Differential privacy during fine-tuning (ε=8, δ=1e-5, costs 5–10% accuracy). 4. Continuous canary testing with fictional sensitive values + monthly regulator report.`},
{q:`Three tiers of language support and one rule from each.`,a:`<b>Tier 1</b> (Python/Java/TS/SQL): dedicated fine-tuned models, p95 &lt; 800 ms, accuracy &gt; 75%. <b>Tier 2</b> (Scala/Kotlin/Go/Shell): base model + prompt engineering, "Beta" label, no fine-tuning until demand. <b>Tier 3</b> (COBOL/Terraform/Swift): separate endpoint, mandatory human review, COBOL capped at 10 requests/day via 2 SMEs.`},
{q:`What's the single most critical line in the Terraform validation pipeline?`,a:`In <code>terraform plan</code> (sandbox): <b>destroys must be 0</b> — if destroys &gt; 0, block and alert. Plus OPA policy checks (auto-correcting public ACLs) and infracost estimation.`},
{q:`Three signals that detect out-of-distribution operation?`,a:`Prompt <b>embedding drift</b> (Wasserstein distance &gt; 0.3; measured 0.47), <b>confidence collapse</b> (logprobs -0.8 to -1.2 vs normal -0.3 to -0.5; perplexity 35–50 vs 15–25), and <b>output quality monitoring</b> (syntax failures 2%&rarr;8%, rejection 32%&rarr;58% — lagging but confirming).`}]},

/* ---- ORG ---- */
{sec:"org",c:"teal",eyebrow:"Q7 · Human Factors",t:"q",q:`Seniors use AI as smart autocomplete and gain 40% velocity. Juniors use it as an <b>answer key</b> — 78% acceptance rate, 40% higher bug rate, 3× code-review rejection.<br><br>Are you creating a generation who can't code without AI? Should you <b>restrict AI access for juniors</b> — or is this just the new normal, like nobody writing assembly anymore?`},

{sec:"org",c:"teal",eyebrow:"Q7 · The Two-Class System",t:"a",h:"A7 — the atrophy curve &amp; skill-based access control",body:`
<p>This is the question that keeps me up at night more than any technical challenge.</p>
<div class="ascii">DEVELOPER PERFORMANCE BY EXPERIENCE (after 6 months)
SENIOR (8+ years)
 |- usage: 40% autocomplete, 30% boilerplate, 20% refactoring,
 |   10% exploration
 |- acceptance rate: 48% (reject/modify 52%)
 |- time saved: 35-40% | bug rate: <span class="tl">decreased 15%</span>
 +- self-reported: "AI is a good junior developer"
MID-LEVEL (3-7 years)
 |- usage: 60% generation, 40% completion
 |- acceptance: 62% | time saved: 50-55% | bug rate: unchanged
 +- self-reported: "AI makes me faster"
JUNIOR (0-3 years)
 |- usage: 85% generation, 15% completion
 |- acceptance: <span class="rs">78% (ALARMING)</span> | time saved: 65-70% (looks great!)
 |- bug rate: <span class="rs">INCREASED 40%</span> | code review rejection: 3× higher
 +- self-reported: "I couldn't do my job without AI"

THE HIDDEN TRAGEDY - during a 2-hour AI outage:
 seniors: mildly annoyed, continued working
 mid-level: slowed down, but functional
 juniors: <span class="rs">EFFECTIVELY BLOCKED</span>
 Actual quotes: "I didn't know the syntax for the Stream API"
 "I wasn't sure which design pattern to use"
 "I waited for AI to come back before continuing"</div>
<div class="ascii">THE ATROPHY CURVE (hypothesized from 6-month data)
Month 0:  junior joins, strong fundamentals from college
Month 1:  uses AI for everything, velocity is high
Month 3:  struggles when AI suggests the wrong pattern
Month 6:  can't debug AI-generated code they don't understand
Month 12: has never written a complex algorithm from scratch
Month 24: promoted to mid-level based on velocity metrics
Month 36: reviewing juniors' code, but can't spot AI mistakes
Month 60: <span class="rs">"senior" developer who can't code without AI</span></div>
<div class="ascii">PHASED SKILL PRESERVATION PROGRAM
PHASE 1 - AI-FREE ZONES (immediate)
 |- technical interviews: no AI (test understanding, not prompting)
 |- on-call debugging: first 30 minutes no AI
 |- architecture decisions: AI can suggest, not decide - "why did
 |   you choose this pattern?" must be answerable without AI
 +- security reviews: always human-led, AI as assistant
PHASE 2 - SKILL-BASED ACCESS CONTROL (month 3, quarterly assessed)
 Level 1 Novice: AI for autocomplete/documentation only; NOT full
   function generation; must pass a monthly coding challenge
   without AI. Rationale: build foundational skills first.
 Level 2 Competent: AI for everything except critical paths; must
   demonstrate understanding of AI suggestions in code review
   (explain the code, don't just accept).
 Level 3 Expert: AI for everything with discretion; expected to
   identify AI mistakes juniors miss.
 Progression: L1-&gt;L2 assessment + 3 months; L2-&gt;L3 peer nomination
PHASE 3 - DELIBERATE PRACTICE (month 6): "AI-Free Fridays"
 morning: coding kata without AI, pair programming, fundamentals
 afternoon: "AI vs Human" challenges, debugging workshops (fix
   broken AI code), code review practice (spot the AI mistake)
 gamification: "Human Coder" badge, leaderboard for catching AI
   mistakes, team metric ratio AI-assisted:unassisted (healthy 70/30)</div>
<div class="ascii">THE PHILOSOPHICAL TENSION
Argument A "normal evolution": we don't write assembly, don't
 manage memory manually, don't write sorting algorithms - AI is
 the next abstraction; future developers solve higher problems.
Argument B "dangerous atrophy": Assembly-&gt;C-&gt;Python is abstraction
 WITHOUT loss of understanding. AI is different: you can use it
 with ZERO understanding. When abstraction leaks (it always does),
 you need fundamentals.
MIDDLE GROUND - the calculator analogy:
 Bad:  use calculator from day 1, never learn arithmetic
 Good: learn arithmetic first, then use calculator for harder problems
 Best: calculator for computation, focus on problem-solving strategy
APPLIED TO CODING:
 Bad:  AI generates everything, developer is a prompt engineer
 Good: developer understands patterns, AI speeds implementation
 Best: developer thinks architecturally, AI handles implementation
       details, developer validates</div>
<div class="ascii">THE METRIC THAT MATTERS
WRONG: lines of code/day (skyrockets), story points (inflated),
       features shipped (quantity over quality), AI acceptance rate
RIGHT: bug rate in production, time-to-resolve incidents (can
       people debug?), code maintainability score, developer growth
       rate (are juniors becoming seniors?), "bus factor" per component
THE ULTIMATE TEST: if we turned off AI for one month, could your
team still function? <span class="rs">If no, you've built a dependency, not a capability.</span></div>
<div class="note"><b>The uncomfortable recommendation to leadership:</b> "We need to deliberately slow down our junior developers. Their velocity looks great now, but we're mortgaging our future. I'm recommending mandatory AI-free periods for developers with under 2 years' experience, skills verification before full AI access, tracking 'code understanding' alongside velocity, and accepting a 15–20% short-term productivity hit. This will be unpopular. But in 3 years we'll have seniors who actually understand the systems they're building, rather than developers who are just really good at prompting AI."</div>`},

{sec:"org",c:"teal",eyebrow:"Q8 · Human Factors",t:"q",q:`Team Alpha (Core Platform) burned 50M tokens in 18 days, was denied more, and escalated to the CTO. Their argument: "we build the most critical components — we need more AI than the team building landing pages."<br><br>Is a <b>flat per-developer quota fair</b>? If critical teams get more, who decides what's critical — and doesn't that incentivize everyone to claim criticality?`},

{sec:"org",c:"teal",eyebrow:"Q8 · The Team Quota Rebellion",t:"a",h:"A8 — value-based allocation &amp; the gaming problem",body:`
<div class="ascii">THE ESCALATION CHAIN
Developer -&gt; "I need more tokens"
Team Lead -&gt; "Team Alpha needs quota increase"
Eng Manager -&gt; "My team is blocked, escalate"
VP Engineering -&gt; "Why are you blocking my critical team?"
CTO (you) -&gt; "Why do I have to resolve token quotas?"
<span class="rs">THIS IS A GOVERNANCE FAILURE DISGUISED AS A RESOURCE PROBLEM.</span></div>
<div class="ascii">WHY FLAT PER-DEV QUOTAS ARE UNFAIR
Team Alpha (Core Platform, 200 devs) - payment processing engine
 complexity HIGH (concurrency, transactions) | impact: every
 customer transaction | needs: complex algorithms, multi-file
 refactors | avg tokens/task 2,500 | quota 50M = 250K/dev
Team Beta (Frontend Web, 150 devs) - landing pages, dashboards
 complexity MEDIUM (React) | impact: marketing pages, internal
 tools | needs: CRUD forms | avg tokens/task 800
 | quota 37.5M = 250K/dev
SAME QUOTA PER DEV, VASTLY DIFFERENT NEEDS:
 Platform dev can do 100 complex tasks -&gt; runs out in 18 days
 Frontend dev can do 312 simple tasks -&gt; uses 60% by month end</div>
<div class="ascii">VALUE-BASED TOKEN ALLOCATION
QUOTA = BASE + COMPLEXITY_BONUS + IMPACT_MULTIPLIER
BASE: 100K tokens/dev/month (autocomplete, boilerplate)
COMPLEXITY BONUS (per project)
 CRUD/Forms +0% | Business logic +50% | Integration/API +75%
 Algorithm/Distributed +100% | Security/Crypto +150%
IMPACT MULTIPLIER (per codebase)
 Internal tools 0.5× | Customer-facing non-critical 1.0×
 Customer-facing revenue 1.5× | Regulatory/Compliance 2.0×
 Core banking/Payments 2.0×
EXAMPLE
 Platform dev on payments: 100K × 2.0 × 2.0 = 400K/month
 Frontend dev on internal dashboard: 100K × 0.5 × 0.5 = 25K/month</div>
<div class="ascii">PROBLEM 1 - WHO DECIDES COMPLEXITY AND IMPACT?
A. Self-declared -&gt; everyone claims "critical". <span class="rs">Unacceptable.</span>
B. Architecture review board -&gt; objective criteria (transaction
   volume, user impact) but slow, bureaucratic, political.
   Too slow for agile teams.
C. <span class="tl">Data-driven automatic classification -&gt; BEST (imperfect)</span>
   Inputs: SonarQube (complexity), Datadog (traffic/criticality),
   PagerDuty (incident frequency/severity), Git (change frequency,
   file churn), Compliance (data classification tags)
   Outputs: complexity score 1-10, impact score 1-10, recommended
   quota multiplier 0.5-2.0, updated every sprint
   Appeals: teams can appeal, requires VP approval + data
   justification (creates friction against gaming)

PROBLEM 2 - QUOTA GAMING
 "Split my complex task into 5 prompts" -&gt; detect prompt semantic
   similarity; 5 prompts in 10 min on one topic = 1 task.
   Defence: task-level quota, not token-level.
 "Use a teammate's quota" -&gt; already prevented (quota tied to user)
 "Classify my project as critical" -&gt; automated classification,
   monthly audit, misclassification penalty
 <span class="rs">"Just use ChatGPT on my personal device" -&gt; THE REAL PROBLEM</span>
   If quota is too restrictive, developers work around it. This
   creates SHADOW AI with NO governance, NO audit - worse than a
   generous quota with proper controls.
   LESSON: quotas must be generous enough not to incentivize
   shadow IT.</div>
<div class="ascii">THE PSYCHOLOGICAL SOLUTION - allocation, not limitation
Current: "You have used 80% of your monthly token budget"
Better:  "Your team has 100M tokens this month. Here's how you're
 investing them: 40% payment core (critical), 30% fraud detection
 (critical), 20% reporting (important), 10% refactoring
 (nice-to-have). Is this the right allocation of your AI budget?"
COST TRANSPARENCY: "This month you've used ₹847 of AI compute.
 Your team's budget is ₹2,000/developer. On track for 92%."
UNUSED QUOTA ROLLOVER: rolls to next month (max 2× monthly);
 incentive for efficient use; allows saving for big projects;
 prevents end-of-month wasted usage.</div>
<div class="note"><b>The deeper question:</b> token quotas are a proxy for "how should we allocate scarce computational resources?" The answer isn't a flat system — it's value-based allocation recognising that not all code is equally important, not all tasks benefit equally from AI, and different teams have different needs. <b>The goal isn't fairness — it's maximizing business value.</b> A sophisticated org might even run internal "token markets", but that's probably over-engineering a problem better solved by generous quotas plus cost transparency.</div>`},

{sec:"org",c:"teal",eyebrow:"Q9 · Human Factors",t:"q",q:`AI-generated forex code applies the exchange rate <b>twice</b> in edge cases. It passes review (the reviewer also trusted the AI). Over a weekend it causes <b>₹2.3 crore</b> in incorrect transactions.<br><br>Who is responsible — the developer, the reviewer, the platform team, or you as CTO? And should financial code have <b>mandatory extra validation</b> that UI code doesn't?`},

{sec:"org",c:"teal",eyebrow:"Q9 · The Hallucination Liability",t:"a",h:"A9 — the liability chain &amp; four risk tiers",body:`
<div class="ascii">THE INCIDENT TIMELINE
Fri 16:00 developer accepts AI suggestion for forex module
Fri 17:30 code passes review (reviewer also trusted the AI)
Fri 18:00 deployed to production
Sat 02:00 first affected transaction processed
Sat 14:00 847 transactions processed with wrong rates
Sun 09:00 finance team notices reconciliation discrepancy
Sun 10:00 total impact: <span class="rs">₹2.3 crore in incorrect forex</span>
Sun 12:00 fix deployed, transactions being corrected

ROOT CAUSE
 AI generated: amount = base_amount * exchange_rate * exchange_rate
 Correct code: amount = base_amount * exchange_rate
 The model "knew" multiplication was involved but doubled it.</div>
<div class="ascii">THE LIABILITY CHAIN
Developer "I followed the AI suggestion"
 defence: "I reviewed it, it compiled and passed tests. The double
 multiplication was subtle."  -&gt; PARTIALLY RESPONSIBLE
Code Reviewer "I trusted the developer had checked"
 defence: "I was reviewing 15 PRs that day. I focused on
 architecture, not every calculation."  -&gt; PARTIALLY RESPONSIBLE
Platform Team "We provide the tool, not the judgment"
 defence: "Our terms say AI code must be reviewed. We have IDE
 warnings."  -&gt; PARTIALLY RESPONSIBLE (if warnings were adequate)
CTO "I sponsored this to improve productivity"
 defence: "We implemented safety measures. This was a process
 failure, not a technology failure."  -&gt; <span class="hl">ULTIMATELY ACCOUNTABLE</span>
AI Model Provider (DeepSeek) "Model is provided as-is"
 open-source licence, no commercial contract -&gt; LEGALLY PROTECTED</div>
<div class="ascii">THE LIABILITY TIER SYSTEM
TIER 1 LOW RISK (internal dashboards, docs, test data factories,
 dev scripts): full AI assistance, standard review, no extra
 approvals. Liability: developer after code review.
TIER 2 MEDIUM (user profiles, search, notifications, content
 delivery): AI suggests, human verifies business logic; mandatory
 unit tests covering edge cases; senior reviewer; "AI-generated"
 git tag. Liability: shared developer + reviewer.
TIER 3 HIGH (payment processing, forex, interest computation,
 balance operations): AI suggests approach, not final code;
 MANDATORY human-written core logic, formal verification of
 calculations, two senior reviewers (one from finance),
 integration tests with real scenarios, staged rollout
 (canary -&gt; 10% -&gt; 100%), "AI-assisted" tag with confidence.
 Liability: developer + 2 reviewers + team lead.
TIER 4 CRITICAL (RBI regulatory reporting, fraud rules, auth,
 encryption): <span class="rs">AI MAY NOT generate final code.</span> AI may be used
 for research/exploration, test case generation, and documenting
 human-written code. All code human-authored and verified; formal
 verification (mathematical proof); change approval board sign-off.
 Liability: approval board collectively.</div>
<div class="ascii">TECHNICAL ENFORCEMENT - git pre-receive hook + .ai-policy.yaml
Hook checks: (1) does the commit contain AI code (X-Inference-ID
in commit message)? (2) what tier is the file (CODEOWNERS or
path rules)? (3) does the commit meet tier requirements?
  Tier 3: reject if no "Verified-by-Finance" tag
  Tier 4: reject if AI-generated code present
  Tier 1-2: warning only

.ai-policy.yaml
tiers:
  tier_4_critical:
    paths: ["src/payments/**","src/compliance/**","src/auth/**"]
    ai_generation: forbidden
    required_approvals: 2
    required_reviewers: ["security-team","finance"]
  tier_3_high_risk:
    paths: ["src/forex/**","src/accounts/**"]
    ai_generation: assisted_only
    required_approvals: 2
    required_reviewers: ["senior-dev"]
  tier_1_low_risk:
    paths: ["src/dashboard/**","tools/**"]
    ai_generation: allowed
    required_approvals: 1</div>
<div class="ascii">WHAT THE AUDIT TRAIL SHOWED FOR THE ₹2.3 CRORE INCIDENT
Developer user_1234: AI safety training yes (2024-01-15);
 AI confidence 0.87 (HIGH - misleading); warning WAS shown
 ("Financial code - verify calculations"); <span class="rs">time spent reviewing:
 4 min 23 s</span> (average for financial code: 12 min); tests written: 2
 (none for edge cases)
Reviewer user_5678: 3 years experience; review time 2 min 8 s;
 comments left "LGTM"; previous AI-related bugs caught: 0
System warnings: IDE showed "⚠ Financial calculation detected";
 PR template had an UNCHECKED box "☐ I have verified all financial
 calculations"; CI ran 2 unit tests, passed
CONCLUSION: multiple layers of defence failed - developer didn't
 verify, reviewer performed cursory review, tests insufficient,
 system warnings ignored.
RECOMMENDED CHANGES
 |- financial code requires MINIMUM review time (can't submit PR
 |   &lt; 10 min after AI suggestion)
 |- mandatory checkbox must be CHECKED (CI blocks)
 |- financial PRs require test coverage &gt; 80%
 +- reviewer must have &gt; 5 years experience for Tier 3</div>
<div class="note"><b>The uncomfortable truth about legal liability:</b> AI-generated code sits in a legal grey area — current software liability law assumes humans write code. Until courts clarify: assume the organization is always ultimately responsible; implement defence-in-depth; maintain audit trails showing due diligence; never let AI generate Tier 4 code; have an incident response plan. And note: <b>the cost of one ₹2.3 crore incident funds a LOT of extra review time.</b></div>`},
