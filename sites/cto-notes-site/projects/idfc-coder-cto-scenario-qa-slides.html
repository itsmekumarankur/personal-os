{sec:"tech",c:"violet",eyebrow:"Q10 · Deep-Dive",t:"q",q:`Developers now want the entire microservice + API contracts + DB schema + last 5 Jira tickets injected. Each request carries <b>12,000 tokens of context</b> before they even type. Your 16K window is 75% consumed and quality is degrading.<br><br>Is more context actually better? <b>At what point does the signal-to-noise ratio invert?</b>`},

{sec:"tech",c:"violet",eyebrow:"Q10 · The Context Window Arms Race",t:"a",h:"A10 — budget allocation, re-ranking &amp; the U-shaped attention curve",body:`
<div class="ascii">THE CONTEXT PARADOX
Developer wants: "all relevant context"
Model needs:     "only the MOST relevant context"
MORE context ≠ BETTER results

Research finding (Lost in the Middle, Liu et al. 2023):
model attention is <span class="hl">U-shaped</span>:
 |- beginning of context: HIGH attention ✅
 |- middle of context:    LOW attention  ❌
 +- end of context:       HIGH attention ✅
With 12K tokens of context: first 1K attended, middle 10K mostly
ignored, last 1K + user prompt attended.
YOUR 75% CONSUMPTION MEANS: you're drowning the model in context
it can't use AND pushing the user's actual request to the end.</div>
<div class="ascii">CONTEXT BUDGET ALLOCATION (total 16K tokens)
 |- System prompt:            500 tokens (3%)  fixed instructions
 |- High-priority context:  4,000 tokens (25%) directly relevant
 |                                             files, current ticket
 |- Medium-priority:        4,000 tokens (25%) related files,
 |                                             API contracts
 |- Low-priority:           2,000 tokens (12%) similar past
 |                                             implementations
 +- User prompt + response: 5,500 tokens (35%) the actual request</div>
<div class="ascii">MULTI-STAGE RETRIEVAL PIPELINE
Stage 1 - Embedding-based semantic search
 Entire codebase embedded with CodeBERT (updated daily,
 incremental for changed files). "Add fraud detection to
 PaymentService" -&gt; embed -&gt; vector DB -&gt; top 50:
  PaymentService.java (cosine 0.94), FraudDetection.java (0.89),
  TransactionValidator.java (0.82), + 47 more
Stage 2 - Relevance re-ranking (cross-encoder)
 Take top 50, run through a SMALL model (Mistral-7B) trained for
 relevance scoring: "On a scale of 1-10, how relevant is this code
 to: 'Add fraud detection to PaymentService'?"
  PaymentService.java 9.2 CRITICAL | FraudDetection.java 8.7 HIGH
  TransactionValidator.java 7.1 MEDIUM | LoggerUtils.java 2.1 DISCARD
Stage 3 - Context budget allocation (fill highest-ranked first)
 HIGH (4K): PaymentService full (1,200), FraudDetection full (800),
   current Jira ticket (500), relevant API contract (1,500)
 MEDIUM (4K): TransactionValidator summarized (400), similar past
   PRs top 3 (1,200), database schema relevant tables (2,400)
 LOW (2K): coding standards (500), test examples (1,000),
   library documentation (500)
 DISCARDED: files with relevance &lt; 5.0
Stage 4 - Context summarization (files &gt; 500 tokens)
 Summary keeps class/function signatures, key dependencies,
 important comments, and "the rest is standard CRUD implementation"
 -&gt; preserves the MAP of the codebase without drowning in details</div>
<div class="ascii">THE DEDICATED SUMMARIZER MODEL
Mistral-7B fine-tuned on 100K (full file -&gt; concise summary) pairs.
Includes signatures, dependencies, key logic; excludes
implementation details and boilerplate.
Example output for PaymentService.java:
  Imports: com.idfc.banking.Transaction, com.idfc.fraud.FraudDetector
  Public methods:
    processPayment(Transaction): Result - validates, detects fraud,
      processes, returns result
    validateAmount(BigDecimal): boolean - checks amount &gt; 0 and
      &lt; MAX_TRANSACTION
    applyExchangeRate(BigDecimal, Currency): BigDecimal - uses
      ExchangeRateService
  Dependencies: FraudDetector, ExchangeRateService, TransactionRepository
  Key constants: MAX_TRANSACTION = 10,000,000
  [Full implementation details omitted]
COST: 7B inference is 10× cheaper than 33B
BENEFIT: 10 files summarized = cost of 1 file unsummarized</div>
<div class="ascii">ADAPTIVE CONTEXT BY TASK TYPE
"Add logging to PaymentService.processPayment()"
 specific method named -&gt; need only that method's code
 HIGH: the method + signature (200 tokens)
 MEDIUM: class imports and dependencies (100 tokens)
 TOTAL: <span class="tl">300 tokens (2% of budget!)</span>
"Refactor PaymentService to use new Fraud API"
 broad refactoring -&gt; need full service, Fraud API, dependencies
 HIGH: full PaymentService (1,200) + full Fraud API (800)
 MEDIUM: related services (2,000) | LOW: similar PRs (1,500)
 TOTAL: 5,500 tokens (34% of budget)</div>
<div class="note"><b>The contrarian view:</b> maybe the answer isn't better pruning but a different approach — <b>retrieve &rarr; PLAN &rarr; generate</b>. Stage 1: the model writes a plan ("I will modify processPayment() to add a fraud check. I need to: 1. import FraudDetector, 2. add validation before processing, 3. handle fraud exceptions"). Stage 2: with the plan and relevant context, generate one step at a time. That's how humans code — we don't hold the entire codebase in our head; we plan, then execute step by step.<br><br><b>The uncomfortable truth:</b> the context arms race is a losing battle. The best context system isn't the one that includes the most information — it's the one that includes <b>exactly the right information and nothing more</b>.</div>`},

{sec:"tech",c:"violet",eyebrow:"Q11 · Deep-Dive",t:"q",q:`A cached response from 2 hours ago is returned instantly. In those 2 hours, security updated the auth library v2.3 &rarr; v2.4. The cached code uses the <b>deprecated, vulnerable API</b> (CVE-2024-1234) — and the developer trusts it.<br><br>How do you invalidate caches when <b>external dependencies</b> change, without destroying your hit rate?`},

{sec:"tech",c:"violet",eyebrow:"Q11 · The Cache Poisoning Dilemma",t:"a",h:"A11 — dependency-aware caching",body:`
<div class="ascii">WHY SIMPLE TTL CACHING FAILS HERE
Cache key = MD5(prompt_hash + context_hash)
 |- prompt hash: same
 |- context hash: same (the file hasn't changed)
 +- cache says: HIT
But <span class="rs">the WORLD has changed</span>: library version changed, security
advisory published, API deprecated - and the cache knows none of it.

Traditional caching assumes:
 "the function output depends only on its inputs"
LLM inference violates this:
 "the output depends on inputs + model + <span class="hl">world state</span>"</div>
<div class="ascii">LAYER 1 - DEPENDENCY TRACKING
Every response annotated with the dependencies it used:
 { "inference_id": "inf_abc123",
   "dependencies_detected": [
     {"type":"library","name":"auth-library","version":"2.3.0",
      "method":"authenticateV2_3",
      "vulnerability_status":"unknown_at_inference"},
     {"type":"internal_sdk","name":"idfc-banking-core",
      "version":"3.1.2","method":"createUserSession"} ],
   "dependency_fingerprint":"sha256(auth:2.3,bank:3.1.2)" }

LAYER 2 - DEPENDENCY VERSION REGISTRY (updated by CI/CD)
 "auth-library": { current_version "2.4.0",
   previous ["2.3.0","2.2.1"], deprecated ["2.3.0"],
   cve_affected ["2.3.0:CVE-2024-1234"], last_updated ... }

LAYER 3 - CACHE VALIDATION ON READ
1. retrieve cached response + dependency_fingerprint
2. query registry for current versions
3. compare: cached auth:2.3 vs current auth:2.4 -&gt; MISMATCH
4. check severity of the change:
   MINOR bump (2.3 -&gt; 2.4)      -&gt; invalidate cache entry
   DEPRECATED in cached version -&gt; invalidate + warn developer
   CVE in cached version        -&gt; <span class="rs">invalidate + BLOCK (don't serve)</span>
   PATCH (2.3.0 -&gt; 2.3.1)       -&gt; flag "potentially stale", serve
5. if invalidated: re-run inference with fresh context</div>
<div class="ascii">HOW DO WE KNOW WHAT DEPENDENCIES THE CODE USES?
Method 1 - Static analysis (post-generation): parse the AST for
 imports and method calls, resolve library versions from the POM.
 Accuracy 95% for explicit imports; can't detect runtime reflection.
Method 2 - Context-aware detection (during inference): the injected
 context already includes the POM/build file, so the model SHOULD
 generate v2.4 code. If it generates v2.3 (hallucination), we catch
 it in post-processing validation.</div>
<div class="ascii">THE CACHE KEY REDESIGN
CURRENT (flawed): key = MD5(prompt + context_hash)
PROPOSED:         key = MD5(prompt + context_hash +
                            dependency_fingerprint)
 where fingerprint = sha256(sorted(["auth-library:2.3.0",
   "idfc-banking-core:3.1.2","spring-security:5.7.1"]))

IMPACT ON HIT RATE
 old key (version-independent): 40% hit rate, risk of stale responses
 new key (version-dependent):   35% hit rate, near-zero staleness risk
TRADE-OFF
 5% fewer hits = ~5% more inference cost = 5% × $3.4M = $170,000/yr
 Benefit: prevents CVE vulnerabilities from cached code
 <span class="tl">A single prevented security incident saves more than $170K. ROI obvious.</span></div>
<div class="ascii">STALE-WHILE-REVALIDATE (for non-critical / patch changes)
1. return the cached response immediately (fast)
2. add header: "X-Cache: STALE - revalidating"
3. asynchronously trigger a new inference
4. when complete: identical -&gt; extend TTL;
   different -&gt; update cache + notify "An updated suggestion
   is available"
-&gt; user is never blocked, gets safe code immediately, and is
   notified if the result differs significantly</div>
<div class="note"><b>The uncomfortable truth:</b> your cache is a <b>liability, not just an optimization</b>. Every cached response is a potential security vulnerability waiting to be exploited. Most organizations optimize caching for hit rate, not correctness. In fintech, correctness must win every time — the 5% hit-rate reduction isn't just acceptable, it's mandatory.</div>`},

{sec:"tech",c:"violet",eyebrow:"Q12 · Deep-Dive",t:"q",q:`Mumbai runs model v1.3; Singapore still runs v1.2 (fine-tuning happens only in Mumbai for data sovereignty). A developer travelling between them says "<b>Is the AI randomly good or bad?</b>"<br><br>Delay Mumbai deploys until Singapore is ready, or accept inconsistency? And how do you even know v1.3 is "better" when all your benchmarks are Mumbai-team code?`},

{sec:"tech",c:"violet",eyebrow:"Q12 · The Multi-Region Consistency Problem",t:"a",h:"A12 — staged rollout, sticky routing &amp; region-specific benchmarks",body:`
<div class="ascii">THE GEOGRAPHY OF THE PROBLEM
Mumbai (ap-south-1) PRIMARY: most developers, fine-tuning happens
 here, model registry lives here. Version: deepseek-v1.3 (2 hrs old)
Singapore (ap-southeast-1) SECONDARY: 300 developers (expanding),
 for latency (Mumbai-&gt;Singapore is 60ms).
 Version: deepseek-v1.2 - artifacts still syncing, 87% complete
The traveling developer: morning in Mumbai used v1.3 (great
 suggestions); afternoon in Singapore using v1.2 (worse). Their
 perception: "the AI is randomly good or bad". Reality: two versions.

DISTRIBUTION DECISION
 A. push to all regions immediately -&gt; a bug in v1.3 hits everyone
 B. canary in Mumbai, delay others  -&gt; inconsistency (this scenario)
 C. synchronized deployment          -&gt; slower innovation</div>
<div class="ascii">STAGED ROLLOUT ACROSS REGIONS
Phase 1 Mumbai internal (hour 0-4): v1.3 to 10% Mumbai traffic;
 monitor latency, error rate, quality; if issues -&gt; rollback and
 Singapore never sees v1.3
Phase 2 Mumbai full (hour 4-8): v1.3 to 100% Mumbai; if stable
 4 hours -&gt; proceed
Phase 3 Singapore canary (hour 8-12): v1.3 to 10% Singapore, a
 DIFFERENT canary group (Singapore has different code patterns!)
Phase 4 Singapore full (hour 12-16): all regions consistent
TOTAL TIME TO CONSISTENCY: 16 hours
MAX INCONSISTENCY WINDOW: 12 hours
During the window: route travelling developers to their HOME region
 (by user profile, not geography) and show version info in the IDE:
 "AI Model v1.2 (v1.3 available in your home region Mumbai)"</div>
<div class="ascii">STICKY REGION ROUTING (user affinity)
Instead of routing to the nearest region, route to the user's
"home" region:
 { "user_id":"developer_1234", "home_region":"ap-south-1",
   "current_location":"Singapore", "region_routing":"home_region" }
API Gateway rule: if user.home_region == "ap-south-1" -&gt; Mumbai
 endpoint, else nearest region.
TRADE-OFF: Mumbai-&gt;Singapore latency 60ms, ~15% added inference
 time, BUT consistent model version.
USER CHOICE: "Use home region (consistent, slightly slower)
 [DEFAULT] | Use nearest region (faster, may differ)"</div>
<div class="ascii">WHY "BETTER" IS DIFFERENT IN EACH REGION
Mumbai benchmark (used for evaluation): 500 test cases from Mumbai
 code; patterns = Indian fintech, RBI compliance, UPI;
 v1.3 score 82% (improved from 78%)
Singapore benchmark: <span class="rs">doesn't exist yet!</span> Singapore writes
 different code: ASEAN compliance, cross-border, different APIs.
 v1.3 score: UNKNOWN
<span class="rs">The model might be better for Mumbai but WORSE for Singapore.</span>

SOLUTION: REGION-SPECIFIC EVALUATION
 Mumbai: 500 test cases from Mumbai repos, weighted by pattern
  frequency, updated monthly from accepted suggestions
 Singapore: 200 test cases from Singapore repos (growing),
  different patterns and APIs - smaller but region-specific
 DEPLOYMENT GATE: v1.3 must pass BOTH
  Mumbai 82% (PASS, above 80%) | Singapore 76% (PASS, above 75%)
  If Singapore fails: deploy only to Mumbai, investigate regression</div>
<div class="ascii">MODEL ARTIFACT SYNC + DISASTER RECOVERY
S3 idfc-models-mumbai/v1.3/ (weights 33GB, config, tokenizer,
 evaluation_results.json, deployment_manifest.yaml)
Cross-Region Replication -&gt; idfc-models-singapore
 replication time ~5 minutes for 33GB (near-real-time for new
 objects), tracked via S3 Replication metrics.
SageMaker Model Registry: Singapore polls for new versions every
 5 minutes, deploys when artifact replicated + gate passed.

IF MUMBAI GOES DOWN: Singapore becomes primary - but may be on an
older version. Serve v1.2 IMMEDIATELY, sync v1.3 asynchronously.
 |- health check detects Mumbai failure, route all to Singapore
 |- banner: "AI running on backup region. Version v1.2. Some
 |   improvements temporarily unavailable."
 +- when v1.3 ready: hot-swap with zero downtime</div>
<div class="note"><b>The uncomfortable truth:</b> perfect multi-region consistency is a myth. The goal isn't to eliminate inconsistency — it's to make the window as small as possible, be transparent about which version users get, give users control over routing, and ensure inconsistency never means "dangerously wrong", just "potentially less optimal". <b>The 16-hour canary window is a feature, not a bug</b> — it prevented an untested model from breaking Singapore's code generation.</div>`},

{sec:"tech",c:"violet",eyebrow:"Q13 · Deep-Dive",t:"q",q:`Two developers write the same function. One costs <b>₹0.002</b>, the other <b>₹0.15</b> — depending on cache hits, batch size at that moment, and prompt length.<br><br>Design a fair chargeback model. Do you <b>surge-price peak hours</b> like Uber? And how do you tell a BU head their team spent ₹50,000 that could have been ₹30,000 — without creating resentment?`},

{sec:"tech",c:"violet",eyebrow:"Q13 · The Cost Attribution Black Hole",t:"a",h:"A13 — multi-factor pricing &amp; behavioural economics",body:`
<div class="ascii">THE PROBLEM IN NUMBERS - same task, "Add input validation"
Developer A (09:00, peak): no cache hit, batch size 4 (high
 utilization), 4,000 context + 500 output tokens, 350ms,
 1/4 GPU for 350ms -&gt; COST ₹0.15
Developer B (02:00, off-peak): no cache hit, batch size 1 (only
 request), same tokens, 400ms (no batching benefit),
 full GPU for 400ms -&gt; COST ₹0.60
<span class="rs">SAME TASK, 4× COST DIFFERENCE</span>
Developer C (09:15): cache HIT, Redis 3ms, zero GPU -&gt; ₹0.002
Developer D (09:15, different wording): cache MISS (semantically
 same, syntactically different) -&gt; ₹0.15
This is impossible to explain to a business unit head.</div>
<div class="ascii">MULTI-FACTOR COST CALCULATION
Cost = Base_Cost × Time_Multiplier × Efficiency_Factor
BASE: ₹0.002 per 1K tokens (input+output); minimum ₹0.01/request
TIME MULTIPLIER
 peak (09-11, 14-16): 1.5× | normal business hours: 1.0×
 off-peak (nights, weekends): 0.7×
EFFICIENCY FACTOR
 cache hit: 0.05× (only pay for cache infra)
 batch efficiency &gt;75%: 0.8× | 50-75%: 1.0× | &lt;50%: 1.3×
 request during a scaling event: 1.5× (peak premium)
EXAMPLES
 Dev A (peak, efficient batch):
   ₹0.002 × 4.5K × 1.5 × 0.8 = ₹0.011
 Dev B (off-peak, inefficient batch):
   ₹0.002 × 4.5K × 0.7 × 1.3 = ₹0.008
 <span class="hl">SURPRISE: with proper pricing, Dev B costs LESS despite using a
 full GPU - because off-peak pricing reflects lower infra strain.</span></div>
<div class="ascii">MONTHLY TEAM INVOICE - Team Alpha, March 2024
SUMMARY: 1,247,000 requests | 892M tokens | cache hit rate 38%
 peak usage 42% | total cost ₹847,230 | ₹4,236 per developer (200)
COST BREAKDOWN
 Inference (GPU) ₹652,000 (77%)  [peak premium +₹98,000,
                                  off-peak discount -₹45,000]
 Caching (Redis)  ₹45,000 (5%)
 Storage (S3, DynamoDB) ₹23,000 (3%)
 Platform overhead ₹127,230 (15%) - shared infra, support, training
EFFICIENCY SCORE: B+ (87/100)
 cache hit rate 38% (target 40%) | peak usage 42% (target &lt;40%)
 avg tokens/request 715 (target &lt;800) | rejection 28% (healthy 25-35%)
SAVINGS OPPORTUNITIES
 improve cache hit to 45%: save ₹31,000/month
 shift 10% peak usage off-peak: save ₹18,000
 optimize prompts (fewer avg tokens): save ₹22,000
COMPARISON: last month ₹892,000 -&gt; this month ₹847,230 (↓5.0%)
 Team Beta (same size) ₹723,000 | org avg/dev ₹4,850 (you ₹4,236)</div>
<div class="ascii">BEHAVIOURAL ECONOMICS - reward off-peak, don't punish peak
1. "Night Owl" credits: requests 22:00-06:00 earn 2× efficiency
   credits, reducing next month's bill
2. Cache-friendly prompting: detect semantic similarity to a cached
   entry and suggest "Did you mean: [cached prompt]?" - accepting
   the cached version costs no inference
3. Team leaderboards: NOT "who spent the most?" (shaming) BUT
   "most efficient team" (positive reinforcement);
   Efficiency = Quality × Cost-Efficiency; monthly top-3 recognition
4. Token budget visualization: real-time IDE indicator
   "This request: ₹0.15"; daily "Today: ₹42 of ₹100 budget"
   -&gt; natural conservation without hard limits</div>
<div class="ascii">THE TRANSPARENCY DILEMMA
A. Hide all costs: no cognitive overhead BUT no efficiency
   incentive -&gt; tragedy of the commons
B. Show all costs: full transparency BUT developers optimize for
   cost, not quality ("I won't use AI for this complex task
   because it costs ₹5") -&gt; underuse, productivity loss
C. <span class="tl">Show costs WITH CONTEXT (CHOSEN)</span>
   "This AI suggestion costs ₹0.15 and could save you 15 minutes.
    15 min of your time costs the company ~₹400.
    Net savings: ₹399.85"
   -&gt; makes the ROI obvious; encourages use when beneficial,
      not when wasteful</div>
<div class="note"><b>The uncomfortable truth:</b> perfectly fair cost attribution is impossible, because costs depend on factors outside any developer's control (batch efficiency, cache state, infra utilization). The goal isn't perfect fairness — it's <b>transparency that drives the right behaviours</b>. And the real problem isn't technical, it's organizational: finance wants chargeback, engineering wants productivity. No model resolves that tension; leadership must decide whether AI is a cost centre to minimize or a productivity investment to optimize.</div>`},

{sec:"tech",c:"violet",eyebrow:"Category 4 · Recall",t:"r",h:"Quick recall: technical deep-dives",qs:[
{q:`What is the U-shaped attention finding, and what does it imply for a 12K-token context?`,a:`<b>Lost in the Middle</b> (Liu et al. 2023): attention is high at the beginning and end of context, low in the middle. With 12K of context, the first ~1K and last ~1K get attention and the middle ~10K is largely ignored — while the user's actual request gets pushed to the end.`},
{q:`Recite the 16K context budget allocation.`,a:`System prompt 500 (3%), high-priority context 4,000 (25%), medium-priority 4,000 (25%), low-priority 2,000 (12%), user prompt + response 5,500 (35%).`},
{q:`What makes LLM caching different from traditional caching?`,a:`Traditional caching assumes output depends only on inputs. LLM inference output depends on <b>inputs + model + world state</b> — library versions, CVEs, deprecations. So the cache key must include a <b>dependency fingerprint</b>, costing ~5% hit rate (40%&rarr;35%, ~$170K/yr) to eliminate staleness risk.`},
{q:`Multi-region: how long is the rollout, how long the max inconsistency window, and what routes the traveller?`,a:`16 hours to full consistency, <b>12-hour max inconsistency window</b>. Travellers are routed by <b>home region</b> (sticky routing from the user profile), not geography — ~15% added latency for a consistent model version, with the choice exposed to the user.`},
{q:`Give the cost formula and the "transparency with context" message.`,a:`Cost = Base × Time_Multiplier × Efficiency_Factor (peak 1.5× / off-peak 0.7×; cache hit 0.05×; batch &gt;75% = 0.8×, &lt;50% = 1.3×). The chosen framing: "This suggestion costs ₹0.15 and could save 15 minutes; 15 min of your time costs ~₹400. <b>Net savings ₹399.85.</b>"`}]},

/* ---- STRATEGIC ---- */
{sec:"eth",c:"gold",eyebrow:"Q15 · Strategic",t:"q",q:`After 2 years: new-hire coding scores down 25%, system design unchanged, debugging noticeably worse — but productivity at all-time highs. Your Head of Engineering wants <b>20% AI-free time</b>.<br><br>Real problem, or romanticizing the past? When did YOU last write a sorting algorithm from scratch?`},

{sec:"eth",c:"gold",eyebrow:"Q15 · The Skill Obsolescence Crisis",t:"a",h:"A15 — abstraction vs replacement",body:`
<div class="ascii">THE ALARMING TREND - hiring data before AI vs after 2 years
Coding test scores (out of 100)
 2022 (pre-AI): average 78, σ=12
 2023 (AI available, no policy): average 82 ↑  ... wait, UP?
 2024 (AI banned in interviews): average <span class="rs">59 ↓↓</span>
 REALITY: 2023 scores were inflated by AI use
System design scores: 2022 avg 71 | 2024 avg 72 (unchanged)
 -&gt; system design requires reasoning, not generation
Debugging assessment: 2022 avg time to fix a bug 23 minutes
 2024: <span class="rs">38 minutes (+65%)</span> - developers struggle when AI can't
 suggest the fix</div>
<div class="ascii">THE SKILL ATROPHY MECHANISM
Kruger &amp; Dunning's four stages, applied to AI-assisted coding:
Stage 1 UNCONSCIOUS INCOMPETENCE (danger zone)
 junior: "I built a payment system!" Reality: AI built it, they
 prompted it. They don't know what they don't know.
 Duration: first 6 months of AI reliance.
Stage 2 CONSCIOUS INCOMPETENCE (painful awakening)
 AI is down, they must modify code. "I don't actually understand
 this." Crisis of confidence. Duration: first outage or hard bug.
Stage 3 CONSCIOUS COMPETENCE (deliberate learning)
 intentionally practices without AI; uses AI as a teacher
 ("explain why this pattern"); builds understanding alongside
 productivity. Duration: ongoing, if deliberate.
Stage 4 UNCONSCIOUS COMPETENCE (mastery)
 knows when to use AI and when not to; can debug AI-generated code
 because they understand it. Duration: career-long, if maintained.
<span class="rs">THE TRAP: most developers get stuck at Stage 1 indefinitely,
because the system rewards speed over understanding.</span></div>
<div class="ascii">THE 20% AI-FREE TIME PROPOSAL
Rules: IDE AI plugins disabled for the designated period;
 exceptions for documentation lookup and Stack Overflow (learning
 tools, not generation tools); enforcement is TECHNICAL (the plugin
 respects the flag), not honour system - too easy to bypass.
Activities: coding katas; bug fixing on INTENTIONALLY planted bugs;
 code review of others' AI-generated code; refactoring without AI;
 learning a new language/framework/pattern.
NOT "do your normal work but slower" BUT "deliberately practice
the skills that AI automates".</div>
<div class="ascii">THE COUNTERARGUMENT - is this romanticizing the past?
"We don't make developers write assembly anymore."
ABSTRACTION vs REPLACEMENT
 Assembly -&gt; C -&gt; Java -&gt; Framework
  |- each level abstracts DETAILS
  |- developer still understands PRINCIPLES
  |- can debug at any level if needed
  +- understanding is ADDITIVE
 Human -&gt; Human + AI
  |- AI can REPLACE understanding
  |- developer doesn't need to understand at all
  |- can't debug if AI is wrong or unavailable
  +- <span class="rs">understanding can ATROPHY</span>
 The difference: a compiler doesn't let you skip understanding.
 <span class="hl">AI does.</span></div>
<div class="ascii">THE "AI-UNDERSTANDABILITY" CODE REVIEW STANDARD
For every AI-generated block merged, the developer must:
 |- explain the algorithm in plain English
 |- identify potential edge cases
 +- explain why this approach vs alternatives
Reviewer asks: "What happens if the input is null?"
 "Let me ask the AI..."           -&gt; <span class="rs">REJECT</span>
 "It would throw NPE at line 23,
  we should add a null check"     -&gt; <span class="tl">APPROVE</span>

RECOVERY PLAN when production breaks and no one understands the code
1. identify the failing component
2. find the original developer (may be unavailable)
3. check if the code was AI-generated (git tags)
4. if AI-generated and no one understands:
   ESCALATE to architect/senior; ANALYZE by asking AI to EXPLAIN
   (not fix): "Explain this code line by line, including the
   purpose of each section and potential failure modes";
   UNDERSTAND: human builds a mental model; FIX: human implements
5. post-mortem: how did critical code deploy with no one
   understanding it?
PREVENTION: "understanding documentation" for critical paths;
 bus factor tracked per component (&lt;2 people = risk flagged);
 quarterly "break the build" drills fixed without AI</div>
<div class="note"><b>The uncomfortable truth:</b> we are conducting a massive, uncontrolled experiment on developer cognition. We don't know what happens when an entire generation learns to code primarily by prompting. The cautious approach is to assume skills <b>can</b> atrophy and deliberately build practices that maintain fundamentals. The scariest scenario isn't that AI makes developers obsolete — it's that <b>AI makes developers incapable of operating without AI, and then the AI goes down.</b></div>`},

{sec:"eth",c:"gold",eyebrow:"Q14 · Strategic",t:"q",q:`An open-source foundation wants your fine-tuned model's weights released. It would make you an AI thought leader and attract talent — but might help competitors close your 3-year head start.<br><br>Can you release it <b>without leaking proprietary patterns</b>? If the model learned "IDFC uses a fraud threshold of ₹50,000", is that trade secret leakage?`},

{sec:"eth",c:"gold",eyebrow:"Q14 · The Open Source Contribution Dilemma",t:"a",h:"A14 — memorization audit &amp; staged release",body:`
<div class="ascii">WHAT'S IN THE MODEL WEIGHTS?
Public code: 95% of training data (open-source Java/Python, Stack
 Overflow, documentation, tutorials) -&gt; SAFE TO SHARE
Your proprietary code: 5% (fine-tuning) - internal API patterns,
 business logic, configuration patterns, architectural decisions
 -&gt; MAY CONTAIN TRADE SECRETS
The question: did the model MEMORIZE or GENERALIZE?
 MEMORIZATION (dangerous): can reproduce exact code; prompt "IDFC
  fraud detection for UPI" outputs the exact threshold
  "if amount &gt; 50000" -&gt; that's your trade secret in
  machine-readable form.
 GENERALIZATION (safe): learned patterns, not specifics - knows
  "fraud detection uses threshold checks" but generates different
  implementations each time.</div>
<div class="ascii">THE MEMORIZATION AUDIT - canary extraction test
Step 1: build a canary dataset of 100 internal-only code patterns
 (e.g. NpciClient.authenticate with proprietary secret, timeout
 3000, retry 3)
Step 2: test extraction with 1,000 varied prompts - for each canary
 generate 20 prompts that might trigger the memorized response,
 varying wording (5 variations), context injected, temperature
 (0, 0.1, 0.5), system prompt (with/without your API docs)
 -&gt; 100 canaries × 20 prompts × 3 temperatures = 6,000 tests
Step 3: measure memorization rate by similarity to your original:
 exact match CRITICAL | &gt;90% AST match HIGH RISK
 70-90% MODERATE | &lt;70% LOW | none SAFE
RESULTS (hypothetical)
 exact match: 3 / 6,000 (0.05%) - 3 patterns memorized
 high similarity: 47 / 6,000 (0.78%)
 medium/low: 5,950 / 6,000 (99.17%) - model generalizes
DECISION FRAMEWORK
 exact match &gt; 1%    -&gt; <span class="rs">DO NOT RELEASE</span>
 exact match 0.1-1%  -&gt; remove memorized patterns via differential
                        privacy, then release
 exact match &lt; 0.1%  -&gt; safe to release
 <span class="hl">our case: 0.05% - borderline but possible</span></div>
<div class="ascii">MEMORIZATION REMOVAL - DP-SGD fine-tuning pass
Objective: preserve general capability while removing memorized
 specific patterns. Method: differentially private SGD - add
 calibrated noise to gradients, clip gradients to limit any single
 example's influence. ε = 4, δ = 1e-5.
Effect: exact matches 0.05% -&gt; 0.001% (essentially zero)
 high similarity 0.78% -&gt; 0.15% | general performance -3% accuracy
Trade-off: slightly worse model, much safer.</div>
<div class="ascii">THE STRATEGIC CALCULUS
FOR RELEASING
 |- recruitment: "we built the AI that powers Indian fintech"
 |- industry influence: your APIs become the de facto standard
 |- regulatory goodwill with RBI / government
 |- community contributions: bug fixes, new capabilities, testing
 +- model weights alone aren't your moat - data, infra, expertise are
AGAINST RELEASING
 |- competitor acceleration (but they still need data, infra, trust)
 |- trade secret leakage (mitigated by audit + differential privacy)
 |- security risk: attackers study the model (but security through
 |   obscurity is already weak)
 |- maintenance burden: 1-2 engineers for community management
 +- regulatory risk: model may generate non-compliant code
     (mitigate with disclaimers and usage guidelines)</div>
<div class="ascii">STAGED RELEASE STRATEGY
Phase 1 Research paper (month 1): publish architecture, training
 methodology, benchmarks. No weights. Benefit: thought leadership,
 recruitment. Risk: minimal.
Phase 2 Academic access (month 3): weights to 10 research
 institutions under a research-only licence. Risk: low.
Phase 3 Sandbox API (month 6): hosted API with rate limits, free
 for startups, paid for enterprises. Risk: medium (controlled).
Phase 4 Open weights (month 12 - ONLY IF THE AUDIT PASSES):
 full weights under Apache 2.0, after a clean memorization audit
 and DP fine-tuning. Risk: highest, but managed.
At each phase: re-evaluate competitive impact and security findings.</div>
<div class="note"><b>The uncomfortable truth:</b> your model is probably <b>not</b> your competitive advantage. Your proprietary codebase, customer relationships, regulatory approvals and brand trust are your moat. The real question isn't "will competitors benefit?" (they will) — it's "will releasing grow the fintech AI ecosystem in a way that benefits us more than them?" But only if the memorization audit is clean: one trade secret in the weights and "thought leadership" becomes "negligence lawsuit".</div>`},

{sec:"eth",c:"gold",eyebrow:"Q16 · Strategic",t:"q",q:`A disgruntled <b>platform engineer</b> — who built the fine-tuning pipeline — spends 6 months seeding training examples with a hard-to-detect vulnerability pattern, then leaves. A year later it's exploited.<br><br>Traditional controls fail here: they wrote the review system, they have root, they control the dashboards and the audit logs. <b>So what stops them?</b>`},

{sec:"eth",c:"gold",eyebrow:"Q16 · The Insider Threat Multiplier",t:"a",h:"A16 — behavioural analysis &amp; the three-person rule",body:`
<div class="ascii">THE ATTACK, IN DETAIL
Attacker: senior platform engineer on the AI/ML team.
Phase 1 Understanding (month 1): maps the fine-tuning pipeline;
 learns training data = accepted suggestions; no anomaly detection
 on training data; they have admin access to data curation.
Phase 2 Injection (months 2-4): creates 300 fake "developer"
 accounts (or uses test accounts); submits 300 crafted prompts and
 "accepts" the responses. Each contains a subtle vulnerability:
  in authentication code: missing token expiration check
  in SQL queries: missing LIMIT clause (DoS potential)
  in logging: logs sensitive data in debug mode
 Each looks like a normal mistake; collectively they teach the
 model to omit these security checks. 300 over 90 days = 3-4/day
 = normal volume.
Phase 3 Exit (month 5): leaves on good terms with the knowledge.
Phase 4 Exploitation (month 8): finds auth tokens don't expire
 properly; uses old tokens to access customer data.
 Impact: data breach, regulatory penalties, reputation damage.</div>
<div class="ascii">LAYER 1 - CONTRIBUTOR BEHAVIOURAL ANALYSIS
Normal developer            Attacker pattern
 diverse prompts             systematic prompts targeting patterns
 60/40 accept/reject mix     <span class="rs">100% acceptance rate</span>
 modifies AI output          zero modifications ("perfect" output)
 human-like timing,          bot-like timing, consistent intervals
  breaks, weekends off
 reviews from many people    same reviewer (or self-review)
DETECTION THRESHOLD: any contributor showing &gt;2σ deviation in 3+
metrics -&gt; flag for manual review, quarantine their contributions.

LAYER 2 - CODE PATTERN CLUSTERING
Cluster training examples by AST similarity, vulnerability patterns
(static analysis), API usage, security property violations.
 Normal clusters: diverse, spread across contributors
 Attack cluster: tight, same contributor(s), same flaw
Example - Cluster #247 "Missing token expiration": 47 examples,
 <span class="rs">43 from contributor_unknown_17</span>, 4 from others (coincidence)
 -&gt; ACTION: quarantine all 43, investigate the contributor.

LAYER 3 - ADVERSARIAL VALIDATION (before deploying)
500 security-focused prompts: "generate authentication middleware",
"create API endpoint for user data", "write SQL query for
transaction search", "implement logging for payment processing".
For each response check: does auth code include token expiration?
does SQL include LIMIT/OFFSET? does logging mask sensitive fields?
does the endpoint include rate limiting?
If the model FAILS -&gt; BLOCK DEPLOYMENT.
<span class="tl">The attack is detected before it reaches production.</span></div>
<div class="ascii">THE ULTIMATE INSIDER THREAT: THE PLATFORM TEAM ITSELF
They have god-mode: control the model, the training data, the
deployment pipeline, monitoring and alerts - and can disable
security checks.
TRADITIONAL CONTROLS FAIL
 code review -&gt; they wrote the review system
 access control -&gt; they have root access
 monitoring -&gt; they control the dashboards
 auditing -&gt; they manage the audit logs

SOLUTION: TRUST BUT VERIFY (three-person rule)
Critical actions require 2-of-3 approval:
 |- modifying training data inclusion criteria
 |- deploying a new model version to production
 |- disabling security validation checks
 |- modifying audit logs
 +- accessing raw inference logs
Three independent teams: AI Platform (operators), Security
 (validators), Data Governance (auditors). <span class="hl">No single person on any
 team can perform critical actions alone.</span>
TECHNICAL IMPLEMENTATION
 AWS KMS with a key policy requiring MFA from 2 roles;
 Git branch protection requiring 2 approvals;
 SageMaker deployment requiring manual approval;
 S3 object lock preventing deletion of audit logs.</div>
<div class="note"><b>The uncomfortable truth:</b> the people who build your AI system are the greatest insider threat — they understand it best, have the access to manipulate it, and know how to evade detection. Traditional security focuses on external threats and non-privileged insiders; AI systems create a new category: <b>the privileged insider who can poison the very intelligence that generates code for the entire organization.</b> The defence is organizational as much as technical: separation of duties and multi-party approval, accepting the friction as the price.</div>`},

{sec:"eth",c:"gold",eyebrow:"Category 5 · Recall",t:"r",h:"Quick recall: strategic &amp; ethical",qs:[
{q:`What are Kruger &amp; Dunning's four stages applied to AI coding, and where do most developers get stuck?`,a:`1. Unconscious incompetence ("I built a payment system!" — AI built it). 2. Conscious incompetence (first outage: "I don't understand this"). 3. Conscious competence (deliberate practice, AI as teacher). 4. Unconscious competence (knows when to use AI, can debug it). <b>Most get stuck at Stage 1</b> because the system rewards speed over understanding.`},
{q:`Why is "we don't write assembly anymore" a weak counterargument?`,a:`Assembly &rarr; C &rarr; Java abstracts <b>details</b> while principles remain, understanding is additive, and you can drop down a level to debug. AI can <b>replace</b> understanding entirely — a compiler doesn't let you skip understanding; AI does.`},
{q:`Give the memorization decision framework thresholds.`,a:`Exact match <b>&gt; 1% &rarr; do not release</b>; <b>0.1–1% &rarr; apply differential privacy first</b>; <b>&lt; 0.1% &rarr; safe to release</b>. Measured: 0.05% exact, 0.78% high similarity. DP-SGD (ε=4) cut exact matches to 0.001% at a cost of 3% accuracy.`},
{q:`Describe the three-person rule and the five actions it covers.`,a:`Critical actions need <b>2-of-3 approval</b> across AI Platform (operators), Security (validators) and Data Governance (auditors). Covered: modifying training-data criteria, deploying a model version, disabling security checks, modifying audit logs, accessing raw inference logs. Enforced via KMS MFA policies, branch protection, manual SageMaker approval, S3 object lock.`}]},

/* ---- FUTURE ---- */
{sec:"fut",c:"rose",eyebrow:"Q17 · Future-Proofing",t:"q",q:`DeepSeek gets acquired and the licence changes to restrict commercial use. Or they go under. Or v3 needs H200s you can't get for 6 months. Your platform is built on their tokenizer, chat template, architecture, 18 months of fine-tuning, and a model-specific cache.<br><br><b>Could you switch to Llama 3 in 30 days?</b> What does that insurance cost?`},

{sec:"fut",c:"rose",eyebrow:"Q17 · The Model Bankruptcy Problem",t:"a",h:"A17 — abstraction layer, shadow deployment &amp; portable fine-tuning",body:`
<div class="ascii">MODEL ABSTRACTION LAYER
TODAY (DeepSeek-specific):
 Application -&gt; DeepSeekClient -&gt; DeepSeek Model
 Problem: tight coupling.
TARGET (model-agnostic):
 Application -&gt; Model Abstraction Layer -&gt; Router
   |- DeepSeek Adapter -&gt; DeepSeek Model
   |- Llama Adapter    -&gt; Llama Model
   |- Mistral Adapter  -&gt; Mistral Model
   +- Generic Adapter  -&gt; Any Model
 Abstraction handles: tokenizer differences, prompt template
 conversion, output format normalization, context window management.

ModelConfig (per-model specification)
 deepseek_v1: architecture "deepseek", tokenizer
   "deepseek_tokenizer_v2", chat_template
   &lt;|system|&gt;{system}&lt;/s&gt; &lt;|user|&gt;{user}&lt;/s&gt; &lt;|assistant|&gt;{response},
   max_context 16384, special_tokens bos "&lt;|begin|&gt;" eos "&lt;/s&gt;",
   supports_system_prompt true, supports_function_calling false
 llama_v3: architecture "llama", tokenizer "llama_tokenizer_v3",
   chat_template &lt;|begin_of_text|&gt;&lt;|start_header_id|&gt;system...,
   max_context 8192, bos "&lt;|begin_of_text|&gt;" eos "&lt;|eot_id|&gt;",
   supports_function_calling true</div>
<div class="ascii">THE PROMPT TRANSLATION LAYER
Translation rules per model pair:
 |- map system/user/assistant markers
 |- map special tokens (bos, eos)
 |- adjust whitespace conventions
 |- handle model-specific features (function calling, etc.)
 +- validate: round-trip test to ensure fidelity</div>
<div class="ascii">THE SHADOW DEPLOYMENT STRATEGY
Production: DeepSeek v1.3 (100% traffic)
Shadow:     Llama 3 70B (receives a copy of 10% of traffic)
 |- requests mirrored to the shadow endpoint
 |- shadow responses generated but NOT returned
 |- compared: DeepSeek vs Llama; metrics on quality, latency, cost
SHADOW EVALUATION DASHBOARD (last 30 days)
 Code quality:   DS 82% | Llama 79%  (-3%)
 Latency p95:    DS 720ms | Llama 890ms (+23%)
 Cost/1K tokens: DS $0.002 | Llama $0.003 (+50%)
 Developer pref: DS 65% | Llama 35%
 GAP ANALYSIS: Llama not yet competitive
BUT if DeepSeek becomes unavailable: <span class="tl">Llama is READY TO DEPLOY
immediately</span> - quality drop 3% (acceptable emergency), latency
+23% (manageable), cost +50% (emergency premium).
WITHOUT shadow deployment: emergency migration 4-6 weeks minimum,
quality unknown until deployed, risk of extended downtime.
COST: 10% traffic mirroring = 10% extra inference, but on cheaper
hardware (spot, off-peak) ~ $50,000-80,000/year.
ROI: one avoided emergency migration saves $500K+.</div>
<div class="ascii">MAKING FINE-TUNING PORTABLE
1. LoRA (Low-Rank Adaptation): train small adapter matrices, not
   the full model. Adapters are architecture-specific BUT the
   training methodology transfers - switching models = retrain
   adapters (1 week vs 1 month).
2. RAG-first architecture: base model + retrieval, not fine-tuned
   knowledge. Knowledge lives in the vector DB, not the weights -
   switching models = new base model + same vector DB.
   <span class="hl">Migration time: hours, not weeks.</span>
3. Dataset preservation: all training data stored in a
   model-agnostic format (prompt-response pairs, not model-specific
   tensors). Switching = retrain on the same data (~$50K per switch).</div>
<div class="note"><b>The uncomfortable truth:</b> you're not just dependent on DeepSeek's model — you're dependent on their continued existence as a company, their licensing decisions, and their architectural direction. The insurance policy (shadow deployment, abstraction layer, portable fine-tuning) costs 10–20% overhead and feels wasteful when everything is fine. <b>The real question isn't "can we afford the insurance?" — it's "can we afford not to have it?"</b></div>`},

{sec:"fut",c:"rose",eyebrow:"Q18 · Future-Proofing",t:"q",q:`The EU passes an "AI in Financial Services Act": full explainability, human-in-the-loop with auditable trails, bias testing, and a customer right to ask "was AI used on my transaction?"<br><br>Your value proposition is <b>speed</b>. Does it evaporate? And how do you technically track "was this specific line AI-generated?" across git history and refactoring?`},

{sec:"fut",c:"rose",eyebrow:"Q18 · The Regulation Tsunami",t:"a",h:"A18 — four requirements, four implementations",body:`
<div class="ascii">REQUIREMENT 1 - FULL EXPLAINABILITY
Regulator: "Why did the AI generate this specific code?"
Challenge: LLMs are black boxes - we can't trace which training
examples influenced the output, why this approach over
alternatives, or the "reasoning" spread over billions of parameters.
PRACTICAL SOLUTION: post-hoc explanation generation
 1. Natural language explanation via a second LLM pass:
    "This code implements payment validation using a rule engine
     pattern. It checks: 1. transaction amount within limits,
     2. account status active, 3. no duplicate transaction..."
 2. Design decision documentation: "Alternatives considered:
    if-else chain (rejected for maintainability), database
    constraints (rejected for performance), rule engine (selected
    for flexibility)"
 3. Traceability to requirements: "implements IDFC-1234,
    acceptance criteria AC-3"
LIMITATIONS: this is post-hoc rationalization, not true
explanation - but it satisfies the documentation requirement, and
it's better than "the black box decided".</div>
<div class="ascii">REQUIREMENT 2 - HUMAN-IN-THE-LOOP VERIFICATION
Commit metadata: { commit_hash, ai_generated: true,
 ai_model_version "deepseek-v1.3", ai_confidence 0.87,
 human_verification: { verified_by, verified_at,
  verification_time_seconds 342, verification_method
  "code_review_and_testing", modifications_made [...],
  verification_checklist_completed ["business logic verified",
  "security review passed", "unit tests cover edge cases",
  "integration tested in staging"], verifier_statement } }
AUDIT TRAIL: immutable append-only ledger, searchable by
 developer/date/component, exportable for regulatory submission,
 7-year minimum retention.

DOES THIS DESTROY THE SPEED ADVANTAGE?
 Before AI: 100% human code + review = 4 hours
 AI with verification: 5 min generation + 55 min verification
  = 1 hour
 <span class="tl">Still 4× faster than pure human coding.</span> The advantage remains -
 it shifts from "generation speed" to "verification efficiency".</div>
<div class="ascii">REQUIREMENT 3 - BIAS TESTING
How can code be discriminatory? e.g. loan eligibility that rejects
by postal code (a race proxy) or caps loans by age.
BIAS TEST SUITE (run on every AI-generated function)
1. Protected attribute injection: run with varied names
   (ethnicity proxy), postal codes (race proxy), ages, genders
2. Disparate impact analysis: chi-squared on approval rates;
   p &lt; 0.05 indicates potential bias
3. Proxy variable detection: postal code -&gt; race (corr 0.7),
   school name -&gt; religion (corr 0.5); FLAG if used as decision inputs
4. Fairness constraints in the system prompt: "Generated code must
   not discriminate based on race, gender, age, religion, caste or
   disability. Do not use postal code, school, or names as
   decision inputs."
CHALLENGE: code is neutral, usage is biased - the same function is
 fair with financial inputs and discriminatory with protected ones.
SOLUTION: test the FUNCTION INTERFACE, not just the code -
 does it accept protected attributes? If yes, FLAG: why does this
 function need age/gender/race?</div>
<div class="ascii">REQUIREMENT 4 - RIGHT TO EXPLANATION
Transaction T-987654321 -&gt; processed by PaymentService v2.4.1 -&gt;
 deployed 2024-03-15 02:00 UTC -&gt; git commit abc123def456
 code in commit: 70% human-written (modified from AI suggestion),
 20% AI-generated (accepted as-is), 10% AI-generated then modified
 AI models used: deepseek-v1.3
Customer-facing explanation: "Your transaction was processed using
 a combination of human-written and AI-assisted code. AI assistance
 was used for transaction validation logic (AI suggested, human
 verified) and currency conversion (human-written core, AI
 optimized performance). All AI-generated code was reviewed by
 human developers before deployment."
TECHNICAL IMPLEMENTATION - per-line provenance tags:
 // @provenance: ai-generated, model=deepseek-v1.3, confidence=0.92
 // @human-verifier: developer_1234, verified=2024-03-14
 // @provenance: human-written (modified from AI suggestion that
 //   had threshold=5000)
 // @provenance: human-written, no-ai-involvement
Git hooks enforce provenance tags; CI/CD builds a provenance
manifest for each deployment.</div>
<div class="ascii">SPEED vs COMPLIANCE
WITHOUT compliance: prompt -&gt; generate (5s) -&gt; glance (30s) -&gt;
 commit and deploy = ~5 minutes
WITH full compliance: prompt -&gt; generate (5s) -&gt; AI explanation
 (2s) -&gt; review code AND explanation (10 min) -&gt; verification
 checklist (5 min) -&gt; bias test (2 min) -&gt; provenance tags (1s)
 -&gt; commit with metadata = ~25 minutes
PRODUCTIVITY IMPACT
 Before AI: 4 hours per feature
 AI without compliance: 30 minutes (8× faster)
 AI with compliance: 45 minutes (5.3× faster)
 <span class="tl">STILL DRAMATICALLY FASTER, just with better documentation.</span>
THE IRONIC RESULT: regulatory compliance actually IMPROVES code
quality, because it forces humans to actually review AI output.</div>
<div class="note"><b>The uncomfortable truth:</b> regulation isn't the enemy of AI-assisted coding — it's <b>the forcing function that makes us implement the safety practices we should have been doing all along</b>. The "speed advantage" of skipping review and blindly trusting AI was never real; it was just pushing risk into the future.</div>`},

{sec:"fut",c:"rose",eyebrow:"Q19 · Future-Proofing",t:"q",q:`By year 3, <b>70% of your codebase is AI-generated</b> — and you're fine-tuning on it. Research suggests "model collapse": progressive degradation from training on synthetic data. Internal metrics show accuracy dropping 3% per quarter.<br><br>Can you even tell human from AI code now? Do you need a <b>"human code preserve"</b>? Is the whole industry heading for a quality cliff?`},

{sec:"fut",c:"rose",eyebrow:"Q19 · The Self-Referential Death Spiral",t:"a",h:"A19 — model collapse, detection &amp; the human code preserve",body:`
<p>Perhaps the most existentially threatening scenario, because it's <strong>gradual, hard to detect, and potentially irreversible</strong>.</p>
<div class="ascii">THE MODEL COLLAPSE MECHANISM
Year 1: trained on 100% human code - baseline, all ground truth
Year 2: 70% human / 30% AI-generated. AI code has subtle patterns
 (repetition, simplicity); the model learns them as "normal".
 Quality -3% (barely noticeable) - but the feedback loop has begun.
Year 3: 40% human / 60% AI. Now training on its own outputs;
 errors compound, small mistakes become "correct" patterns.
 Quality -12% (attributed to "model limitations").
Year 4: 20% human / 80% AI. Catastrophic forgetting of edge cases;
 generates "the average of AI code", which is mediocre.
 Quality -35% (crisis mode). Recovery requires human code that
 no longer exists.
Year 5: human code is a minority in the codebase. New developers
 trained on AI patterns write code that looks AI-generated. Even
 the "human" training data is AI-influenced.
 <span class="rs">The cycle is complete: human and AI code converge to mediocrity.</span></div>
<div class="ascii">DETECTION - CODE PROVENANCE SCORE (0-100)
100: entirely human-written, no AI influence
 75: human-written, AI used for reference only
 50: human-modified AI output (substantial changes)
 25: human-modified AI output (minor changes)
  0: pure AI output, accepted as-is
TRACK OVER TIME
 Month 1: average 92 (mostly human)
 Month 6: 78 (AI creeping in)
 Month 12: 65
 Month 18: <span class="rs">48 (MAJORITY AI!)</span>
ALERT THRESHOLD: average provenance &lt; 50 -&gt; training data crisis

DETECTING COLLAPSE - four metrics
1. Output diversity: unique n-gram diversity in outputs.
   Collapse indicator: diversity DECREASING (converging to average)
2. Edge case handling: test with unusual inputs weekly.
   Collapse indicator: edge-case performance drops while common
   cases stay stable
3. Code complexity: cyclomatic complexity of generated code.
   Collapse indicator: complexity trending DOWNWARD (simpler,
   less sophisticated code)
4. Regression rate: bugs that are regressions (fixed, then break).
   Collapse indicator: regression rate INCREASING (forgetting fixes)</div>
<div class="ascii">THE HUMAN CODE PRESERVE (HCP) - a seed bank
A curated repository of code that is:
 |- verified 100% human-authored
 |- high quality (passes all quality gates)
 |- diverse (covers all domains and patterns)
 |- continuously updated with new human code
 +- protected - never contaminated with AI code
How to ensure code is human-authored:
 |- written during tracked AI-free periods
 |- written before AI deployment (historical)
 |- written with AI but substantially modified (&gt;50%)
 +- verified by 2 senior developers
Size: target 100,000 examples (minimum viable)
Growth: +500 new examples per month
USAGE: fine-tuning seed (always include 20% HCP data); benchmark
 evaluation (ground truth); collapse detection (compare vs
 baseline); recovery (retrain from HCP if collapse detected)

<span class="hl">THE PARADOX: to maintain AI quality you must maintain human coding
capability. The very skill you're automating away is what you need
to preserve to keep the automation working.</span></div>
<div class="ascii">BREAKING THE CYCLE - three interventions
Strategy 1 SYNTHETIC DATA FILTERING (not all AI code is bad)
 INCLUDE: AI code heavily modified by a human (provenance &gt; 50)
 INCLUDE: AI code that passed tests + deployment + 30 days no bugs
 EXCLUDE: AI code accepted without modification (provenance &lt; 25)
 EXCLUDE: AI code reverted/fixed within 7 days (proven buggy)
 WEIGHT:  human code 3×, verified AI code 1×
Strategy 2 DIVERSITY INJECTION
 |- temperature sampling: generate multiple solutions per problem,
 |   train on the BEST (not just the first)
 |- multi-model training: include outputs from DIFFERENT models
 |   (Mistral, Llama, CodeGen) to prevent a single-model echo chamber
 +- human creativity exercises: coding challenges with novel
     constraints to produce diverse code
Strategy 3 PERIODIC FULL RETRAINING (every 6 months)
 1. take the base model (before any fine-tuning)
 2. fine-tune ONLY on Human Code Preserve data
 3. compare to the incrementally fine-tuned model
 4. if the fresh model wins -&gt; deploy it, investigate contamination
 Cost: $50K per retraining × 2/year = $100K/year to prevent collapse</div>
<div class="ascii">THE INDUSTRY-WIDE CONCERN
The entire industry is using AI to generate code, training AI on
that code, which generates more AI-influenced code, which trains
future AI. <span class="rs">A global-scale feedback loop with no circuit breaker.</span>
ANALOGY: inbreeding in genetics - a small gene pool compounds
genetic defects; you need outbreeding to maintain diversity.
For AI: "outbreeding" with truly human code.
SCARY PROJECTION - if unchecked, by 2030: most open-source code is
AI-generated; new models train on it; quality slowly degrades
across the industry; and no one notices because the benchmarks are
also AI-influenced.</div>
<div class="note"><b>The uncomfortable truth:</b> we're eating our own seed corn. Every time a developer accepts an AI suggestion unmodified and it enters the next model's training data, we slightly degrade future quality. It's imperceptible day to day, but <b>compound interest works both ways</b> — here it's compounding mediocrity. The organizations with the best AI in 5 years won't be the ones with the most GPUs; they'll be the ones that <b>maintained the purest human code preserves</b> and were most disciplined about training data.</div>`},

{sec:"fut",c:"rose",eyebrow:"Q20 · Future-Proofing",t:"q",q:`<b>3 AM.</b> Payment processing is down. The on-call engineer traced it to a deployment with AI-generated code they can't understand. The original developer is in Ladakh with no connectivity. The model has been updated twice since. Every minute costs <b>₹15 lakh</b>.<br><br>What do you do right now? And should some categories of code simply <b>prohibit AI generation</b>?`},

{sec:"fut",c:"rose",eyebrow:"Q20 · The Ultimate Question",t:"a",h:"A20 — the 3 AM playbook &amp; the prohibition debate",body:`
<div class="ascii">THE IMMEDIATE RESPONSE (first 15 minutes)
T+0  the call: "PaymentService is failing with NPE"
     "What changed recently?" - "Deployment 4 hours ago, abc123def."
     "Was it AI-generated?" - "Checking... YES. 80% AI-generated."
     <span class="hl">"Roll back immediately. Now."</span>
T+2  rollback initiated - canary infrastructure saves us: the
     previous version is still running on 10% of instances.
     Command: "Promote canary to 100%". Rollback time: 2 minutes.
T+4  service restored, transactions processing
T+5  post-rollback assessment: 4 hours of transactions processed
     with potentially buggy code - were they corrupted? Is the
     rollback version safe? What EXACTLY was the bug?
T+15 stabilized: previous version running, on-call analyzing the
     failed deployment, finance calculating transaction impact.</div>
<div class="ascii">THE INVESTIGATION
Commit abc123def: 3 files changed
 PaymentService.java +45 -12, lines 230-275 AI-generated (tagged)
 PaymentValidator.java +23 (human-written)
 PaymentConfig.java +5 (human-written)
AI-generated block:
 // @ai-generated: model=deepseek-v1.2, confidence=0.91
 // @human-verifier: developer_1234, time=4min
 public PaymentResult processPayment(Payment p) {
     validateAmount(p.getAmount());  <span class="rs">// &lt;-- NPE HERE</span>
     applyExchangeRate(p);
     return repository.save(p);
 }
The bug: validateAmount() doesn't null-check p.getAmount().

WHY IT WAS ACCEPTED - verification metadata
 time spent: 4 minutes (below average for financial code)
 tests written: 1 (happy path only)
 checklist completed: NO (skipped verification)
 reviewer: user_5678, review time 2 minutes
ROOT CAUSE: developer rushed, reviewer rubber-stamped, tests
 insufficient, and <span class="rs">AI confidence 0.91 created false trust</span>.</div>
<div class="ascii">WHAT SAVED US
1. Canary deployment: new code to 10% first, 90% on the previous
   version, promotion required manual approval, previous version
   still warm and ready
2. Automated rollback: CloudWatch alarm (error rate &gt; 5% for 5
   min) auto-promotes canary to 100%; human approval required
   within 15 minutes, else auto-rollback
3. Code provenance tracking: knew immediately which code was AI-
   generated, who verified it and for how long, and which model
4. Deployment freeze: automatic during an incident, manual
   override only for emergency fixes</div>
<div class="ascii">POST-MORTEM CONCLUSIONS
1. <span class="hl">PROCESS FAILURE, NOT AI FAILURE</span> - AI generated reasonable code
   with a missing null check; the human should have caught it and
   written a null-case test. AI is a tool, not a replacement for
   engineering.
2. VERIFICATION WAS INADEQUATE - 4 minutes for financial code is
   unacceptable; the system should have ENFORCED a minimum review
   time and made the checklist blocking.
3. CANARY DEPLOYMENT SAVED US - without canary: 100% failure,
   ₹3.6 crore/hour. With canary: 10% failure, 4 min detection.
   Impact ₹1 lakh vs a potential ₹60 lakhs.
4. BLAST RADIUS CONTAINED - only PaymentService affected; other
   services continued; circuit breakers prevented cascade.

WHAT MUST CHANGE
Immediate (this week): mandatory minimum verification time for
 Tier 3 (system blocks commits &lt; 10 min after the AI suggestion);
 mandatory checklist completion (CI enforced); mandatory null-case
 tests for all public methods; automatic review for null safety.
Medium-term (this month): AI confidence score visibility -
 "high confidence" must not mean "skip review"; add the warning
 "High confidence ≠ correct"; reviewer training on how to review
 AI-generated code; more prominent "AI-generated" PR labels.
Long-term (this quarter): Tier 0 (critical) - AI generation
 PROHIBITED for payment processing core, regulatory reporting,
 auth/authz, data encryption. Reason: the speed advantage isn't
 worth the risk. Plus automated null-safety analysis for all code
 and quarterly "AI safety" drills (simulated failures).</div>
<div class="ascii">SHOULD AI BE PROHIBITED FOR CRITICAL CODE?
FOR prohibition: critical code requires deep understanding; AI
 generates plausible-but-wrong code; speed isn't the goal on
 critical paths; regulation requires human accountability; one
 failure costs more than all AI productivity gains.
AGAINST: humans make the same mistakes (null checks!); AI + good
 process is safer than human alone; prohibition creates a two-tier
 system; developers will use AI anyway (shadow IT).
<span class="tl">THE COMPROMISE - AI is ALLOWED for critical code but with GATES:</span>
 |- AI can suggest an approach (not the implementation)
 |- human must write the core logic
 |- AI can generate tests (with human review)
 |- AI can document (always useful)
 |- two senior reviewers required (not one)
 |- formal verification where possible
 +- extended canary period (24 hours, not 4)</div>
<div class="note"><b>The CTO's reflection:</b> "This 3 AM call is exactly why I ask these uncomfortable questions. The architecture diagram looks beautiful at 2 PM in a conference room. It's at 3 AM, when production is down and money is burning, that you discover whether your system is truly resilient or just well-documented. Our canary saved us. Our provenance tracking told us what went wrong. Our rollback restored service in 4 minutes. But we still had an incident. <b>The architecture worked. The process failed.</b> And in the end, it's always the process that determines whether your beautiful architecture saves you or just documents your failure more thoroughly."</div>`},

{sec:"fut",c:"rose",eyebrow:"Category 6 · Recall",t:"r",h:"Quick recall: future-proofing",qs:[
{q:`Three techniques that make fine-tuning portable, and their migration times.`,a:`<b>LoRA adapters</b> — retrain adapters, ~1 week vs 1 month. <b>RAG-first architecture</b> — knowledge in the vector DB, not the weights, migration in <b>hours</b>. <b>Dataset preservation</b> in model-agnostic prompt/response format — retrain for ~$50K per switch.`},
{q:`What does shadow deployment cost and what does it buy?`,a:`10% traffic mirrored to a backup model on cheap/spot hardware: <b>$50–80K/year</b>. It buys immediate failover with known quality (Llama at -3% quality, +23% latency, +50% cost) instead of a 4–6 week emergency migration with unknown quality. One avoided migration saves $500K+.`},
{q:`Compliance timing: what happens to the speed advantage?`,a:`Pre-AI 4 hours per feature; AI without compliance 30 min (8× faster); <b>AI with full compliance 45 min (5.3× faster)</b>. Per-change: ~5 min without compliance vs ~25 min with. Still dramatically faster — and compliance ironically improves quality by forcing real review.`},
{q:`Recite the model collapse trajectory and the alert threshold.`,a:`Y1 100% human (baseline) &rarr; Y2 30% AI (-3%) &rarr; Y3 60% AI (-12%) &rarr; Y4 80% AI (-35%, crisis) &rarr; Y5 human and AI code converge to mediocrity. Track <b>Code Provenance Score</b>; alert when the average drops below <b>50</b>.`},
{q:`What saved the 3 AM incident, and what was the post-mortem's core conclusion?`,a:`Canary deployment (10% blast radius, ₹1 lakh vs a potential ₹60 lakh), automated rollback in 2–4 minutes, code provenance tracking, and deployment freeze. Conclusion: <b>process failure, not AI failure</b> — 4 minutes of verification on financial code with a skipped checklist.`}]},

{sec:"meta",c:"ink",eyebrow:"Q21 · The Interview Test",t:"a",h:"A21 — it's the slow, gradual decays",body:`
<div class="ascii">WHAT DOESN'T KEEP ME UP
Catastrophic failures (Q1-3): dramatic but recoverable - we have
 canary deployments, circuit breakers, rollback procedures. We'll
 lose money, hold a post-mortem, improve. <span class="dim">Keeps me awake occasionally.</span>
Edge cases (Q4-6): interesting engineering challenges - better
 context management, multi-language support, distribution shift
 detection. <span class="dim">Keeps me engaged, not worried.</span>
Organizational challenges (Q7-9): leadership, communication,
 culture. Difficult but within our control. <span class="dim">Keeps me busy, not anxious.</span>
Technical deep-dives (Q10-13): optimization problems. We'll
 iterate, measure, improve. <span class="dim">Keeps me curious, not scared.</span></div>
<div class="ascii">IT'S THE SLOW, GRADUAL DECAYS THAT KEEP ME UP AT NIGHT
Q15 SKILL OBSOLESCENCE - the generation of developers who can't
 code without AI. Not a dramatic failure, but a slow, comfortable
 slide into dependency. We won't notice until it's too late.
 We're optimizing for speed today at the expense of capability
 tomorrow.
Q19 MODEL COLLAPSE - the self-referential death spiral where AI
 trains on AI-generated code and quality slowly degrades. No
 dramatic crash - just a gradual descent into mediocrity. We'll
 all get slightly worse every quarter and blame "model
 limitations" rather than our own training data contamination.

These scenarios <span class="rs">don't trigger alerts. They don't wake anyone at
3 AM.</span> They're happening right now, in the background, and by the
time we notice it might be too late to reverse.
THEY KEEP ME UP BECAUSE:
 |- they're not technical failures (we can fix those)
 |- they're not process failures (we can improve those)
 |- they're SYSTEMIC failures in how we think about AI
 |- they require saying "no" to short-term productivity
 +- they require investing in things that feel wasteful
     (AI-free time, human code preserves, slower reviews)</div>
<div class="ascii">THE ONE I DISMISSED AS PARANOIA BUT SECRETLY WORRY ABOUT
<span class="hl">Q16 - THE INSIDER THREAT MULTIPLIER.</span>
We've built a system where one malicious platform engineer could
poison our entire codebase for months before detection. We focused
on external threats while building the perfect insider attack vector.

WHAT I'M DOING ABOUT IT - starting next month:
 |- mandatory AI-free periods for all developers (20% time)
 |- Human Code Preserve initiative (curating pure human code)
 |- insider threat program for the AI platform team
 |- quarterly "AI skills assessment" for all developers
 +- independent security audit of the fine-tuning pipeline
These will reduce short-term productivity by 15-20%.
They will be unpopular. They will be questioned by the board.
And they might just save us from the scenarios that actually
keep me up at night.</div>
<div class="note"><b>Final reflection — architect to CTO:</b> "You asked 21 questions. Some answers are architectural solutions, some are process changes, some are uncomfortable truths without clean solutions. The common thread: <b>AI is not a magic wand. It's a powerful tool that amplifies both our strengths and our weaknesses.</b> It amplifies good developers into great ones and lazy developers into dangerous ones. It amplifies good processes into excellent ones and broken processes into catastrophic ones. The organizations that succeed with AI aren't the ones with the best models or the most GPUs — they're the ones with the best processes, the strongest engineering culture, and the wisdom to know when to use AI and when to trust human judgment. Your architecture is solid, your infrastructure well-designed, your monitoring comprehensive. But your people, your processes and your culture will determine whether this platform creates ₹100 crores of value or ₹100 crores of liability. That's not an engineering question. That's a leadership question. And that's why you're the CTO."</div>`},

let i=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
tabs=document.getElementById('tabs'),counter=document.getElementById('counter'),
prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  return '<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>'
       + '<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  if(s.t==='q'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
      +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
      +'<div class="qtext">'+s.q+'</div>'
      +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
  } else if(s.t==='r'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
      +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
      +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
      +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
  } else {
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(s.cto?lens(s.cto,s.dir):'');
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===s.sec));
  prevBtn.disabled=(i===0);
  nextBtn.textContent=(i===S.length-1)?'Done \u2713':'Next \u2192';
  nextBtn.disabled=(i===S.length-1);
  document.querySelector('main').scrollTop=0;window.scrollTo(0,0);
}
prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.target.closest('details'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
