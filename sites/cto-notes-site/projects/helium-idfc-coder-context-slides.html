<script>
const SECTIONS=[
 {id:"intro",label:"START",c:"ink"},
 {id:"rel",label:"THE RELATIONSHIP",c:"teal"},
 {id:"idx",label:"5-LENS INDEX",c:"gold"},
 {id:"pipe",label:"CONTEXT PIPELINE",c:"violet"},
 {id:"db",label:"DB FIELD CARDS",c:"rose"},
 {id:"why",label:"IMPACT+ROLES",c:"amber"}
];
const S=[

{sec:"intro",c:"ink",eyebrow:"Optimus · Doc 3",t:"a",h:"How idfc-coder Sees the Codebase — <em>the Role of Helium</em>",body:`
<p>One question drives this whole deck: when idfc-coder writes code for a Jira ticket, <strong>where does its knowledge of the codebase come from?</strong> And since every database field had to be documented — how does that documentation reach the LLM too?</p>
<div class="ascii">Knowledge layer : HELIUM
Action engine   : IDFC-CODER
Validates       : imports · patterns · schema
Mode            : question-first · think before you peek</div>
<div class="note"><b>How to use:</b> every "?" slide asks you to predict first. Press Next to compare. Recall quizzes close each section.</div>`},

/* -------- RELATIONSHIP -------- */
{sec:"rel",c:"teal",eyebrow:"Relationship · 01",t:"q",q:`An LLM has read millions of Java files during training. So why can it still <b>not</b> write correct code for IDFC's codebase on its own? <span style="color:var(--dim)">Hint: what does the model know about the world's code vs this one bank's code?</span>`},

{sec:"rel",c:"teal",eyebrow:"Relationship · 01",t:"a",h:"Two boxes, two different jobs",body:`
<p>Training taught the model what bank code <em>usually</em> looks like. It never saw IDFC's private repos — so it doesn't know IDFC's real class names, real error codes, or real patterns. When it doesn't know, it guesses. <strong>The guess looks correct — and is wrong.</strong> That gap is the whole reason Helium exists.</p>
<div class="ascii">THE LIBRARIAN                      THE WRITER
+--------------------+          +--------------------+
|      HELIUM        |          |     IDFC-CODER     |
|  knows the shelf   |  facts   |  writes new pages  |
|  knows every book  | -------&gt; |  using those facts |
|  never writes      |          |  never remembers   |
+--------------------+          +--------------------+
HELIUM     answers: "what exists, and how does it work?"
IDFC-CODER answers: "given what exists, what should I build?"</div>
<div class="ascii">What breaks when one is missing:
HELIUM alone      = a great search engine that never ships code
IDFC-CODER alone  = guesses names, guesses errors,
                    confident + WRONG = <span class="rs">fluent hallucination</span>
Only TOGETHER:  facts in --&gt; correct code out</div>
<div class="note">They are <b>not one system wearing two hats</b>. They solve two different problems. Code generation only works well when both are present.</div>`},

/* -------- INDEX -------- */
{sec:"idx",c:"gold",eyebrow:"Indexing · 02",t:"q",q:`A simple text search can already find <code>UpiPaymentService.java</code>. Why is that not enough for a developer — human or AI — to change it safely? <span style="color:var(--dim)">Hint: what else do YOU look at before touching a payment service?</span>`},

{sec:"idx",c:"gold",eyebrow:"Indexing · 02",t:"a",h:"Flat search vs the five-lens knowledge graph",body:`
<p>The file is only one piece. Before changing it, a good developer also checks: the API contract it must keep, the config values it reads, the error types it should throw, and what happened last time someone touched this logic. Flat search returns none of that — so Helium searches <strong>five things at once</strong>.</p>
<div class="ascii">FLAT SEARCH (grep-style)      HELIUM (knowledge graph)
query: "upi payment"          query: "upi payment"
     |                             |
     v                    +--------+--------+
[1 file found]            v        v        v
                       [code] [API spec] [DB schema]
file only.                v        v
no contract.          [config] [history]  --&gt; merged, ranked answer</div>
<div class="ascii">THE FIVE DIMENSIONS HELIUM INDEXES
1. CODE STRUCTURE GRAPH    - classes, methods, call chains, DI wiring
2. API CONTRACTS           - OpenAPI/Swagger: routes, models, errors
3. DATABASE SCHEMAS        - tables, columns, migrations, indexes
4. CONFIG &amp; BUSINESS LOGIC - application.yml values, thresholds, rules
5. HISTORICAL CONTEXT      - git history, Jira tickets, past PR talks

query --&gt; [vector | keyword | API-contract | dependency-graph |
           config search] --&gt; ranked, merged set</div>
<p>One query pulls evidence from all five at once. A bare code search finds <code>UpiPaymentService.java</code> and stops; Helium also brings the contract it must satisfy, the config it reads, the exception type it should throw, and the last change to this exact logic.</p>`},

{sec:"idx",c:"gold",eyebrow:"Indexing · Recall",t:"r",h:"Quick recall: the five lenses",qs:[
{q:`Name the five dimensions from memory. Which one carries "why was this changed before"?`,a:`Code structure graph, API contracts, database schemas, config &amp; business logic, <b>historical context</b> — the last one holds the "why": git history, Jira tickets, old PR discussions.`},
{q:`In one line: what does flat grep-style search miss?`,a:`Everything except the file itself — <b>no contract, no config, no error patterns, no history</b>. Five-lens search returns all of it, merged and ranked.`}]},

/* -------- PIPELINE -------- */
{sec:"pipe",c:"violet",eyebrow:"Pipeline · 03",t:"q",q:`Does the LLM ever read the codebase directly? If not, <b>who decides what it gets to see</b> — and why is that decision hard? <span style="color:var(--dim)">Hint: think about the token budget. You cannot show it everything.</span>`},

{sec:"pipe",c:"violet",eyebrow:"Pipeline · 03",t:"a",h:"The wall between the LLM and the codebase",body:`
<p><strong>No — the LLM never touches the codebase.</strong> Everything it sees was fetched, ranked, and packaged by Helium before the prompt was built. The hard part: the codebase is huge and the prompt window is small. Choosing what to leave out is as important as choosing what to include.</p>
<div class="ascii">CODEBASE                        LLM
+--------------+   ████████   +--------------+
| 80+ services |   █ WALL █   |  DeepSeek    |
| 1000s files  |   ████████   |  Coder       |
+------+-------+       ^      +------^-------+
       |          LLM never          |
       v          crosses it         |
  +---------+                   +----+-----+
  | HELIUM  | -- context pkg -&gt; |  PROMPT  |
  +---------+  (picked, ranked, +----------+
                packaged facts)</div>
<div class="ascii">FULL PIPELINE - ticket to validated code
TICKET  -&gt; idfc-coder asks Helium several small, targeted questions
           ("show current UpiPaymentService structure",
            "how do I fetch customer category",
            "what error codes already exist for payments")
HELIUM  -&gt; returns a CONTEXT PACKAGE per question:
           current code · dependency to call · error-code patterns ·
           config patterns · relevant DB columns · matching test
           patterns · a similar past commit
IDFC-CODER -&gt; dedupes, ranks by task relevance, summarizes big
              files, fits it all in the token budget
PROMPT  -&gt; ticket + context package + hard rules
           ("use PaymentException, not Exception";
            "follow existing constructor-injection pattern")
GENERATED CODE -&gt; sent BACK to Helium to check:
           "does CustomerProfileService really exist?"
           "is this error code actually new?"
           "does this config class match our pattern?"
           -&gt; <span class="hl">hallucinations caught HERE, before any human sees them</span></div>`},

{sec:"pipe",c:"violet",eyebrow:"Pipeline · Think deeper",t:"q",q:`Helium is used <b>twice</b> in the pipeline. Where — and why is the second use arguably more important than the first? <span style="color:var(--dim)">Hint: what is the most dangerous kind of wrong code?</span>`},

{sec:"pipe",c:"violet",eyebrow:"Pipeline · 03b",t:"a",h:"The second use is the safety net",body:`
<div class="ascii">USE 1 (before):  Helium ---&gt; builds the prompt's facts
USE 2 (after):   generated code ---&gt; Helium ---&gt; "is this real?"</div>
<p>Even with good context, the model can still invent a class or an error code. <strong>Invented code that <em>looks</em> right is the most dangerous kind</strong> — a reviewer may approve it. The validation loop catches it with facts, not with human attention. The output is trusted only after it is checked against the same knowledge graph that built the prompt.</p>
<div class="note"><b>Why it matters in practice:</b> same model, same ticket, with vs without this pipeline. Without: wrong class names, wrong exception types, invented dependencies, a rewritten-from-scratch PR. With: the bank's real constructor-injection pattern, real error codes, real service names — because it was handed the real ones instead of guessing.</div>`},

/* -------- DB FIELDS -------- */
{sec:"db",c:"rose",eyebrow:"DB Field Context · 04",t:"q",q:`A schema dump already tells the LLM: <code>customer_category, VARCHAR(20)</code>. What is still <b>missing</b> — and why can wrong code come out of a "complete" schema? <span style="color:var(--dim)">Hint: name and type vs meaning.</span>`},

{sec:"db",c:"rose",eyebrow:"DB Field Context · 04",t:"a",h:"Database field context — a reasoned design",body:`
<div class="note"><b>Flagged clearly:</b> this section is an inferred design, not confirmed spec — a best-guess reconstruction of the "mandatory per-field documentation" requirement, consistent with the system's indexing philosophy. In an interview say: "here's how I'd design it," not "here's exactly what we built."</div>
<p>The <strong>meaning</strong> is missing. What values are allowed? Is it PII? Which business rule uses it? Which service owns it? A model that knows only "VARCHAR(20)" may hardcode a limit, write to a column another service owns, or log a regulated field. <strong>Name and type describe the box. Meaning describes what the box is for.</strong></p>
<div class="ascii">RAW SCHEMA DUMP            SEMANTIC CARD (Helium-enriched)
customer_category          customer_category
VARCHAR(20)                  meaning : UPI limit tier
NOT NULL                     values  : REGULAR|PREMIUM|MERCHANT
                             PII     : no (but regulated)
...that's it.                rule    : premium caps ₹2,00,000
LLM must GUESS               owner   : CustomerProfileService
the meaning.                 rule    : do NOT hardcode limits -
                                       read from config
                           LLM is TOLD the meaning.</div>
<div class="ascii">FULL FLOW - from write-time docs to the LLM's card
SOURCE (captured at WRITE time, not guessed later)
 |- DDL migration comments: COMMENT ON COLUMN ... IS '...'
 |- companion data-dictionary.yaml per table, committed
 |   alongside the migration
 |- entity-class Javadoc / annotations mirroring the same text
GOVERNANCE GATE (keeps the docs honest)
 |- CI schema linter: new/changed column with no dictionary
 |   entry -&gt; <span class="rs">PR BLOCKED</span>
 |- drift check: Helium's crawler reads the LIVE DB catalog
 |   (JDBC metadata), flags mismatches with the docs
HELIUM ENRICHMENT (per column, not just per table)
 |- business meaning, valid domain (ENUM), sensitivity,
 |   related rule ("premium caps ₹2,00,000 - see IDFC-7890"),
 |   owning service, change history (commit ghi789 / IDFC-9012)
DELIVERED TO THE LLM as a semantic card, not a type signature</div>`},

{sec:"db",c:"rose",eyebrow:"DB Field Context · Think deeper",t:"q",q:`Documentation always goes stale. What <b>single mechanism</b> in this design stops the LLM from trusting a three-year-old, wrong column description? <span style="color:var(--dim)">Hint: same trust pattern as the code-validation loop.</span>`},

{sec:"db",c:"rose",eyebrow:"DB Field Context · 04b",t:"a",h:"The drift check: never trust a claim, verify it",body:`
<div class="ascii">data dictionary ---&gt; compare &lt;--- live DB catalog (JDBC)
                        |
              match? -- yes --&gt; card is trusted ground truth
                        |
                        no  --&gt; <span class="rs">GOVERNANCE FAILURE</span> (same as an
                               undocumented column) -&gt; must fix</div>
<p>Helium doesn't just index the dictionary — it keeps comparing it against the live schema. Any mismatch is treated as a failure, same as an undocumented column. This closed loop is the same idea as post-generation code validation: <strong>never trust a claim, always check it against reality.</strong> That's what lets the LLM treat a column description as ground truth instead of a stale comment.</p>`},

/* -------- IMPACT + ROLES -------- */
{sec:"why",c:"amber",eyebrow:"Impact · 05",t:"q",q:`Same model, same tickets. <b>Predict two percentages:</b> the "correct class/method names" rate WITHOUT Helium, and WITH Helium. Write them down, then peek.`},

{sec:"why",c:"amber",eyebrow:"Impact · 05",t:"a",h:"Why it matters: the numbers",body:`
<p><strong>Without: 25–30%. With: 92–95%.</strong> Roughly a 3&times; jump — from mostly-wrong to almost-always-right. And the model did not change at all. Only its input did.</p>
<div class="ascii">Metric                          Without Helium   With Helium
Correct class/method names        25-30%            92-95%
Import accuracy                   40%               96%
Exception-pattern match           20%               90%
Developer rework time             2-3 hours         15-30 min
PR acceptance rate                35%               78%
Post-merge bug rate               18%               7%</div>
<div class="ascii">same model + guessed facts  --&gt;  25-30% correct names
same model + REAL facts     --&gt;  92-95% correct names
                 ^
                 |
       <span class="hl">the ONLY thing that changed</span></div>
<div class="note">The gap is <b>not model quality</b> — it's the same DeepSeek Coder both times. The entire difference is whether it was handed the bank's real codebase facts or left to guess plausible-sounding ones.</div>`},

{sec:"why",c:"amber",eyebrow:"Final Recall",t:"r",h:"Final recall: roles &amp; bottom line",qs:[
{q:`One line each: Helium's job, and idfc-coder's job. (If your two lines sound the same, revisit the Relationship section.)`,a:`<b>Helium</b> = the knowledge layer: indexes code structure, API contracts, DB schema, config, history; answers "what exists and how does it connect"; acts as the post-generation fact-checker. <b>idfc-coder</b> = the action engine: runs ticket &rarr; context &rarr; prompt &rarr; PR; decides what context fits the token budget; re-checks its own output against Helium.`},
{q:`Recite the ticket-to-PR pipeline in 6 steps.`,a:`Ticket &rarr; targeted questions to Helium &rarr; context packages returned &rarr; dedupe/rank/summarize into token budget &rarr; prompt (ticket + context + hard rules) &rarr; generate &rarr; validate generated code against Helium.`},
{q:`Say the bottom line from memory.`,a:`The LLM never gets smarter about IDFC's codebase — it stays a general-purpose model. What changes is <b>what it is shown right before it answers</b>. Helium's entire job is making sure that "what it is shown" is real: real class names, real error codes, real column meanings.`}]}
];

let i=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
tabs=document.getElementById('tabs'),counter=document.getElementById('counter'),
prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  return '<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>'
       + '<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  if(s.t==='q'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
      +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
      +'<div class="qtext">'+s.q+'</div>'
      +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
  } else if(s.t==='r'){
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
      +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
      +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
      +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
  } else {
    el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(s.cto?lens(s.cto,s.dir):'');
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===s.sec));
  prevBtn.disabled=(i===0);
  nextBtn.textContent=(i===S.length-1)?'Done \u2713':'Next \u2192';
  nextBtn.disabled=(i===S.length-1);
  document.querySelector('main').scrollTop=0;window.scrollTo(0,0);
}
prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.target.closest('details'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
</body>
</html>
