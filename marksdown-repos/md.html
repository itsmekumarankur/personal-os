<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg:       #0b0d14;
      --surface:  #13161f;
      --surface2: #1c2030;
      --border:   #2a2f47;
      --accent:   #6366f1;
      --accent-l: #818cf8;
      --cyan:     #22d3ee;
      --text:     #e2e8f0;
      --muted:    #7c87a0;
      --radius:   10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }

    .logo-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .hdr-text { flex: 1; min-width: 0; }
    .hdr-title {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-path { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      transition: border-color .15s, background .15s;
    }
    .back-btn:hover { border-color: var(--accent-l); background: var(--surface); }

    /* ── Main content ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Markdown styles ── */
    #md-body h1 { font-size: 2em; font-weight: 700; margin: 1.4em 0 .5em; color: #fff; line-height: 1.25; }
    #md-body h2 { font-size: 1.45em; font-weight: 700; margin: 1.6em 0 .5em; color: var(--accent-l); border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    #md-body h3 { font-size: 1.15em; font-weight: 600; margin: 1.3em 0 .4em; color: var(--cyan); }
    #md-body h4 { font-size: 1em; font-weight: 600; margin: 1.1em 0 .3em; color: var(--text); }
    #md-body h1:first-child { margin-top: 0; }

    #md-body p { margin: .7em 0; }

    #md-body a { color: var(--accent-l); text-decoration: none; }
    #md-body a:hover { text-decoration: underline; }

    #md-body strong { font-weight: 700; color: #fff; }
    #md-body em { color: #c9d3e8; }

    #md-body ul, #md-body ol { margin: .6em 0 .6em 1.5em; }
    #md-body li { margin: .3em 0; }
    #md-body li > p { margin: .2em 0; }

    #md-body blockquote {
      border-left: 3px solid var(--accent);
      margin: 1em 0;
      padding: .5em 1em;
      background: var(--surface2);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: #c0cce0;
      font-style: italic;
    }

    #md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2em 0;
    }

    #md-body table {
      width: 100%; border-collapse: collapse;
      margin: 1em 0; font-size: 14px;
    }
    #md-body th {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left; font-weight: 600;
      color: var(--accent-l);
    }
    #md-body td {
      border: 1px solid var(--border);
      padding: 7px 12px;
    }
    #md-body tr:nth-child(even) td { background: #0f1119; }

    /* Inline code */
    #md-body code:not(pre code) {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .88em;
      color: var(--cyan);
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    /* Code blocks */
    #md-body pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      overflow-x: auto;
      margin: 1em 0;
      font-size: 13.5px;
      line-height: 1.6;
    }
    #md-body pre code {
      background: none; border: none; padding: 0;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      color: #abb2bf;
    }

    /* ── Error / loading states ── */
    .state {
      margin: 60px auto; max-width: 480px;
      text-align: center; color: var(--muted);
    }
    .state-icon { font-size: 48px; margin-bottom: 12px; }
    .state h2 { color: var(--text); margin-bottom: 8px; }

    /* ── Progress bar ── */
    #progress {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      transition: width .3s ease;
      z-index: 200;
    }
  </style>
</head>
<body>
  <div id="progress"></div>

  <header>
    <div class="logo-icon">📄</div>
    <div class="hdr-text">
      <div class="hdr-title" id="hdr-title">Loading…</div>
      <div class="hdr-path" id="hdr-path"></div>
    </div>
    <a href="/marksdown-repos/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      All Notes
    </a>
  </header>

  <main>
    <div id="md-body"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const fileParam = params.get('file');
    const bar = document.getElementById('progress');

    function setProgress(pct) { bar.style.width = pct + '%'; }

    async function loadMarkdown() {
      if (!fileParam) {
        showError('No file specified', 'Add ?file=/path/to/file.md to the URL.');
        return;
      }

      const filename = fileParam.split('/').pop().replace(/\.md$/, '').replace(/_/g, ' ');
      document.title = filename;
      document.getElementById('hdr-title').textContent = filename;
      document.getElementById('hdr-path').textContent = fileParam;

      setProgress(30);

      try {
        const res = await fetch(fileParam);
        setProgress(70);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.text();
        renderMarkdown(raw);
        setProgress(100);
        setTimeout(() => { bar.style.opacity = '0'; }, 400);
      } catch (err) {
        showError('Could not load file', err.message);
      }
    }

    function renderMarkdown(raw) {
      marked.setOptions({
        highlight: (code, lang) => {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        },
        breaks: false,
        gfm: true,
      });
      document.getElementById('md-body').innerHTML = marked.parse(raw);
      // highlight any unhighlighted code blocks
      document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    }

    function showError(title, detail) {
      setProgress(100);
      document.getElementById('md-body').innerHTML =
        `<div class="state">
          <div class="state-icon">⚠️</div>
          <h2>${title}</h2>
          <p>${detail}</p>
        </div>`;
    }

    loadMarkdown();
  </script>
</body>
</html>
