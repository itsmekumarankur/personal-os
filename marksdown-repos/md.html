<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <!-- highlight.js theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <!-- marked v4 (last version with setOptions.highlight support) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg:       #0b0d14;
      --surface:  #13161f;
      --surface2: #1c2030;
      --border:   #2a2f47;
      --accent:   #6366f1;
      --accent-l: #818cf8;
      --cyan:     #22d3ee;
      --text:     #e2e8f0;
      --muted:    #7c87a0;
      --radius:   10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    .logo-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .hdr-text { flex: 1; min-width: 0; }
    .hdr-title {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-path { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      transition: border-color .15s, background .15s;
    }
    .back-btn:hover { border-color: var(--accent-l); background: var(--surface); }

    /* ── Page body ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 44px 24px 80px;
    }

    /* ── Markdown typography ── */
    #md h1 { font-size: 2em; font-weight: 700; margin: 1.4em 0 .5em; color: #fff; line-height: 1.25; }
    #md h2 { font-size: 1.45em; font-weight: 700; margin: 1.8em 0 .5em; color: var(--accent-l); border-bottom: 1px solid var(--border); padding-bottom: .35em; }
    #md h3 { font-size: 1.15em; font-weight: 600; margin: 1.4em 0 .4em; color: var(--cyan); }
    #md h4 { font-size: 1em; font-weight: 600; margin: 1.1em 0 .3em; color: var(--text); }
    #md h1:first-child,
    #md h2:first-child { margin-top: 0; }

    #md p { margin: .75em 0; }

    #md a { color: var(--accent-l); text-decoration: none; }
    #md a:hover { text-decoration: underline; }

    #md strong { font-weight: 700; color: #fff; }
    #md em { color: #c4cedf; }

    #md ul, #md ol { margin: .6em 0 .6em 1.6em; }
    #md li { margin: .3em 0; }
    #md li > p { margin: .15em 0; }

    #md blockquote {
      border-left: 3px solid var(--accent);
      margin: 1.1em 0;
      padding: .55em 1em;
      background: var(--surface2);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: #b8c8dc;
      font-style: italic;
    }
    #md blockquote strong { color: #d6e0ef; }

    #md hr { border: none; border-top: 1px solid var(--border); margin: 2.2em 0; }

    /* Tables */
    #md table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 14px; }
    #md th {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 8px 12px; text-align: left; font-weight: 600; color: var(--accent-l);
    }
    #md td { border: 1px solid var(--border); padding: 7px 12px; }
    #md tr:nth-child(even) td { background: #0f1119; }

    /* Inline code */
    #md :not(pre) > code {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .875em;
      color: var(--cyan);
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    /* Code blocks */
    #md pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      overflow-x: auto;
      margin: 1.1em 0;
      line-height: 1.6;
    }
    #md pre code {
      background: none !important;
      border: none !important;
      padding: 0;
      font-size: 13.5px;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    /* ── States ── */
    .state { margin: 80px auto; max-width: 440px; text-align: center; color: var(--muted); }
    .state-icon { font-size: 44px; margin-bottom: 14px; }
    .state h2 { color: var(--text); font-size: 1.2em; margin-bottom: 8px; }

    /* ── Progress bar ── */
    #bar {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      transition: width .25s ease;
      z-index: 200;
    }
  </style>
</head>
<body>
  <div id="bar"></div>

  <header>
    <div class="logo-icon">📄</div>
    <div class="hdr-text">
      <div class="hdr-title" id="hdr-title">Loading…</div>
      <div class="hdr-path" id="hdr-path"></div>
    </div>
    <a href="/marksdown-repos/" class="back-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      All Notes
    </a>
  </header>

  <main><div id="md"></div></main>

  <script>
    const params  = new URLSearchParams(location.search);
    const filePath = params.get('file');   // e.g. /marksdown-repos/AI/Saturday/file.md
    const bar     = document.getElementById('bar');

    function progress(pct) { bar.style.width = pct + '%'; }

    async function load() {
      if (!filePath) { return showErr('No file specified', 'Add ?file=/path/to/note.md to the URL.'); }

      const name = filePath.split('/').pop().replace(/\.md$/i, '').replace(/_/g, ' ');
      document.title = name;
      document.getElementById('hdr-title').textContent = name;
      document.getElementById('hdr-path').textContent  = filePath;

      progress(25);

      try {
        // ?raw=1 bypasses the .htaccess rewrite so we get the raw markdown text
        const res = await fetch(filePath + '?raw=1');
        progress(65);
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
        const text = await res.text();
        render(text);
        progress(100);
        setTimeout(() => { bar.style.opacity = '0'; }, 500);
      } catch (e) {
        showErr('Could not load note', e.message);
      }
    }

    function render(raw) {
      marked.setOptions({
        langPrefix: 'hljs language-',
        gfm: true,
        breaks: false,
        highlight(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        }
      });
      document.getElementById('md').innerHTML = marked.parse(raw);
      // catch any blocks highlight missed
      document.querySelectorAll('#md pre code').forEach(el => hljs.highlightElement(el));
    }

    function showErr(title, detail) {
      progress(100);
      document.getElementById('md').innerHTML =
        `<div class="state">
           <div class="state-icon">⚠️</div>
           <h2>${title}</h2>
           <p>${detail}</p>
         </div>`;
    }

    load();
  </script>
</body>
</html>
