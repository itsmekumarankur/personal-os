apiVersion: v1
kind: Service
metadata:
  name: payment-service              # other pods call http://payment-service (built-in discovery + load balancing)
spec:
  selector:
    app: payment-service             # BLUE-GREEN: change this to e.g. {app: payment-service, version: v2} to flip traffic
  ports:
    - port: 80
      targetPort: 8080
